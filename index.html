<script>
  // Kullanıcının kendi Anthropic API anahtarını yönetir. Her müşteri kendi
  // anahtarını Ayarlar bölümünden girer; AI faturası doğrudan ona kesilir.
  // "rpusula__" ön ekiyle saklanan her anahtar otomatik olarak Firestore'a da
  // senkronize edilir (pdrSyncDown ile), böylece anahtar tarayıcıya değil hesaba bağlı olur.
  function pdrGetApiKey() {
    return localStorage.getItem("rpusula__apiKey") || "";
  }
  function pdrSetApiKey(key) {
    const trimmed = key.trim();
    localStorage.setItem("rpusula__apiKey", trimmed);
    const user = window.pdrAuth && window.pdrAuth.currentUser;
    if (user && window.pdrDb) {
      window.pdrDb.collection("users").doc(user.uid).collection("data").doc("apiKey")
        .set({ value: trimmed, updatedAt: Date.now() })
        .catch(err => console.log("API anahtarı buluta kaydedilemedi:", err));
    }
  }
  // Tüm AI çağrılarının geçtiği tek nokta. Eski Cloudflare Worker çağrılarının
  // yerini alır — { model, max_tokens, system, messages } aynı formatı kabul eder.
  async function pdrCallClaude(payload) {
    const apiKey = pdrGetApiKey();
    if (!apiKey) {
      throw new Error("API_KEY_MISSING");
    }
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error("API_ERROR: " + errText);
    }
    return res;
  }
</script>

.pdr-splash-star.l4 { animation-delay: -0.18s;  opacity:0.13; filter:blur(6px);   z-index:2; }

  (function pdrSplashParticles() {
    var container = document.getElementById('splash');
    if (!container) return;
    for (var i = 0; i < 20; i++) {

  const ticksGroup = document.getElementById('pdr-ticks');

  const cx = 340, cy = 340, rOuter = 315, rInner = 300;
  for (let i = 0; i < 72; i++) {
    const angle = (i * 5) * Math.PI / 180;
    const x1 = cx + rInner * Math.sin(angle);
    const y1 = cy - rInner * Math.cos(angle);
    const x2 = cx + rOuter * Math.sin(angle);
    const y2 = cy - rOuter * Math.cos(angle);
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1); line.setAttribute("y1", y1);
    line.setAttribute("x2", x2); line.setAttribute("y2", y2);

// verilerinin görünmemesi için, önce yerel "rpusula__" anahtarlarını temizleriz.
function pdrClearLocalCache() {
  const toRemove = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith("rpusula__")) toRemove.push(k);
  }
  toRemove.forEach((k) => localStorage.removeItem(k));
}

async function pdrSyncDown(uid) {
  const lastUid = localStorage.getItem("pdr_last_uid");
  if (lastUid && lastUid !== uid) {
    // Cihazda önceden başka bir hesap açılmış — eski veriler karışmasın diye temizle.
    pdrClearLocalCache();
  }
  localStorage.setItem("pdr_last_uid", uid);
  try {
    const snap = await pdrDb.collection("users").doc(uid).collection("data").get();
    for (const doc of snap.docs) {
      const d = doc.data();
      let deger = null;
      if (d && d.chunked) {
        deger = await pdrParcalariBirlestir(uid, doc.id, d.parcaSayisi || 0);
      } else if (d && typeof d.value === "string") {
        deger = d.value;
      }
      if (deger !== null) {
        try { localStorage.setItem("rpusula__" + doc.id, deger); }
        catch (e) { console.warn("Yerel depolama dolu, atlanıyor:", doc.id, e); }
      }
    }
  } catch (e) { console.log("Firestore indirme hatası:", e); }
}

// Firestore tek doküman başına ~1MB sınırına sahiptir. Büyük veriler (yıllar
// içinde biriken görüşme kayıtları gibi) bu sınırı aşabilir; bunu aşmak için
// büyük değerleri otomatik olarak parçalara bölüp ayrı dokümanlarda saklıyoruz.
const PDR_PARCA_LIMIT = 700000; // güvenli pay bırakılmış karakter sınırı

async function pdrParcalariBirlestir(uid, key, parcaSayisi) {
  let birlesik = "";
  for (let i = 0; i < parcaSayisi; i++) {
    try {
      const parcaSnap = await pdrDb.collection("users").doc(uid).collection("data_chunks").doc(`${key}__${i}`).get();
      birlesik += parcaSnap.exists ? (parcaSnap.data().deger || "") : "";
    } catch (e) { console.warn("Parça okunamadı:", key, i, e); }
  }
  return birlesik;
}

async function pdrEskiParcalariTemizle(uid, key) {
  try {
    const batch = pdrDb.batch();
    for (let i = 0; i < 60; i++) {
      batch.delete(pdrDb.collection("users").doc(uid).collection("data_chunks").doc(`${key}__${i}`));
    }
    await batch.commit();
  } catch (e) { /* sessizce geç — parça yoksa zaten silinecek bir şey yok */ }
}

async function pdrFirestoreYaz(uid, key, value) {
  const ref = pdrDb.collection("users").doc(uid).collection("data").doc(key);
  if (value.length <= PDR_PARCA_LIMIT) {
    await ref.set({ value, chunked: false, updatedAt: Date.now() });
    await pdrEskiParcalariTemizle(uid, key);
    return;
  }
  const parcaSayisi = Math.ceil(value.length / PDR_PARCA_LIMIT);
  const batch = pdrDb.batch();
  for (let i = 0; i < parcaSayisi; i++) {
    const parca = value.slice(i * PDR_PARCA_LIMIT, (i + 1) * PDR_PARCA_LIMIT);
    batch.set(pdrDb.collection("users").doc(uid).collection("data_chunks").doc(`${key}__${i}`), { deger: parca, updatedAt: Date.now() });
  }
  batch.set(ref, { chunked: true, parcaSayisi, updatedAt: Date.now() });
  await batch.commit();
}

async function pdrFirestoreOku(uid, key) {
  const snap = await pdrDb.collection("users").doc(uid).collection("data").doc(key).get();
  if (!snap.exists) return null;
  const d = snap.data();
  if (d.chunked) return await pdrParcalariBirlestir(uid, key, d.parcaSayisi || 0);
  return typeof d.value === "string" ? d.value : null;
}

// kapatılır. Amaç: öğrenci verisi ekranda açık kalmış bir cihazın başından
// kalkıp gidilmesi durumunda verinin başkasına açık kalmasını önlemek.
//
// NOT: Basit bir setTimeout yeterli değil — mobil tarayıcılar, sekme arka
// plana atıldığında ya da ekran kilitlendiğinde JS zamanlayıcılarını
// duraklatabiliyor/yavaşlatabiliyor (pil tasarrufu). Bu yüzden zamanlayıcı
// yerine "son etkileşim zamanı" kaydedilir ve periyodik olarak + sekme tekrar
// öne geldiğinde kontrol edilir — arka planda geçen süre de doğru sayılır.
const PDR_INAKTIVITE_SURESI = 10 * 60 * 1000; // 10 dakika
let pdrSonEtkilesimZamani = Date.now();
function pdrInaktiviteSifirla() {
  pdrSonEtkilesimZamani = Date.now();
}
function pdrInaktiviteKontrolEt() {
  if (!pdrAuth.currentUser) return;
  if (Date.now() - pdrSonEtkilesimZamani >= PDR_INAKTIVITE_SURESI) {
    pdrAuth.signOut().then(() => {

      localStorage.removeItem("pdr_last_uid");
      location.reload();
    });
  }
}
["mousedown", "mousemove", "keydown", "touchstart", "scroll"].forEach(evt => {

let pdrFirstReady = true;
let pdrBasvuruUnsub = null; // admin onay durumunu canlı izleyen dinleyici — oturum boyunca aktif
pdrAuth.onAuthStateChanged(async (user) => {
  const splashEl = document.getElementById("splash");
  if (user) {
    if (pdrLoginOverlay) pdrLoginOverlay.style.display = "none";
    if (pdrLogoutBtn) pdrLogoutBtn.style.display = "block";

    // Admin hariç herkes için onay durumu kontrolü
    if (user.email !== PDR_ADMIN_EMAIL) {
      const basvuru = await pdrOnayDurumuGetir(user);
      if (basvuru.durum !== "onayli") {
        if (splashEl) splashEl.className = "hide";
        pdrOnayEkraniGoster(basvuru.durum);
        return;
      }
      // Onaylı ama ne ücretsiz ne de ödemesi alınmış, YA DA geçen yılın erişim
      // süresi dolmuş (eğitim yılı sonu geçmiş, yeni yıl için ödeme gerekiyor) —
      // erişimi ödeme bekleme ekranında durdur.
      const pdrSuresiDolmus = !basvuru.ucretsiz && basvuru.erisimBitis && Date.now() > basvuru.erisimBitis;
      if ((!basvuru.ucretsiz && !basvuru.odemeAlindi) || pdrSuresiDolmus) {
        if (splashEl) splashEl.className = "hide";
        pdrOdemeEkraniGoster();
        return;
      }

      // Erişim onaylandı — ama admin oturum SIRASINDA onayı geri alabilir (örn. birini
      // reddetmek/beklemeye almak). Bunu anlık yakalamak için başvuru kaydını canlı izle:
      // admin durumu değiştirir değiştirmez (birkaç saniye içinde), kullanıcı otomatik
      // olarak ilgili engel ekranına düşer — sayfayı yenilemesi ya da yeniden giriş
      // yapması gerekmez. Aynı şekilde tekrar onaylanırsa engel ekranı da otomatik kapanır.
      if (pdrBasvuruUnsub) { pdrBasvuruUnsub(); pdrBasvuruUnsub = null; }
      pdrBasvuruUnsub = pdrDb.collection("basvurular").doc(user.uid).onSnapshot(snap => {
        const b = snap.data();
        if (!b) return;
        const suresiDolmus = !b.ucretsiz && b.erisimBitis && Date.now() > b.erisimBitis;
        if (b.durum !== "onayli") {
          pdrOdemeEkraniGizle();
          pdrOnayEkraniGoster(b.durum);
        } else if ((!b.ucretsiz && !b.odemeAlindi) || suresiDolmus) {
          pdrOnayEkraniGizle();
          pdrOdemeEkraniGoster();
        } else {
          pdrOnayEkraniGizle();
          pdrOdemeEkraniGizle();
        }
      });
    }
    pdrOnayEkraniGizle();
    pdrOdemeEkraniGizle();
    pdrInaktiviteSifirla();

    await pdrSyncDown(user.uid);
    if (pdrFirstReady) { pdrFirstReady = false; pdrResolveReady(user); }
  } else {
    if (pdrBasvuruUnsub) { pdrBasvuruUnsub(); pdrBasvuruUnsub = null; }
    if (splashEl) splashEl.className = "hide";
    if (pdrLoginOverlay) pdrLoginOverlay.style.display = "flex";
    if (pdrLogoutBtn) pdrLogoutBtn.style.display = "none";
    pdrOnayEkraniGizle();
    pdrOdemeEkraniGizle();
  }
});

// Storage API — localStorage tabanlı + Firestore bulut senkronizasyonu
window.storage = {
  get: async (key) => {
    try {
      const v = localStorage.getItem("rpusula__" + key);
      if (v !== null) return { key, value: v };
    } catch (e) { console.warn("Yerel okuma hatası:", key, e); }
    // Yerelde yoksa (örn. yeni cihaz, henüz senkronize olmadı) doğrudan buluttan dene
    const user = pdrAuth.currentUser;
    if (!user) return null;
    try {
      const bulutDeger = await pdrFirestoreOku(user.uid, key);
      if (bulutDeger !== null) {
        try { localStorage.setItem("rpusula__" + key, bulutDeger); } catch {}
        return { key, value: bulutDeger };
      }
    } catch (e) { console.warn("Bulut okuma hatası:", key, e); }
    return null;
  },
  set: async (key, value) => {
    let yerelBasarili = true;
    try {
      localStorage.setItem("rpusula__" + key, value);
    } catch (e) {
      yerelBasarili = false;
      console.warn("Yerel depolama dolu — bu cihazda kapasite doldu, sadece buluta yazılacak:", key, e);
    }
    const user = pdrAuth.currentUser;
    if (user) {
      pdrFirestoreYaz(user.uid, key, value).catch(err => console.log("Firestore yazma hatası:", key, err));
    }
    return yerelBasarili ? { key, value } : (user ? { key, value } : null);
  },
  delete: async (key) => {
    localStorage.removeItem("rpusula__" + key);
    const user = pdrAuth.currentUser;
    if (user) {
      pdrDb.collection("users").doc(user.uid).collection("data").doc(key).delete().catch(() => {});
      pdrEskiParcalariTemizle(user.uid, key);
    }
    return { key, deleted: true };
  },
  list: async (prefix) => {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("rpusula__" + (prefix || ""))) {
        keys.push(k.replace("rpusula__", ""));
      }
    }
    return { keys };
  }
};

async function getRiskAnalizi(riskForm, gorusmeler, profil1, kutuphaneOzetleri = [], kademe = "", denemeOzet = null) {
  const gorusmeBolum = gorusmeler.length > 0
    ? "GÖRÜŞME NOTLARI:\n" + gorusmeler.map((r,i)=>`Görüşme ${i+1} (${r.date}): ${r.summary}`).join("\n\n")
    : "Görüşme kaydı yok.";
  const profilBolum = profil1
    ? "PDR PROFİL PUANLARI:\n" + Object.entries(profil1.scores||{}).map(([k,v])=>`${k}: ${v}/5`).join(", ")
    : "";
  // Deneme özeti — öğrenci listesindeki otomatik risk rozetiyle AYNI veriye
  // dayanır (deneme ortalaması + risk düzeyi). Amaç: özellikle "Akademik" risk
  // türünde değerlendirmenin sadece görüşme notlarına değil, gerçek akademik
  // performansa da dayanmasını sağlamak; ayrıca iki farklı sinyal (deneme vs.
  // görüşme) birbirinden çok farklı bir tablo çiziyorsa bunu AI'ın fark edip
  // açıkça belirtmesini sağlamak — danışman ekranda "Riskli" rozeti görüp,
  // AI analizinde "Hafif" okuyunca kafası karışmasın.
  const denemeBolum = denemeOzet
    ? `DENEME/AKADEMİK DURUM:\nOrtalama: ${denemeOzet.ortalama}${denemeOzet.toplam?`/${denemeOzet.toplam}`:""}\nDeneme bazlı risk düzeyi: ${denemeOzet.risk || "belirsiz"} (kaynak: ${denemeOzet.kaynak})\n`
    : "";
  const kutuphaneBaglam = pdrKutuphaneBaglam(kutuphaneOzetleri);
  const kademeMetni = kademeBaglamMetni(kademe);
  const prompt = `Öğrenci: ${riskForm.studentName} (${riskForm.className})
Risk Türü: ${riskForm.riskTuru}
Öncelik: ${riskForm.oncelik}
Açıklama: ${riskForm.aciklama}
${kademeMetni}

${gorusmeBolum}
${profilBolum}
${denemeBolum}${kutuphaneBaglam}

Bu öğrencinin risk durumunu değerlendir:

RİSK TÜRÜ: (Şu türlerden EN UYGUN birini seç — sadece türün adını yaz: Davranış / Akademik / Aile / Akran-Zorbalık / Duygusal / Devamsızlık / Öz Zarar / Sağlık / Madde Kullanımı / Teknoloji-Ekran Bağımlılığı / Ekonomik Güçlük / Yas-Kayıp / Travma / Özel Öğrenme Güçlüğü / Diğer)
RİSK DÜZEYİ: (HAFİF / ORTA / YÜKSEK — net belirt. Deneme/akademik veri varsa bunu da hesaba kat, sadece görüşme notlarına dayanma.)
RİSK DEĞERLENDİRMESİ: (Bu risk neden önemli, nasıl yorumlanmalı — 2-3 cümle. Deneme sonucu ile görüşme notlarının işaret ettiği tablo BİRBİRİNDEN BELİRGİN ŞEKİLDE FARKLIYSA — örn. deneme riski yüksek ama görüşme notu yoksa/hafifse, ya da tam tersi — bunu açıkça "Not: Deneme sonuçları ile görüşme notları farklı bir tablo çiziyor" diyerek belirt.)
KORUYUCU FAKTÖRLER: (Öğrencinin güçlü yönleri ve koruyucu faktörler)
ACİL MÜDAHALE GEREKTİRİR Mİ: (Evet/Hayır — gerekçesiyle)
ÖNERİLEN ADIMLAR:
1.
2.
3.

TEKNOLOJİ/EKRAN BAĞIMLILIĞI TARAMASI: (Ana risk türünden bağımsız, HER ZAMAN yap — görüşme notlarında ekran/telefon/oyun kullanımına dair ipucu olsun ya da olmasın.) Önce şu klinik ölçütleri gözden geçir: (1) uyku düzeninde bozulma / geç saatlere kadar ekran başında kalma, (2) sosyal etkinliklerden veya yüz yüze arkadaşlıklardan çekilme, (3) akademik performansta gözle görülür düşüş, (4) ekran süresini azaltma girişimlerinde başarısızlık veya bu konuda huzursuzluk/öfke, (5) aile içi çatışmaların ekran kullanımı etrafında yoğunlaşması. Bu ölçütlere göre SADECE görüşme notlarında somut dayanak varsa değerlendirme yap; not yoksa ya da yetersizse "Yetersiz Veri" de, tahmin yürütme. Şu formatta yaz:
BELİRTİ: (Var / Yok / Yetersiz Veri)
GEREKÇE: (hangi ölçütlere ve görüşme notlarındaki hangi ifadelere dayandığını 1-2 cümlede belirt; "Yetersiz Veri" ise nedenini belirt)

GÖRÜŞME NOTLARINDA TON/İÇERİK DEĞİŞİMİ: (En az 3 görüşme kaydı varsa yap; azsa "Yetersiz Veri — en az 3 görüşme gerekir" de.) İlk görüşmeler ile son görüşmeleri karşılaştır: dil, duygu durumu, konu içeriği belirgin şekilde kötüleşmiş mi (örn. önceden nötr/olumlu notlar sonradan sürekli olumsuz/içine kapanık/öfkeli bir tona dönüşmüş mü)? Şu formatta yaz:
DEĞİŞİM: (Var / Yok / Yetersiz Veri)
GEREKÇE: (somut hangi ifadelerin değiştiğini 1-2 cümlede belirt)

${kademe ? "Değerlendirmeyi öğrencinin yaş/gelişim dönemine uygun şekilde yap. " : ""}${kutuphaneOzetleri.length > 0 ? "Kütüphane referanslarından (özellikle varsa yönetmelik/mevzuat maddelerinden) yararlan. " : ""}Sade, PDR diline uygun yaz. Markdown kullanma.`;

  const res = await pdrCallClaude({
      model: "claude-sonnet-4-6", max_tokens: 2000,
      system: "Sen Dr. Ayse Kara'sin — 20 yillik klinik deneyime sahip PDR uzmani ve psikologsun. BDT, baglanma teorisi, gelisim psikolojisi ve aile sistemleri perspektifinden risk degerlendirmesi yaparsın. Risk duzeyini net belirt: HAFIF (gunluk isleyisi minimal etkiliyor), ORTA (mudahale gerekiyor, takip sart), YUKSEK (acil mudahale, uzman yonlendirme gerekebilir).",
      messages: [{ role: "user", content: prompt }]
    });
  const data = await res.json();
  return data.content?.[0]?.text || "";
}

async function getDenemeAnalizi(studentName, gorusmeler, denemeGirilen, kutuphaneOzetleri = [], sinavTuru = "lgs") {
  const dersListesi = aktifDersler(sinavTuru);
  const toplamSoru = dersListesi.reduce((s,d)=>s+d.maks, 0);
  const sinavAdi = (SINAV_TURLERI[sinavTuru] || SINAV_TURLERI.lgs).ad;
  const gorusmeBolum = gorusmeler.length > 0
    ? "GORUSME NOTLARI:\n" + gorusmeler.map((r,i)=>`Gorusme ${i+1} (${r.date}${r.topic?", "+r.topic:""}): ${r.summary}`).join("\n\n")
    : "Gorusme kaydi yok.";

  const denemeBolum = denemeGirilen.length > 0
    ? "DENEME SONUCLARI:\n" + denemeGirilen.map(d=>{
        const dersMetni = dersListesi.map(ld=>`${ld.label.substring(0,3)}: ${parseFloat(d.nets?.[ld.key]||0).toFixed(1)}/${ld.maks}`).join(", ");
        return `D${d.no}: Toplam ${d.toplam.toFixed(1)}/${toplamSoru} — ${dersMetni}`;
      }).join("\n")
    : "Deneme verisi yok.";

  const avg = denemeGirilen.length > 0
    ? (denemeGirilen.reduce((s,d)=>s+d.toplam,0)/denemeGirilen.length).toFixed(1) : null;
  const trend = denemeGirilen.length > 1
    ? (denemeGirilen[denemeGirilen.length-1].toplam - denemeGirilen[0].toplam).toFixed(1) : null;

  // En zayif ve guclu dersler
  let dersOrtalamalari = {};
  if (denemeGirilen.length > 0) {
    dersListesi.forEach(ld => {
      const vals = denemeGirilen.map(d => parseFloat(d.nets?.[ld.key]||0));
      dersOrtalamalari[ld.label] = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
    });
  }
  const dersSirali = Object.entries(dersOrtalamalari).sort((a,b)=>parseFloat(b[1])-parseFloat(a[1]));
  const kutuphaneBaglam = pdrKutuphaneBaglam(kutuphaneOzetleri);
  const hedefSatiri = sinavTuru === "lgs"
    ? `HEDEF OKUL ARALIĞI: (Mevcut ${avg||"?"}/${toplamSoru} ortalamaya gore hangi liselere gidebilir — somut okul turu belirt)`
    : `HEDEF ÜNİVERSİTE/BÖLÜM ARALIĞI: (Mevcut ${avg||"?"}/${toplamSoru} ortalamaya gore hangi bölüm/üniversite düzeyine yönelebilir — somut belirt)`;

  const prompt = `Ogrenci: ${studentName}
${avg ? `Deneme Ortalamasi: ${avg}/${toplamSoru}` : ""}
${trend ? `Trend: ${parseFloat(trend)>=0?"+":""}${trend} net (ilk denemeden son denemeye)` : ""}
${dersSirali.length > 0 ? `Ders Ortalamalari: ${dersSirali.map(([k,v])=>`${k}: ${v}`).join(", ")}` : ""}

${denemeBolum}

${gorusmeBolum}${kutuphaneBaglam}

${sinavAdi} hazirlik surecini kapsamli analiz et:

AKADEMIK DURUM: (Genel net performansi ve yuzdelik dilim tahmini)
${hedefSatiri}
TREND ANALIZI: (Gelisim mi, gerileme mi, neden — psikolojik ve akademik acikla)
DERS BAZLI ANALIZ: (En guclu ve en zayif dersler, zayif derslerde calisma onerisi)
PSIKOLOJIK BAGLAY: (Gorusme notlarina gore akademik performansi etkileyen psikolojik faktorler)
CALISMA PLANI:
1. (Hangi derse kac saat — somut plan)
2. (Deneme stratejisi)
3. (Kaygı yonetimi / motivasyon)
HEDEF: (Son denemeler icin gercekci hedef net ve hedef okul)

Sade, somut, PDR ve ogr. koçlugu diline uygun yaz. Markdown kullanma.`;

  const res = await pdrCallClaude({
      model: "claude-sonnet-4-6", max_tokens: 4000,
      system: LGS_KOCLUK,
      messages: [{ role: "user", content: prompt }]
    });
  const data = await res.json();
  return data.content?.[0]?.text || "";
}


async function getScoresFromNotes(studentName, notlar) {
  const boyutlar = DIMENSIONS.map(d => d.key + " (" + d.label + ")").join(", ");
  const prompt = "Ogrenci: " + studentName + "\n\nAsagidaki notlara dayanarak ogrenciyi 8 boyutta 1-5 arasinda puanla:\n" + boyutlar + "\n\n1=Cok Dusuk, 2=Dusuk, 3=Orta, 4=Iyi, 5=Cok Iyi. Notlarda bilgi yoksa 3 ver.\n\nNotlar:\n" + notlar + "\n\nSADECE su formatta JSON dondur:\n{\"akademik\":X,\"sosyal\":X,\"duygusal\":X,\"aile\":X,\"ozguven\":X,\"uyum\":X,\"kariyer\":X,\"akran\":X}";
  const res = await pdrCallClaude({
      model: "claude-sonnet-4-6", max_tokens: 200,
      system: "Sen 20 yillik klinik deneyime sahip PDR uzmani Dr. Ayse Kara'sin. Gorusme notlarini analiz edip SADECE JSON formatinda puan dondur. Baska hicbir sey yazma.",
      messages: [{ role: "user", content: prompt }],
    });
  const data = await res.json();
  const text = data.content?.[0]?.text || "{}";
  try {
    const clean = text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean);
    const clamped = {};
    DIMENSIONS.forEach(d => { clamped[d.key] = Math.min(5, Math.max(1, Math.round(parsed[d.key] || 3))); });
    return clamped;
  } catch { return { ...EMPTY_SCORES }; }
}

async function getP2Analiz({ studentName, className, sinavlar, d2, ilgiler, kariyer_hedef, aile_notu, gorusmeler, denemeGirilen, sinavTuru = "lgs" }) {
  const dersListesi = aktifDersler(sinavTuru);
  const toplamSoru = dersListesi.reduce((s,d)=>s+d.maks, 0);
  const dersMetni = DERSLER.map(d => {
    const v1 = parseFloat(sinavlar?.[d.key+"1"]);
    const v2 = parseFloat(sinavlar?.[d.key+"2"]);
    const vo = parseFloat(sinavlar?.[d.key]);
    if (!isNaN(v1) && !isNaN(v2)) return `${d.label}: 1.Yazili ${v1}, 2.Yazili ${v2}, Ort ${((v1+v2)/2).toFixed(1)}/100`;
    if (!isNaN(v1)) return `${d.label}: 1.Yazili ${v1}/100`;
    if (!isNaN(v2)) return `${d.label}: 2.Yazili ${v2}/100`;
    if (!isNaN(vo)) return `${d.label}: ${vo}/100`;
    return null;
  }).filter(Boolean).join(", ");

  const d2Metni = d2 && (d2.TN || d2.TN_E) ? `D2 Dikkat Testi: TN=${d2.TN||"—"}, E1=${d2.E1||"—"}, E2=${d2.E2||"—"}, TN-E=${d2.TN_E||"—"}, E%=${d2.E_yuzde||"—"}, PR=${d2.PR||"—"}` : "";

  const avg = denemeGirilen && denemeGirilen.length > 0
    ? (denemeGirilen.reduce((s,d)=>s+d.toplam,0)/denemeGirilen.length).toFixed(1)
    : null;

  const prompt = `Ogrenci: ${studentName}${className ? `, Sinif: ${className}` : ""}
${gorusmeler ? "\nGORUSME NOTLARI:\n" + gorusmeler : ""}
YAZILI SINAV PUANLARI: ${dersMetni || "Girilmemis"}

${denemeBolum}

Aile Notu: ${aile_notu || "Yok"}

Bu ogrencinin akademik ve dikkat profil analizini yap:

AKADEMIK DURUM: (yazili sinav puanlarina gore guclu/zayif dersler, genel akademik profil)
DIKKAT PROFİLİ: ${d2Metni ? "(D2 sonuclarini yorumla — TN psikomotor hiz, E1 secici dikkat, TN-E performans, E% hata orani, PR yuzdelik. Dikkat destegi gerekip gerekmedigini belirt)" : "(D2 verisi girilmemis)"}
DENEME ANALİZİ: ${avg ? `(Deneme ortalamasi ${avg}/90 — LGS hedef okul araligini belirt, gidebilecegi liseleri soylet, trend varsa yorum yap)` : "(Deneme verisi yok)"}
İLGİ-KARİYER UYUMU: (ilgi alanlari ile kariyer hedefi arasindaki uyum)
LGS CALISMA ONERISI: (ders bazli somut calisma stratejisi, hangi derse ne kadar agirlik verilmeli)
ONERILER:

Sade, PDR diline uygun, somut yaz. Markdown kullanma.`;

  const res = await pdrCallClaude({

async function getAISummary(rawText) {
  const res = await pdrCallClaude({
      model: "claude-sonnet-4-6", max_tokens: 1000,
      system: `Sen Dr. Ayse Kara'sin - 20 yillik klinik deneyime sahip, okul psikolojik danismanligi alaninda uzmanlasmis bir psikolog ve PDR uzmanisin. Bilissel Davranisci Terapi (BDT) temel yonelimindir: otomatik dusunceler, bilissel carpitmalar, sema teorisi, davranissal aktivasyon ve maruz birakma tekniklerini klinik pratikte ustaca kullanirsin. Baglanma teorisi (Bowlby, Ainsworth), aile sistemleri terapisi (Minuchin, Bowen) ve gelisim psikolojisi (Piaget, Vygotsky, Erikson) perspektifinden bireyi cevresiyle birlikte degerlendirirsin. Sosyolojide Bourdieu'nun habitus ve kulturel sermaye kavramlari, Giddens'in yapilasmasi ve sosyal tabakalasmanin psikolojik etkilerini Turkiye baglaminda okursun: aile baskisi, toplumsal cinsiyet rolleri, sinav odakli egitimin cocuk uzerindeki yukunu sosyolojik zemine oturtursun. Felsefi temetin: Frankl anlam terapisi, Sartre sorumluluk etigi, Stoa kontrol alani, fenomenolojinin oznel deneyim odagi. Uslubun: yargilamayan, merak eden, guclu yonlere odaklanan, somut ve uygulanabilir oneriler sunan, Turkce yazan, PDR diline hakim bir klinisyen.

GOREV - GORUSME NOTU OZETI: Danismanin anlattigi gorusme notunu kisa ve net ozete donustur. Basliklar (sadece ilgililer): Ogrenci durumu (BDT: bilissel-duygusal-davranissal oruntu), Gorusmede one cikan (baglanma, otomatik dusunceler, stres-basa cikma, sosyal dinamikler, varolussel temalar), Yapilan/planlanan, Takip notu. Max 5-6 cumle. Sade PDR dili. JSON veya markdown kullanma.`,
      messages: [{ role: "user", content: rawText }],
    });
  const data = await res.json();
  return data.content?.[0]?.text || "";
}

// Kapasite kontrolü
async function storageKapasite() {
  try {
    let total = 0;
    for (let i=0; i<localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("rpusula__")) total += (localStorage.getItem(k)||"").length * 2;
    }
    const mb = (total/1024/1024).toFixed(2);
    return { used: parseFloat(mb), limit: 5, yuzde: Math.round((parseFloat(mb)/5)*100) };
  } catch { return { used:0, limit:5, yuzde:0 }; }
}

// Büyük array'leri chunk'lara böl (görüşme notları için)
async function saveChunked(baseKey, items) {
  const CHUNK = 150; // 150 kayıt/chunk — daha az storage yazma
  if (items.length <= CHUNK) {
    await window.storage.set(baseKey, JSON.stringify(items));
    await window.storage.delete(baseKey + "-meta");
    return;
  }
  const chunkCount = Math.ceil(items.length/CHUNK);
  await window.storage.set(baseKey + "-meta", JSON.stringify({ chunks: chunkCount }));
  for (let i=0; i<chunkCount; i++) {
    await window.storage.set(baseKey + "-c" + i, JSON.stringify(items.slice(i*CHUNK, (i+1)*CHUNK)));
  }
}

async function loadChunked(baseKey) {
  try {
    const meta = await window.storage.get(baseKey + "-meta");
    if (!meta) {
      const r = await window.storage.get(baseKey);
      return r ? JSON.parse(r.value) : [];
    }
    const { chunks } = JSON.parse(meta.value);
    let all = [];
    for (let i=0; i<chunks; i++) {
      const c = await window.storage.get(baseKey + "-c" + i);
      if (c) all = all.concat(JSON.parse(c.value));
    }
    return all;
  } catch { return []; }
}

const DEG_SECENEKLER = [
  { val: 1, label: "Çok Düşük" }, { val: 2, label: "Düşük" },
  { val: 3, label: "Orta" }, { val: 4, label: "İyi" }, { val: 5, label: "Çok İyi" },
];

function degBoyutPuan(cevaplar, key) {
  const vals = Object.values(cevaplar[key] || {});
  if (!vals.length) return null;
  return parseFloat((vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1));
}
function degTumPuanlar(cevaplar) {
  const p = {};
  DEG_SORULAR.forEach(b => { const v = degBoyutPuan(cevaplar, b.key); if (v !== null) p[b.key] = v; });
  return p;
}
function degTamamlanma(cevaplar) {
  let total = 0, done = 0;
  DEG_SORULAR.forEach(b => { b.sorular.forEach((_, i) => { total++; if (cevaplar[b.key]?.[i] !== undefined) done++; }); });
  return Math.round((done / total) * 100);
}

async function pdfMetinCikar(file) {
  // PDF'i base64'e çevir
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      const base64 = e.target.result.split(",")[1];
      try {
        const res = await pdrCallClaude({
            model: "claude-sonnet-4-6",
            max_tokens: 1000,
            system: `Sen Dr. Ayse Kara'sin - 20 yillik klinik deneyime sahip PDR uzmani ve psikologsun. BDT (otomatik dusunceler, sema teorisi, maruz birakma), baglanma teorisi (Bowlby), aile sistemleri (Minuchin), gelisim psikolojisi (Erikson, Vygotsky), Bourdieu sosyolojisi, Frankl anlam terapisi ve Stoa felsefesi perspektifinden degerlendirir; somut, uygulanabilir PDR onerileri sunarsın. Yargilamayan, guclu yonlere odaklanan, Turkce yazan bir klinisyensin.

GOREV - PDF ANALIZI: Yuklenen belgeden cikar:
1. KAYNAK BİLGİSİ: Yazar, başlık, yıl (varsa)
2. ANA TEMALAR: Belgede işlenen başlıca konular (madde madde)
3. PDR AÇISINDAN ÖNEMLİ NOKTALAR: Okul psikolojik danışmanlığı için kullanılabilecek teori, model veya yaklaşımlar
4. ANAHTAR KAVRAMLAR: Önemli terimler ve kısa açıklamaları

Maksimum 400 kelime. Sade ve yapılandırılmış yaz. JSON veya markdown kullanma.`,
            messages: [{
              role: "user",
              content: [
                { type: "document", source: { type: "base64", media_type: "application/pdf", data: base64 } },
                { type: "text", text: "Bu belgeyi PDR perspektifinden analiz et ve özetle." }
              ]
            }]
          });
        const data = await res.json();
        resolve(data.content?.[0]?.text || "Metin çıkarılamadı.");
      } catch(err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function getDegerlendirmeAnalysis(studentName, className, cevaplar, notlar) {
  const boyutMetni = DEG_SORULAR.map(b => {
    const bC = cevaplar[b.key] || {};
    const sorular = b.sorular.map((s, i) => `  - ${s}: ${bC[i] !== undefined ? DEG_SECENEKLER.find(x => x.val === bC[i])?.label : "Yanıtlanmadı"}`).join("\n");
    return `${DIMENSIONS.find(d => d.key === b.key)?.label || b.key}:\n${sorular}${notlar[b.key] ? `\n  Not: ${notlar[b.key]}` : ""}`;
  }).join("\n\n");
  const puanOzet = DEG_SORULAR.map(b => {
    const p = degBoyutPuan(cevaplar, b.key);
    return `${DIMENSIONS.find(d => d.key === b.key)?.label}: ${p ?? "?"}/5`;
  }).join(", ");

  const res = await pdrCallClaude({
      model: "claude-sonnet-4-6", max_tokens: 2000,
      system: `Sen Dr. Ayse Kara'sin - 20 yillik klinik deneyime sahip PDR uzmani ve psikologsun. BDT (otomatik dusunceler, sema teorisi, maruz birakma), baglanma teorisi (Bowlby), aile sistemleri (Minuchin), gelisim psikolojisi (Erikson, Vygotsky), Bourdieu sosyolojisi, Frankl anlam terapisi ve Stoa felsefesi perspektifinden degerlendirir; somut, uygulanabilir PDR onerileri sunarsın. Yargilamayan, guclu yonlere odaklanan, Turkce yazan bir klinisyensin.

DEGERLENDIRME CERCEVESI:

BOYUT-TEORİ EŞLEŞTİRMESİ:
- Akademik Gelişim → Bandura öz-yeterlilik, Vygotsky yakınsak gelişim alanı
- Sosyal Beceriler → Goleman duygusal zeka, Sosyal öğrenme teorisi
- Duygusal Denge → Gross duygu düzenleme, Lazarus stres-başa çıkma
- Aile İlişkileri → Bowlby bağlanma teorisi, Bronfenbrenner ekolojik sistem
- Öz Güven → Adler bireysel psikoloji, Maslow ihtiyaçlar hiyerarşisi
- Okul Uyumu → MEB rehberlik yönergesi, Ekosistem uyum modeli
- Kariyer Farkındalığı → Super kariyer gelişim, Holland RIASEC modeli
- Akran İlişkileri → Sullivan kişilerarası teori, Moreno sosyometri

MEB OKUL REHBERLİK ÇERÇEVESİ: Bireysel farkındalık, sosyal-duygusal öğrenme, akademik gelişim, kariyer gelişimi, aile-çevre ilişkileri kazanımları.

Analiz yaparken: Her boyutu ilgili teorik çerçeveden yorumla, hangi teoriden baktığını belirt, MEB kazanımlarına atıfta bulun, pratik ve uygulanabilir öneriler ver. Markdown veya JSON kullanma.`,
      messages: [{ role: "user", content: `Öğrenci: ${studentName}${className ? `, Sınıf: ${className}` : ""}\nPuan Özeti: ${puanOzet}\n\n${boyutMetni}\n\nBu öğrencinin PDR analizini şu yapıda yaz:\nGENEL DEĞERLENDİRME: (öğrencinin genel profilini teorik perspektiften 2-3 cümle)\nGÜÇLÜ YÖNLER: (hangi teoriye göre güçlü olduğunu belirt)\nGELİŞİM ALANLARI: (hangi teorik çerçeveden müdahale önerilebileceğini belirt)\nÖNERİLER: (teorik temelli 3 somut öneri, kaynağını belirt)\nRİSK NOTU: (varsa teorik dayanaklı risk değerlendirmesi)` }],
    });
  const data = await res.json();
  return data.content?.[0]?.text || "";
}

function DegerlendirmeEkrani({ onTransfer, onClose, records, profiles, profiles2, kayitliListesi, aktifOgrenci, setAktifOgrenci }) {

  useEffect(() => {
    if (aktifOgrenci?.name) setOgrenci({ ad: aktifOgrenci.name, sinif: aktifOgrenci.className || "" });
  }, [aktifOgrenci?.name]);
  const [aktif, setAktif] = useState(0);

  const [notlar, setNotlar] = useState({});

  const boyut = DEG_SORULAR[aktif];
  const dim = DIMENSIONS.find(d => d.key === boyut?.key);
  const tamamlanma = degTamamlanma(cevaplar);
  const puanlar = degTumPuanlar(cevaplar);

  function cevapVer(si, val) {
    setCevaplar(p => ({ ...p, [boyut.key]: { ...(p[boyut.key] || {}), [si]: val } }));
  }

    setYukleniyor(true);
    const sonuc = await getDegerlendirmeAnalysis(ogrenci.ad, ogrenci.sinif, cevaplar, notlar);
    setAnaliz(sonuc);
    setYukleniyor(false);
    setAdim("sonuc");
  }

    const skorlar = {};
    DIMENSIONS.forEach(d => {
      const p = degBoyutPuan(cevaplar, d.key);

function today() { return new Date().toLocaleDateString("tr-TR", { day: "2-digit", month: "2-digit", year: "numeric" }); }
function pdrTarihMs(tarihStr) {
  if (!tarihStr) return 0;
  const [g, ay, y] = tarihStr.split(".");
  const t = new Date(`${y}-${ay}-${g}`).getTime();
  return isNaN(t) ? 0 : t;
}

// ── Ani Değişim Algılayıcısı ────────────────────────────────────────────────
// AMAÇ: "Bu öğrenciye şiddet potansiyeli var" gibi hiçbir etiket koymaz —
// sadece objektif verilerde (devamsızlık, deneme, risk kaydı sıklığı, görüşme
// sıklığı, sevk sıklığı, veli görüşme sıklığı, tekrar test sonuçları) ani bir
// kötüleşme olup olmadığını hesaplar ve varsa danışmana "buraya yakından bak"
// der. Karar her zaman danışmana bırakılır, program hiçbir çıkarım/tahmin
// yapmaz — sadece "birden fazla gösterge aynı anda değişti" der.
function aniDegisimHesapla(ogr, records, riskListesi, sevkler, denemeler, testKayitlari, dersler, profiles) {
  const sinyaller = [];
  const ad = ogr.studentName || ogr.name, sinif = ogr.className, no = ogr.numara;
  const eslesir = (r) => pdrAyniOgrenci(r.studentName, r.className, ad, sinif, r.numara, no);
  const simdi = Date.now();
  const GUN = 86400000;

  // 1) Devamsızlık artış hızı
  const devGecmis = [...(ogr.devamsizlikGecmisi||[])].sort((a,b) => pdrTarihMs(a.tarih) - pdrTarihMs(b.tarih));
  if (devGecmis.length >= 2) {
    const son = devGecmis[devGecmis.length-1], onceki = devGecmis[devGecmis.length-2];
    const gunFarki = son.gun - onceki.gun;
    const gecenGun = Math.max(1, (pdrTarihMs(son.tarih) - pdrTarihMs(onceki.tarih)) / GUN);
    if (gunFarki >= 3 && gecenGun <= 30) sinyaller.push({ tur: "Devamsızlık", detay: `${onceki.gun} → ${son.gun} gün (${Math.round(gecenGun)} günde)` });
  }

  // 2) Deneme sonucundaki ani düşüş
  if (denemeler && dersler) {
    const denemeSozluk = pdrSozlukOku(denemeler, ad, sinif, no) || {};
    const girisler = Object.entries(denemeSozluk).filter(([k])=>k!=="7sinif").sort((a,b)=>Number(a[0])-Number(b[0]));
    if (girisler.length >= 2) {
      const hesap = ([,nets]) => dersler.reduce((s,d)=>s+(parseFloat(nets[d.key])||0),0);
      const sonNet = hesap(girisler[girisler.length-1]);
      const oncekiNet = hesap(girisler[girisler.length-2]);
      const toplam = dersler.reduce((s,d)=>s+d.maks,0) || 90;
      if (oncekiNet - sonNet >= toplam * 0.15) sinyaller.push({ tur: "Deneme", detay: `${oncekiNet.toFixed(1)} → ${sonNet.toFixed(1)} net (düşüş)` });
    }
  }

  // 3) Risk kayıtlarındaki artış — son 30 günde 2+ yeni kayıt
  const sonRiskler = (riskListesi||[]).filter(r => eslesir(r) && (simdi - pdrTarihMs(r.tarih)) <= 30*GUN);
  if (sonRiskler.length >= 2) sinyaller.push({ tur: "Risk Kaydı", detay: `Son 30 günde ${sonRiskler.length} yeni risk kaydı` });

  // 4) Görüşme sıklığındaki ani artış (öğrenci görüşmeleri)
  const ogrGorusmeler = (records||[]).filter(eslesir).filter(r=>r.meetingType!=="Veli").sort((a,b)=>pdrTarihMs(a.date)-pdrTarihMs(b.date));
  if (ogrGorusmeler.length >= 3) {
    const son30 = ogrGorusmeler.filter(r => (simdi - pdrTarihMs(r.date)) <= 30*GUN).length;
    const toplamAraliqGun = Math.max(30, (simdi - pdrTarihMs(ogrGorusmeler[0].date)) / GUN);
    const aylikOrtalama = ogrGorusmeler.length / (toplamAraliqGun / 30);
    if (son30 >= 3 && son30 > aylikOrtalama * 2) sinyaller.push({ tur: "Görüşme Sıklığı", detay: `Son 30 günde ${son30} görüşme (normalin üstünde)` });
  }

  // 5) Sevk sıklığındaki artış
  const sonSevkler = (sevkler||[]).filter(eslesir).filter(s => (simdi - pdrTarihMs(s.tarih)) <= 60*GUN);
  if (sonSevkler.length >= 2) sinyaller.push({ tur: "Sevk", detay: `Son 60 günde ${sonSevkler.length} sevk` });

  // 6) Veli görüşme sıklığındaki artış
  const veliGorusmeler = (records||[]).filter(eslesir).filter(r=>r.meetingType==="Veli");
  const son60Veli = veliGorusmeler.filter(r => (simdi - pdrTarihMs(r.date)) <= 60*GUN).length;
  if (veliGorusmeler.length >= 2 && son60Veli >= 3) sinyaller.push({ tur: "Veli Görüşmesi", detay: `Son 60 günde ${son60Veli} veli görüşmesi` });

  // 7) Tekrar uygulanan testlerde kötüleşme (aynı test 2+ kez uygulanmış, toplam puanı belirgin artmış)
  if (testKayitlari) {
    const testGecmis = pdrSozlukOku(testKayitlari, ad, sinif, no) || [];
    const gruplar = {};
    testGecmis.forEach(t => { (gruplar[t.testAdi] = gruplar[t.testAdi]||[]).push(t); });
    Object.entries(gruplar).forEach(([testAdi, kayitlar]) => {
      if (kayitlar.length < 2) return;
      const sirali = [...kayitlar].sort((a,b)=>pdrTarihMs(a.tarih)-pdrTarihMs(b.tarih));
      const ilk = sirali[0], son = sirali[sirali.length-1];
      const ilkPuan = parseFloat(ilk.veri?.toplamPuan), sonPuan = parseFloat(son.veri?.toplamPuan);
      if (!isNaN(ilkPuan) && !isNaN(sonPuan) && ilkPuan > 0 && sonPuan - ilkPuan >= ilkPuan * 0.3) {
        sinyaller.push({ tur: "Test Sonucu", detay: `${testAdi}: ${ilkPuan} → ${sonPuan}` });
      }
    });
  }

  // 9) Olay/Tutanak kaydında artış — son 60 günde 2+ yeni kayıt
  const sonOlaylar = (ogr.olayKayitlari||[]).filter(o => (simdi - pdrTarihMs(o.tarih)) <= 60*GUN);
  if (sonOlaylar.length >= 2) sinyaller.push({ tur: "Olay/Tutanak", detay: `Son 60 günde ${sonOlaylar.length} olay kaydı` });

  // 8) Profil (P1) puanlarında ani düşüş — profiller zaten geçmişli tutuluyor
  // (her kayıt yeni bir kayıt olarak eklenir, üzerine yazılmaz), o yüzden ek
  // bir veri modeli değişikliği gerekmedi, doğrudan son iki kayıt karşılaştırıldı.
  if (profiles && DIMENSIONS) {
    const ogrP1ler = profiles.filter(eslesir).sort((a,b)=>pdrTarihMs(a.date)-pdrTarihMs(b.date));
    if (ogrP1ler.length >= 2) {
      const son = ogrP1ler[ogrP1ler.length-1], onceki = ogrP1ler[ogrP1ler.length-2];
      const dusenBoyutlar = DIMENSIONS.filter(d => {
        const s1 = parseFloat(onceki.scores?.[d.key]), s2 = parseFloat(son.scores?.[d.key]);
        return !isNaN(s1) && !isNaN(s2) && (s1 - s2) >= 2;
      });
      if (dusenBoyutlar.length > 0) sinyaller.push({ tur: "Profil Puanı", detay: dusenBoyutlar.map(d=>`${d.label}: ${onceki.scores[d.key]}→${son.scores[d.key]}`).join(", ") });
    }
  }

  return { sinyalSayisi: sinyaller.length, sinyaller };
}


// Eğitim yılı Eylül'de başlar — erişim kesin bitiş tarihi 31 Ağustos (yaz
// boyunca kullanım kesilmez, yenileme sadece bir sonraki eğitim yılı
// başlarken/Eylül'de gerekir). Kim ne zaman katılırsa katılsın erişimi aynı
// tarihte biter, ödeme ise sadece kalan aya göre orantılı alınır.
function pdrEgitimYiliBitisi(tarihMs = Date.now()) {
  const d = new Date(tarihMs);
  const ay = d.getMonth(); // 0=Ocak ... 8=Eylül ... 11=Aralık
  const yil = d.getFullYear();
  if (ay >= 8) return new Date(yil + 1, 7, 31, 23, 59, 59).getTime(); // Eylül-Aralık → gelecek yıl 31 Ağustos
  return new Date(yil, 7, 31, 23, 59, 59).getTime(); // Ocak-Ağustos → bu takvim yılının 31 Ağustos'u
}
function pdrKalanAySayisi(tarihMs = Date.now()) {
  const bitis = pdrEgitimYiliBitisi(tarihMs);
  const gun = Math.max(0, Math.ceil((bitis - tarihMs) / (1000*60*60*24)));
  return Math.max(0, Math.ceil(gun / 30));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// 150+ öğrencilik bir okulda aynı isimde birden fazla öğrenci olması olası
// (farklı sınıflarda). Sadece isimle eşleştirme, bu durumda farklı öğrencilerin
// görüşme/risk/profil kayıtlarının karışmasına yol açar. Bu yüzden mümkün
// olduğunda isim + sınıf birlikte eşleştirilir. Sınıf bilgisi taraflardan
// birinde yoksa (eski kayıtlar), geriye dönük uyumluluk için sadece isimle
// eşleştirmeye devam edilir.
// ÖNCELİK SIRASI: Öğrenci numarası isimden daha güvenilir bir kimliktir —
// veliler/öğretmenler ismi elle girerken bir harf farkı, boşluk, Türkçe
// karakter farkı (İ/I, Ş/S vb.) yapabilir, ama numara genelde e-okul'dan
// kopyalanır ve daha az hata payı taşır. Bu yüzden: aynı sınıfta VE aynı
// numarada olan iki kayıt, isimleri birebir aynı yazılmasa bile AYNI öğrenci
// sayılır. Numara taraflardan birinde yoksa ya da sınıf bilgisi tutmuyorsa,
// eski isim+sınıf(+numara) eşleştirmesine geri dönülür.
function pdrAyniOgrenci(ad1, sinif1, ad2, sinif2, no1, no2) {
  const s1 = (sinif1 || "").toLowerCase().trim();
  const s2 = (sinif2 || "").toLowerCase().trim();
  const n1 = (no1 || "").toString().trim();
  const n2 = (no2 || "").toString().trim();

  // Öncelik 1: Sınıf + numara ikisi de dolu ve eşleşiyorsa, isim yazımı farklı
  // olsa bile aynı öğrencidir.
  if (s1 && s2 && s1 === s2 && n1 && n2 && n1 === n2) return true;

  const a1 = (ad1 || "").toLowerCase().trim();
  const a2 = (ad2 || "").toLowerCase().trim();
  if (!a1 || a1 !== a2) return false;
  if (!s1 || !s2) return true; // sınıf bilgisi eksikse eski davranış korunur
  if (s1 !== s2) return false;
  if (!n1 || !n2) return true; // numara eksikse isim+sınıf eşleşmesi yeterli
  return n1 === n2;
}

// denemeler, mudahalePlan, hazırlıkNotlari gibi "isimle anahtarlanan" sözlük
// yapıları için: aynı isimli farklı sınıf öğrencilerinin verisi karışmasın diye
// anahtar artık isim+sınıf birleşimi. Eski (sadece isimle kaydedilmiş) veriler
// hâlâ okunabilsin diye, yeni anahtar bulunamazsa eski düz-isim anahtarına da bakılır.
// Numara verilirse (üçüncü katman), aynı isim+sınıftaki öğrenciler arasında da
// (örn. iki "Yavuz Er" aynı sınıfta) ayrım yapılabilir.
function pdrOgrAnahtar(name, className, numara) {
  const n = (name || "").trim();
  const c = (className || "").trim();
  const no = (numara || "").toString().trim();
  if (c && no) return n + " || " + c + " || " + no;
  return c ? n + " || " + c : n;
}
function pdrSozlukOku(sozluk, name, className, numara) {
  if (!sozluk) return undefined;
  if (numara) {
    const tamKey = pdrOgrAnahtar(name, className, numara);
    if (sozluk[tamKey] !== undefined) return sozluk[tamKey];
  }
  const yeniKey = pdrOgrAnahtar(name, className);
  if (sozluk[yeniKey] !== undefined) return sozluk[yeniKey];
  return sozluk[name]; // eski format (sadece isim) — geriye dönük uyumluluk
}
// Yazarken en spesifik (numara varsa isim+sınıf+numara, yoksa isim+sınıf) anahtara
// kaydedilir. Eski anahtarlara DOKUNULMAZ — çünkü aynı isimli başka bir öğrenciye
// ait olabilirler; silinirse o öğrencinin verisi kaybolur.
function pdrSozlukYaz(sozluk, name, className, value, numara) {
  const yeniKey = pdrOgrAnahtar(name, className, numara);
  return { ...sozluk, [yeniKey]: value };
}


// ── Rapor İndirme Yardımcısı (mobil uyumlu) ────────────────────────────────────
async function raporIndir(elementId, dosyaAdi) {
  const el = document.getElementById(elementId);
  if (!el) { alert("Rapor bulunamadı."); return; }

  // Rapor içeriğini al
  const icerik = el.innerHTML;
  const htmlStr = `<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${dosyaAdi}</title>
<style>
  @page { size: A4; margin: 8mm; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #1a1a1a; background: #fff; padding: 0; margin: 0; }
  @media print {
    .noprint { display: none !important; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; margin-top: 0 !important; }
    #pdr-print-spacer { margin-top: 0 !important; }
  }
  @media screen {
    body { padding: 16px; max-width: 1100px; margin: 0 auto; }
  }
  table { width: 100%; border-collapse: collapse; }
  svg { max-width: 100%; }
</style>
</head>
<body>
<div class="noprint" style="position:fixed;top:0;left:0;right:0;background:#2D6A4F;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:999;font-family:Arial,sans-serif;">
  <span style="font-weight:700;font-size:15px;">📄 ${dosyaAdi}</span>
  <div style="display:flex;gap:10px;">
    <button onclick="window.print()" style="background:#fff;color:#2D6A4F;border:none;border-radius:8px;padding:8px 18px;font-size:14px;font-weight:800;cursor:pointer;">🖨️ Yazdır / PDF Kaydet</button>
    <button onclick="window.close()" style="background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;">✕</button>
  </div>
</div>
<div id="pdr-print-spacer" style="margin-top:60px;">${icerik}</div>
</body>
</html>`;

  const isMobil = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  if (isMobil) {
    // Mobilde: dosya indirmek yerine doğrudan aynı sekmede aç (dosya yöneticisine gitmeye gerek kalmaz)
    try {
      const blob = new Blob([htmlStr], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      window.location.href = url;
      return;
    } catch(e) {}
  } else {
    // Masaüstü: Yeni sekme
    try {
      const w = window.open("", "_blank");
      if (w && !w.closed) {
        w.document.open();
        w.document.write(htmlStr);
        w.document.close();
        return;
      }
    } catch(e) {}
  }

  // Yöntem 2: Blob + link (yedek)
  try {
    const blob = new Blob([htmlStr], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = dosyaAdi + ".html";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    return;
  } catch(e) {}

  // Yöntem 3: Data URI (son çare)
  try {
    const encoded = encodeURIComponent(htmlStr);
    window.location.href = "data:text/html;charset=utf-8," + encoded;
  } catch(e) {
    alert("PDF indirilemedi. Ekran görüntüsü alabilirsiniz.");
  }
}

// ── Excel Export ──────────────────────────────────────────────────────────────// ── Excel Export ──────────────────────────────────────────────────────────────
function exportToExcel(records) {
  const data = records.map(r => ({
    "Tarih": r.date, "Öğrenci": r.studentName, "Sınıf": r.className || "",
    "Görüşme Türü": r.meetingType || "Öğrenci", "Konu": r.topic || "", "Özet": r.summary,
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws["!cols"] = [{ wch: 12 }, { wch: 22 }, { wch: 8 }, { wch: 14 }, { wch: 18 }, { wch: 60 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Görüşme Kayıtları");
  const topicCount = {}, typeCount = { "Öğrenci": 0, "Veli": 0 };
  const studentSet = new Set(), parentSet = new Set(), monthCount = {};
  records.forEach(r => {
    const topic = r.topic || "Belirtilmemiş"; topicCount[topic] = (topicCount[topic] || 0) + 1;
    const type = r.meetingType || "Öğrenci"; typeCount[type] = (typeCount[type] || 0) + 1;
    if (type === "Öğrenci") studentSet.add(r.studentName); else parentSet.add(r.studentName);
    const parts = r.date?.split(".");
    if (parts?.length === 3) { const key = `${parts[1]}/${parts[2]}`; monthCount[key] = (monthCount[key] || 0) + 1; }
  });
  const statRows = [
    ["PDR SERVİSİ — GÖRÜŞME İSTATİSTİKLERİ"], [],
    ["GENEL"], ["Toplam Görüşme", records.length],
    ["Farklı Öğrenci Sayısı", studentSet.size], ["Farklı Veli Sayısı", parentSet.size], [],
    ["GÖRÜŞME TÜRÜ"], ["Öğrenci Görüşmesi", typeCount["Öğrenci"] || 0], ["Veli Görüşmesi", typeCount["Veli"] || 0], [],
    ["KONULARA GÖRE"], ...Object.entries(topicCount).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, v]), [],
    ["AYLARA GÖRE"], ...Object.entries(monthCount).sort().map(([k, v]) => [k, v]),
  ];
  const ws2 = XLSX.utils.aoa_to_sheet(statRows);
  ws2["!cols"] = [{ wch: 28 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, ws2, "İstatistikler");
  XLSX.writeFile(wb, `PDR_Kayitlar_${today().replace(/\./g, "-")}.xlsx`);
}

// ── Radar SVG ─────────────────────────────────────────────────────────────────
function RadarChart({ scores, size = 240, glass = false }) {
  const rx = size * 0.38; // yatayda hafif geniş (dengeli oval)
  const ry = size * 0.33; // dikeyde hafif basık (dengeli oval)
  const padX = size * 0.40;
  const padY = size * 0.34;
  const totalW = rx * 2 + padX * 2;
  const totalH = ry * 2 + padY * 2;
  const cx = totalW / 2, cy = totalH / 2, n = DIMENSIONS.length;
  const angleStep = (2 * Math.PI) / n;
  const getPoint = (i, val, maxVal = 5) => {
    const angle = i * angleStep - Math.PI / 2;
    const ratio = val / maxVal;
    return { x: cx + ratio * rx * Math.cos(angle), y: cy + ratio * ry * Math.sin(angle) };
  };
  const dataPoints = DIMENSIONS.map((d, i) => getPoint(i, scores[d.key] || 0));
  const gridLevels = [1, 2, 3, 4, 5];
  const gid = "radarFillGrad" + size + (glass ? "g" : "");
  const gridColor = glass ? "rgba(255,255,255,0.35)" : "#EEF3F0";
  const gridColorOuter = glass ? "rgba(255,255,255,0.55)" : BORDER;
  const axisColor = glass ? "rgba(255,255,255,0.3)" : BORDER;
  const fillColor = glass ? "#ffffff" : ACCENT;
  const labelColor = glass ? "#ffffff" : TEXT;

  return (
    <svg width="100%" height="auto" style={{ maxWidth: totalW, display: "block" }} viewBox={`0 0 ${totalW} ${totalH}`}>
      <defs>
        <radialGradient id={gid} cx="50%" cy="45%" r="60%">
          <stop offset="0%" stopColor={fillColor} stopOpacity={glass ? 0.5 : 0.6} />
          <stop offset="100%" stopColor={fillColor} stopOpacity={glass ? 0.12 : 0.15} />
        </radialGradient>
        <filter id={"radarGlow" + size + (glass ? "g" : "")} x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor={glass ? "#000000" : ACCENT} floodOpacity={glass ? 0.25 : 0.4} />
        </filter>
      </defs>
      {/* Grid */}
      {gridLevels.map(level => {
        const pts = DIMENSIONS.map((_, i) => getPoint(i, level));
        return <polygon key={level} points={pts.map(p => `${p.x},${p.y}`).join(" ")}
          fill="none" stroke={level === 5 ? gridColorOuter : gridColor} strokeWidth={level === 5 ? 1.4 : 1} />;
      })}
      {/* Axes */}
      {DIMENSIONS.map((_, i) => {
        const outer = getPoint(i, 5);
        return <line key={i} x1={cx} y1={cy} x2={outer.x} y2={outer.y} stroke={axisColor} strokeWidth={1} />;
      })}
      {/* Data: gradyanlı dolgu + parlaklık gölgesi */}
      <polygon points={dataPoints.map(p => `${p.x},${p.y}`).join(" ")}
        fill={`url(#${gid})`} filter={`url(#radarGlow${size}${glass ? "g" : ""})`} stroke={fillColor} strokeWidth={2.5} strokeLinejoin="round" />
      {dataPoints.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r={5} fill={glass ? "#fff" : DIMENSIONS[i].color} stroke={glass ? ACCENT : "#fff"} strokeWidth={2} />
      ))}
      {/* Labels: her boyut kendi canlı rengiyle, hepsi ortalı */}
      {DIMENSIONS.map((d, i) => {
        const angle = i * angleStep - Math.PI / 2;
        const cosA = Math.cos(angle), sinA = Math.sin(angle);
        const lx = cx + (rx + size * 0.16) * cosA;
        const ly = cy + (ry + size * 0.20) * sinA;
        const GLASS_RENK = { akademik: "#5DC8FF", sosyal: "#7CFFB2", duygusal: "#FF9466", aile: "#C79CFF", ozguven: "#FFD966", uyum: "#5EEAD4", kariyer: "#FF6B6B", akran: "#FFB877" };
        const etiketRengi = glass ? (GLASS_RENK[d.key] || d.color) : d.color;
        return (
          <text key={i} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle"
            fontSize={size * 0.055} fill={etiketRengi} fontWeight={900}
            stroke={glass ? "rgba(6,26,19,0.55)" : "none"} strokeWidth={glass ? 0.7 : 0} paintOrder="stroke">
            {d.label.split(" ").map((w, wi) => (
              <tspan key={wi} x={lx} dy={wi === 0 ? 0 : size * 0.062}>{w}</tspan>
            ))}
          </text>
        );
      })}
    </svg>
  );
}

// Program hiçbir testi UYGULAMAZ — sadece danışmanın başka bir ortamda uyguladığı
// standart test/envanterlerin kaydını tutar. Bazı testler (özellikle zeka
// testleri) yalnızca lisanslı psikolog tarafından uygulanabilir; bu liste sadece
// "hangi testin sonucunu kaydediyorum" seçimi içindir, uygulama yetkisiyle
// ilgili bir onay/izin anlamı taşımaz.
//
// Her testin "tip" alanı, hangi giriş formunun kullanılacağını belirler —
// çünkü testler çok farklı puanlama yapılarına sahip (tek toplam puan, alt test
// bataryası, zeka yaşı/IQ eşdeğeri, hata puanı, dikkat testi formatı vb.).
// Sadece Beck Depresyon Envanteri için düzey eşiği otomatik hesaplanır (yaygın
// kabul gören, çok kaynakla doğrulanmış eşik: 0-9 Normal, 10-18 Hafif, 19-29
// Orta, 30-63 Şiddetli). Diğer "toplam puan" tipi testlerde kesin klinik eşik
// değerleri güvenilir şekilde doğrulanamadığı için otomatik hesaplama YAPILMAZ —
// danışman toplam puanı girer, düzeyi kendi bildiği referansa göre kendisi yazar.
const TEST_LISTESI = {

// Bir test kaydının kısa özet metnini üretir — liste ve rapor görünümünde
// kullanılır, testin tipine göre farklı alanlardan oluşturulur.
function testSonucOzeti(k) {
  const v = k.veri || {};
  switch (k.tip) {
    case "d2": return `Doğru: ${v.dogru||"—"} · Yanlış/Atlanan: ${v.yanlisAtlanan||"—"} · Dikkat Puanı: ${v.dikkatPuani||"—"}${v.pr?` · PR: ${v.pr}`:""}`;
    case "alt_test": {
      const altlar = Object.entries(v.altPuanlar||{}).map(([k2,val])=>`${k2}: ${val}`).join(", ");
      return `${altlar}${v.genelSonuc?` · Sonuç: ${v.genelSonuc}`:""}`;
    }
    case "iq_esdeger": return `Ham Puan: ${v.hamPuan||"—"} · Zeka Yaşı: ${v.zekaYasi||"—"} · Zeka Bölümü: ${v.zekaBolumu||"—"}`;
    case "gelisimsel_hata": return `Hata Puanı: ${v.hataPuani||"—"} · Gelişimsel Yaş: ${v.gelisimselYas||"—"}`;
    case "toplam_duzey": return `Toplam Puan: ${v.toplamPuan||"—"}${v.duzey?` · Düzey: ${v.duzey}`:""}`;
    case "toplam_duzey_serbest": return `Toplam Puan: ${v.toplamPuan||"—"}${v.duzeyYorum?` · ${v.duzeyYorum}`:""}`;
    case "kariyer": return `${v.oneCikanAlanlar||"—"}`;
    case "nitel": return k.not ? "Nitel değerlendirme (nota bakınız)" : "—";
    default: return v.sonuc || "—";
  }
}
function testDuzeyHesapla(testTanim, puan) {
  const p = parseFloat(puan);
  if (isNaN(p) || !testTanim.duzeyler) return "";
  const bulunan = testTanim.duzeyler.find(d => p <= d.max);
  return bulunan ? bulunan.ad : testTanim.duzeyler[testTanim.duzeyler.length-1].ad;
}

const TEST_FORM_BOS = { tarih: today(), not: "", dogru:"", yanlisAtlanan:"", dikkatPuani:"", pr:"", altPuanlar:{}, genelSonuc:"", hamPuan:"", zekaYasi:"", zekaBolumu:"", hataPuani:"", gelisimselYas:"", toplamPuan:"", duzeyYorum:"", oneCikanAlanlar:"", genelYorum:"" };
function testVeriOlustur(tip, testTanim, form) {
  switch (tip) {
    case "d2": return { dogru: form.dogru, yanlisAtlanan: form.yanlisAtlanan, dikkatPuani: form.dikkatPuani, pr: form.pr };
    case "alt_test": return { altPuanlar: form.altPuanlar, genelSonuc: form.genelSonuc };
    case "iq_esdeger": return { hamPuan: form.hamPuan, zekaYasi: form.zekaYasi, zekaBolumu: form.zekaBolumu };
    case "gelisimsel_hata": return { hataPuani: form.hataPuani, gelisimselYas: form.gelisimselYas };
    case "toplam_duzey": return { toplamPuan: form.toplamPuan, duzey: testDuzeyHesapla(testTanim, form.toplamPuan) };
    case "toplam_duzey_serbest": return { toplamPuan: form.toplamPuan, duzeyYorum: form.duzeyYorum };
    case "kariyer": return { oneCikanAlanlar: form.oneCikanAlanlar, genelYorum: form.genelYorum };
    default: return {};
  }
}
function testFormGecerliMi(tip, form) {
  switch (tip) {
    case "d2": return !!form.dogru;
    case "alt_test": return Object.values(form.altPuanlar||{}).some(v=>v);
    case "iq_esdeger": return !!form.hamPuan || !!form.zekaBolumu;
    case "gelisimsel_hata": return !!form.hataPuani;
    case "toplam_duzey": case "toplam_duzey_serbest": return !!form.toplamPuan;
    case "kariyer": return !!form.oneCikanAlanlar.trim();
    case "nitel": return !!form.not.trim();
    default: return false;
  }
}

function TestlerEkrani({ kayitliListesi, aktifOgrenci, setAktifOgrenci, testKayitlari, setTestKayitlari }) {
  const [seciliAd, setSeciliAd] = useState(aktifOgrenci?.name || "");
  const [ogrenciArama, setOgrenciArama] = useState("");
  const [kategori, setKategori] = useState(null); // "objektif" | "projektif" | null
  const [seciliTest, setSeciliTest] = useState(null); // TEST_LISTESI'nden bir test tanımı objesi
  const [form, setForm] = useState({ ...TEST_FORM_BOS });
  const [kaydedildi, setKaydedildi] = useState(false);

  useEffect(() => {
    if (aktifOgrenci?.name) setSeciliAd(aktifOgrenci.name);
    else setSeciliAd("");
  }, [aktifOgrenci?.name]);

  const seciliOgr = kayitliListesi.find(o => o.name === seciliAd);
  const seciliSinif = seciliOgr?.className || aktifOgrenci?.className || "";
  const seciliNumara = seciliOgr?.numara || aktifOgrenci?.numara || "";
  const kayitlar = (pdrSozlukOku(testKayitlari, seciliAd, seciliSinif, seciliNumara) || []).sort((a,b) => new Date(b.tarih) - new Date(a.tarih));

  async function handleKaydet() {
    if (!seciliAd || !seciliTest || !testFormGecerliMi(seciliTest.tip, form)) return;
    const yeni = { id: uid(), kategori, testAdi: seciliTest.ad, tip: seciliTest.tip, tarih: form.tarih, not: form.not.trim(), veri: testVeriOlustur(seciliTest.tip, seciliTest, form) };
    const guncel = pdrSozlukYaz(testKayitlari, seciliAd, seciliSinif, [yeni, ...kayitlar], seciliNumara);
    setTestKayitlari(guncel);
    await saveTestKayitlari(guncel);
    setForm({ ...TEST_FORM_BOS });
    setSeciliTest(null);
    setKategori(null);
    setKaydedildi(true);
    setTimeout(() => setKaydedildi(false), 2000);
  }

  async function handleSil(id) {
    const guncel = pdrSozlukYaz(testKayitlari, seciliAd, seciliSinif, kayitlar.filter(k => k.id !== id), seciliNumara);
    setTestKayitlari(guncel);
    await saveTestKayitlari(guncel);
  }

  const inp = { width:"100%", padding:"9px 11px", border:`1px solid ${BORDER}`, borderRadius:9, fontSize:13, boxSizing:"border-box" };
  const lbl = { fontSize:11, fontWeight:600, color:MUTED, display:"block", marginBottom:3 };

  return (
    <div style={{ padding: 16, maxWidth: 560 }}>
      <div style={{ fontSize: 18, fontWeight: 900, marginBottom: 4 }}>🧪 Testler</div>
      <div style={{ fontSize: 12, color: MUTED, marginBottom: 16, lineHeight: 1.5 }}>
        Program hiçbir testi uygulamaz — burada sadece başka bir ortamda uyguladığın standart test/envanterlerin sonucunu kaydedersin. Kayıtlar öğrenci raporuna otomatik eklenir.
      </div>

      {/* Öğrenci seç */}
      <div style={{ marginBottom: 16 }}>
        <label style={lbl}>ÖĞRENCİ</label>
        {seciliAd ? (
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", background:ACCENT_LIGHT, border:`1px solid ${ACCENT}`, borderRadius:10, padding:"8px 12px" }}>
            <div style={{ fontSize:13, fontWeight:700, color:ACCENT }}>👤 {seciliAd}{seciliSinif?` — ${seciliSinif}`:""}</div>
            <button onClick={() => { setSeciliAd(""); setAktifOgrenci({ name:"", className:"" }); setOgrenciArama(""); setKategori(null); setSeciliTest(null); }} style={{
              background:"none", border:`1px solid ${ACCENT}`, color:ACCENT, borderRadius:8, padding:"3px 9px", fontSize:11, fontWeight:600, cursor:"pointer"
            }}>✕ Değiştir</button>
          </div>
        ) : (
          <>
            <input value={ogrenciArama} onChange={e=>setOgrenciArama(e.target.value)} placeholder="Öğrenci ara… (en az 2 karakter)" style={{...inp, marginBottom:8}} />
            {ogrenciArama.trim().length >= 2 ? (
              <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                {kayitliListesi.filter(o =>
                  o.name.toLowerCase().includes(ogrenciArama.toLowerCase()) ||
                  o.className?.toLowerCase().includes(ogrenciArama.toLowerCase()) ||
                  o.numara?.includes(ogrenciArama)
                ).slice(0,20).map(o => (
                  <button key={pdrOgrAnahtar(o.name, o.className, o.numara)} onClick={() => { setSeciliAd(o.name); setAktifOgrenci({ name:o.name, className:o.className||"" }); setOgrenciArama(""); }} style={{
                    padding:"5px 12px", borderRadius:20, border:`2px solid ${BORDER}`, background:CARD, color:MUTED, fontSize:12, fontWeight:500, cursor:"pointer"
                  }}>{o.name}{o.className?` · ${o.className}`:""}</button>
                ))}
              </div>
            ) : (
              <div style={{ fontSize:11, color:MUTED }}>Öğrenciyi bulmak için en az 2 karakter yaz</div>
            )}
          </>
        )}
      </div>

      {seciliAd && (

                  <div><label style={lbl}>HATA PUANI</label><input value={form.hataPuani} onChange={e=>setForm(f=>({...f,hataPuani:e.target.value}))} style={inp} /></div>

                </div>

              {seciliTest.tip === "toplam_duzey" && (<>

              <button onClick={handleKaydet} disabled={!testFormGecerliMi(seciliTest.tip, form)} style={{

            </div>
          )}

          {/* Geçmiş kayıtlar */}
          <div>
            <label style={{ ...lbl, marginBottom:8 }}>GEÇMİŞ TEST KAYITLARI ({kayitlar.length})</label>

              <div style={{ fontSize:12, color:MUTED }}>Henüz test kaydı yok.</div>
            ) : (

                {kayitlar.map(k => (

                ))}
              </div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

// ── Müdahale Planı Bileşeni ───────────────────────────────────────────────────
function MudahalePlanEkrani({ kayitliListesi, aktifOgrenci, setAktifOgrenci, mudahalePlan, setMudahalePlan, records, kutuphane, kademe }) {
  const [seciliAd, setSeciliAd] = useState(aktifOgrenci?.name || "");
  const [aramaMetni, setAramaMetni] = useState("");
  const [form, setForm] = useState({ hedef:"", adimlar:"", sorumlu:"pdr", sure:"", oncelik:"Orta", durum:"Devam Ediyor" });
  const [aiLoading, setAiLoading] = useState(false);
  const [kaydedildi, setKaydedildi] = useState(false);

  useEffect(() => { if (aktifOgrenci?.name) setSeciliAd(aktifOgrenci.name); else setSeciliAd(""); }, [aktifOgrenci?.name]);

  const seciliSinif = kayitliListesi.find(o => o.name === seciliAd)?.className || aktifOgrenci?.className || "";
  const ogrPlanlar = (pdrSozlukOku(mudahalePlan, seciliAd, seciliSinif) || []).sort((a,b) => new Date(b.tarih) - new Date(a.tarih));
  const ogrRec = records.filter(r => pdrAyniOgrenci(r.studentName, r.className, seciliAd, seciliSinif));

  async function handleAiPlan() {
    if (!seciliAd) return;
    setAiLoading(true);
    const notlar = ogrRec.map((r,i) => `Görüşme ${i+1} (${r.date}): ${r.summary}`).join("\n\n");
    const kutuphaneBaglam = pdrKutuphaneBaglam(kutuphane);
    const kademeMetni = kademeBaglamMetni(kademe);
    const res = await pdrCallClaude({
        model:"claude-sonnet-4-6", max_tokens:1500,
        system:"Sen Dr. Ayse Kara'sin — 20 yillik klinik PDR uzmanisin. BDT ve varoluşçu perspektiften somut müdahale plani olusturursun.",
        messages:[{role:"user", content:`Öğrenci: ${seciliAd}
${kademeMetni}

Görüşme Notları:
${notlar||"Henüz görüşme notu yok."}${kutuphaneBaglam}

Bu öğrenci için somut bir PDR müdahale planı oluştur:

HEDEF: (tek cümle, ölçülebilir)
MÜDAHALE ADIMLARI:
1.
2.
3.
SÜRE: (kaç hafta/ay)
KONTROL KRİTERİ: (nasıl değerlendireceğiz)

${kademe ? "Planı öğrencinin yaş/gelişim dönemine uygun şekilde oluştur. " : ""}${kutuphane?.length > 0 ? "Kütüphane referanslarından (varsa ilgili yönetmelik/mevzuat maddeleri dahil) yararlan. " : ""}Sade yaz, Markdown kullanma.`}]
      });
    const data = await res.json();
    const analiz = data.content?.[0]?.text || "";
    const hedefMatch = analiz.match(/HEDEF:\s*(.+)/);
    const adimlarMatch = analiz.match(/MÜDAHALE ADIMLARI:\s*([\s\S]+?)SÜRE:/);
    const sureMatch = analiz.match(/SÜRE:\s*(.+)/);
    setForm(f => ({
      ...f,
      hedef: hedefMatch ? hedefMatch[1].trim() : f.hedef,
      adimlar: adimlarMatch ? adimlarMatch[1].trim() : analiz,
      sure: sureMatch ? sureMatch[1].trim() : f.sure
    }));
    setAiLoading(false);
  }

  async function handleKaydet() {
    if (!seciliAd || !form.hedef.trim()) return;
    const yeni = { id: uid(), tarih: today(), ogrenci: seciliAd, ogrenciSinif: seciliSinif, ...form };
    const mevcutPlanlar = pdrSozlukOku(mudahalePlan, seciliAd, seciliSinif) || [];
    const updated = pdrSozlukYaz(mudahalePlan, seciliAd, seciliSinif, [yeni, ...mevcutPlanlar]);
    setMudahalePlan(updated);
    await saveMudahalePlan(updated);
    setForm({ hedef:"", adimlar:"", sorumlu:"pdr", sure:"", oncelik:"Orta", durum:"Devam Ediyor" });
    setKaydedildi(true); setTimeout(() => setKaydedildi(false), 2000);
  }

  async function handleDurumGuncelle(ogrenci, ogrenciSinif, id, durum) {
    const mevcutPlanlar = pdrSozlukOku(mudahalePlan, ogrenci, ogrenciSinif) || [];
    const updated = pdrSozlukYaz(mudahalePlan, ogrenci, ogrenciSinif, mevcutPlanlar.map(p => p.id===id ? {...p, durum} : p));
    setMudahalePlan(updated);
    await saveMudahalePlan(updated);
  }

  const inp = { width:"100%", padding:"9px 11px", border:`1px solid ${BORDER}`, borderRadius:9, fontSize:13, background:CARD, color:TEXT, outline:"none", boxSizing:"border-box", fontFamily:"inherit" };
  const lbl = { fontSize:11, fontWeight:600, color:MUTED, display:"block", marginBottom:4, textTransform:"uppercase" };
  const durumRenk = { "Devam Ediyor":["#1A8C5B","#E6F5EE"], "Tamamlandı":["#457B9D","#EEF2FF"], "Askıda":["#B07D1A","#FDF6E3"] };

  return (
    <div>
      <div style={{background:"#EEF2FF",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:13,color:"#3B4FD8",fontWeight:600}}>
        🎯 Müdahale Planı — Hedef, adımlar ve süre takibi
      </div>

      {/* Öğrenci seç */}
      <input placeholder="Öğrenci ara..." value={aramaMetni} onChange={e=>setAramaMetni(e.target.value)} style={{...inp, marginBottom:8}} />
      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:14}}>
        {kayitliListesi.filter(o=>o.name.toLowerCase().includes(aramaMetni.toLowerCase())).slice(0,15).map(o=>{
          const s=seciliAd===o.name;
          return <button key={pdrOgrAnahtar(o.name, o.className, o.numara)} onClick={()=>{setSeciliAd(o.name); if(setAktifOgrenci) setAktifOgrenci({ name:o.name, className:o.className||"" });}} style={{padding:"4px 10px",borderRadius:16,border:`2px solid ${s?ACCENT:BORDER}`,background:s?ACCENT_LIGHT:CARD,color:s?ACCENT:MUTED,fontSize:11,fontWeight:s?700:500,cursor:"pointer"}}>{o.name}</button>;
        })}
      </div>

      {seciliAd && (
        <>
          {/* Yeni plan formu */}
          <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:14,marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:12,fontWeight:700,color:TEXT}}>Yeni Müdahale Planı — {seciliAd}</div>
              <button onClick={()=>{ setSeciliAd(""); if(setAktifOgrenci) setAktifOgrenci({ name:"", className:"" }); }} style={{
                background:"none", border:`1px solid ${BORDER}`, color:MUTED, borderRadius:8, padding:"4px 9px", fontSize:11, fontWeight:600, cursor:"pointer"
              }}>✕ Bağlantıyı Kes</button>
            </div>

            <button onClick={handleAiPlan} disabled={aiLoading} style={{width:"100%",padding:"10px",background:aiLoading?BORDER:PURPLE,color:aiLoading?"#666":"#fff",border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:12}}>
              {aiLoading?"⏳ AI plan oluşturuyor...":"✦ AI Müdahale Planı Oluştur"}
            </button>

            <label style={lbl}>HEDEF (ölçülebilir)</label>
            <input placeholder="örn. 3 haftada sınav kaygısını yönetebilir hale gelme" value={form.hedef} onChange={e=>setForm(f=>({...f,hedef:e.target.value}))} style={{...inp,marginBottom:10}} />

            <label style={lbl}>MÜDAHALE ADIMLARI</label>
            <textarea placeholder="1. Nefes egzersizi öğret&#10;2. Düşünce kaydı tut&#10;3. Veli görüşmesi yap" value={form.adimlar} onChange={e=>setForm(f=>({...f,adimlar:e.target.value}))} rows={4} style={{...inp,resize:"vertical",marginBottom:10}} />

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
              <div>
                <label style={lbl}>SÜRE</label>
                <input placeholder="örn. 4 hafta" value={form.sure} onChange={e=>setForm(f=>({...f,sure:e.target.value}))} style={inp} />
              </div>
              <div>
                <label style={lbl}>ÖNCELİK</label>
                <select value={form.oncelik} onChange={e=>setForm(f=>({...f,oncelik:e.target.value}))} style={{...inp,height:38}}>
                  {["Yüksek","Orta","Düşük"].map(o=><option key={o}>{o}</option>)}
                </select>
              </div>
            </div>

            <label style={lbl}>SORUMLU</label>
            <div style={{display:"flex",gap:6,marginBottom:10}}>
              {[["pdr","PDR Danışmanı"],["aile","Aile"],["ogretmen","Öğretmen"],["ogrenci","Öğrenci"]].map(([k,l])=>(
                <button key={k} onClick={()=>setForm(f=>({...f,sorumlu:k}))} style={{flex:1,padding:"6px 4px",fontSize:11,fontWeight:form.sorumlu===k?700:500,borderRadius:8,border:`2px solid ${form.sorumlu===k?ACCENT:BORDER}`,background:form.sorumlu===k?ACCENT_LIGHT:CARD,color:form.sorumlu===k?ACCENT:MUTED,cursor:"pointer"}}>{l}</button>
              ))}
            </div>

            <button onClick={handleKaydet} disabled={!form.hedef.trim()} style={{width:"100%",padding:"11px",background:form.hedef?ACCENT:BORDER,color:form.hedef?"#fff":MUTED,border:"none",borderRadius:10,fontSize:14,fontWeight:800,cursor:"pointer"}}>
              {kaydedildi?"✓ Kaydedildi!":"💾 Planı Kaydet"}
            </button>
          </div>

          {/* Mevcut planlar */}
          {ogrPlanlar.length > 0 && (
            <div>
              <div style={{fontSize:12,fontWeight:700,color:TEXT,marginBottom:10}}>Mevcut Planlar ({ogrPlanlar.length})</div>
              {ogrPlanlar.map(p => {
                const [rc,rbg] = durumRenk[p.durum]||["#888","#eee"];
                return (
                  <div key={p.id} style={{background:CARD,border:`1px solid ${BORDER}`,borderLeft:`4px solid ${rc}`,borderRadius:10,padding:12,marginBottom:10}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                      <div style={{fontSize:13,fontWeight:700,color:TEXT,flex:1}}>{p.hedef}</div>
                      <span style={{background:rbg,color:rc,borderRadius:20,padding:"2px 10px",fontSize:10,fontWeight:700,flexShrink:0,marginLeft:8}}>{p.durum}</span>
                    </div>
                    <div style={{fontSize:11,color:MUTED,marginBottom:6}}>{p.tarih} · {p.sure} · {p.oncelik} öncelik</div>
                    {p.adimlar && <div style={{fontSize:12,color:TEXT,lineHeight:1.7,whiteSpace:"pre-wrap",background:"#f9f9f9",borderRadius:6,padding:"6px 8px",marginBottom:8}}>{p.adimlar}</div>}
                    <div style={{display:"flex",gap:6}}>
                      {["Devam Ediyor","Tamamlandı","Askıda"].map(d=>(
                        <button key={d} onClick={()=>handleDurumGuncelle(p.ogrenci,p.ogrenciSinif,p.id,d)} style={{flex:1,padding:"5px",fontSize:10,fontWeight:p.durum===d?700:500,borderRadius:7,border:`1px solid ${p.durum===d?rc:BORDER}`,background:p.durum===d?rbg:CARD,color:p.durum===d?rc:MUTED,cursor:"pointer"}}>{d}</button>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── Sevk Takip Bileşeni ───────────────────────────────────────────────────────
function SevkTakipEkrani({ kayitliListesi, aktifOgrenci, setAktifOgrenci, sevkler, setSevkler }) {
  const [aramaMetni, setAramaMetni] = useState("");
  const [form, setForm] = useState({ studentName:"", className:"", sevkYeri:"RAM", sevkNedeni:"", tarih:today(), sonucBekleniyor:true, geri_bildirim:"" });
  const [gosterFiltre, setGosterFiltre] = useState("Tümü");

  useEffect(() => {
    if (aktifOgrenci?.name) setForm(f=>({...f, studentName:aktifOgrenci.name, className:aktifOgrenci.className||""}));
    else setForm(f=>({...f, studentName:"", className:""}));
  }, [aktifOgrenci?.name]);

  const inp = { width:"100%", padding:"9px 11px", border:`1px solid ${BORDER}`, borderRadius:9, fontSize:13, background:CARD, color:TEXT, outline:"none", boxSizing:"border-box", fontFamily:"inherit" };
  const lbl = { fontSize:11, fontWeight:600, color:MUTED, display:"block", marginBottom:4, textTransform:"uppercase" };

  async function handleKaydet() {
    if (!form.studentName.trim() || !form.sevkNedeni.trim()) return;
    const yeni = { id: uid(), ...form };
    const updated = [yeni, ...sevkler];
    setSevkler(updated); await saveSevkler(updated);
    setForm({ studentName:"", className:"", sevkYeri:"RAM", sevkNedeni:"", tarih:today(), sonucBekleniyor:true, geri_bildirim:"" });
  }

  async function handleGuncelle(id, fields) {
    const updated = sevkler.map(s => s.id===id ? {...s, ...fields} : s);
    setSevkler(updated); await saveSevkler(updated);
  }

  const filtreli = sevkler.filter(s => {
    if (gosterFiltre === "Bekliyor") return s.sonucBekleniyor;
    if (gosterFiltre === "Tamamlandı") return !s.sonucBekleniyor;
    return true;
  }).filter(s => !aramaMetni || s.studentName?.toLowerCase().includes(aramaMetni.toLowerCase()));

  const sevkYerleri = ["RAM","Psikolog","Psikiyatrist","Özel Eğitim","Sosyal Hizmetler","Rehberlik Araştırma","Diğer"];

  return (
    <div>
      <div style={{background:"#FDF6E3",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:13,color:"#B07D1A",fontWeight:600}}>
