  // Risk Listesi
  async function handleRiskEkle() {
    if (!riskForm.studentName.trim()) return;
    setRiskAiLoading(true);
    const ad = riskForm.studentName.toLowerCase().trim();
    const ogrGorusmeler = records.filter(r => pdrAyniOgrenci(r.studentName, r.className, riskForm.studentName, riskForm.className, r.numara, riskForm.numara));
    const ogrP1 = profiles.find(p => pdrAyniOgrenci(p.studentName, p.className, riskForm.studentName, riskForm.className, p.numara, riskForm.numara));
    // Deneme özeti — öğrenci listesi rozetiyle aynı hesaplama mantığı (8. sınıf
    // varsa öncelikli, yoksa 7. sınıf); AI'a akademik/deneme bağlamı olarak verilir.
    const ogrDenemeSozluk = pdrSozlukOku(denemeler, riskForm.studentName, riskForm.className, riskForm.numara) || {};
    const ogr7sinif = ogrDenemeSozluk["7sinif"] || null;
    const ogrDenemeSayisi = Object.keys(ogrDenemeSozluk).filter(k => k !== "7sinif").length;
    const ogrDenemeOrtSayi = ogrDenemeSayisi > 0
      ? Object.entries(ogrDenemeSozluk).filter(([k])=>k!=="7sinif").reduce((s,[,nets])=>s+aktifDenemeDersleri.reduce((ss,d)=>ss+(parseFloat(nets[d.key])||0),0),0)/ogrDenemeSayisi
      : null;
    let denemeOzet = null;
    if (ogrDenemeOrtSayi !== null) {
      denemeOzet = { ortalama: ogrDenemeOrtSayi.toFixed(1), toplam: aktifDenemeDersleri.reduce((s,d)=>s+d.maks,0), risk: denemeRiskHesapla(ogrDenemeOrtSayi, aktifDenemeDersleri), kaynak: "Bu dönem denemeleri" };
    } else if (ogr7sinif) {
      denemeOzet = { ortalama: ogr7sinif.ortalama, toplam: null, risk: ogr7sinif.risk, kaynak: "Geçmiş dönem denemeleri" };
    }
    const aiAnaliz = await getRiskAnalizi(riskForm, ogrGorusmeler, ogrP1, kutuphane, kademe, denemeOzet);
    // Risk düzeyini AI cevabından çek
    // Risk düzeyi
    let aiOncelik = riskForm.oncelik;
    if (aiAnaliz.includes("YÜKSEK") || aiAnaliz.includes("YUKSEK")) aiOncelik = "Yüksek";
    else if (aiAnaliz.includes("ORTA")) aiOncelik = "Orta";
    else if (aiAnaliz.includes("HAFİF") || aiAnaliz.includes("HAFIF")) aiOncelik = "Düşük";

    // Risk türü — AI'dan otomatik çek
    const riskTurleriListesi = ["Davranış","Akademik","Aile","Akran / Zorbalık","Akran-Zorbalık","Duygusal","Devamsızlık","Öz Zarar","Sağlık","Madde Kullanımı","Teknoloji / Ekran Bağımlılığı","Teknoloji-Ekran Bağımlılığı","Ekonomik Güçlük","Yas / Kayıp","Yas-Kayıp","Travma","Özel Öğrenme Güçlüğü","Diğer"];
    let aiRiskTuru = riskForm.riskTuru;
    const turMatch = aiAnaliz.match(/RİSK TÜRÜ:\s*(.+)/);
    if (turMatch) {
      const bulunan = turMatch[1].trim().replace(/-/g, " / ");
      const eslesen = riskTurleriListesi.find(t => t.toLowerCase().replace(/-/g," / ") === bulunan.toLowerCase() || bulunan.toLowerCase().includes(t.toLowerCase().split("/")[0].trim().toLowerCase()));
      if (eslesen) aiRiskTuru = eslesen;
      else aiRiskTuru = bulunan.split("\n")[0].trim();
    }

    // Teknoloji/Ekran Bağımlılığı taraması — ana risk türünden bağımsız, AI'ın
    // her analizde görüşme notlarına dayanarak yaptığı ayrı bir tarama. Sadece
    // "Var" ise Sınıf görünümünde rozet olarak gösterilir.
    let teknolojiBagimliligi = false;
    let teknolojiGerekce = "";
    const teknoMatch = aiAnaliz.match(/BELİRTİ:\s*(Var|Yok|Yetersiz Veri)/i);
    if (teknoMatch && teknoMatch[1].toLowerCase() === "var") {
      teknolojiBagimliligi = true;
      const gerekceMatch = aiAnaliz.match(/GEREKÇE:\s*(.+)/);
      if (gerekceMatch) teknolojiGerekce = gerekceMatch[1].split("\n")[0].trim();
    }

    const item = { id: uid(), tarih: today(), ...riskForm, riskTuru: aiRiskTuru, oncelik: aiOncelik, aiAnaliz, kapandi: false, teknolojiBagimliligi, teknolojiGerekce };
    const updated = [item, ...riskListesi];
    setRiskListesi(updated); await saveRiskListesi(updated);
    setRiskForm({ studentName: "", className: "", numara: "", riskTuru: "", aciklama: "", oncelik: "Orta" });
    setRiskAiLoading(false);
  }

              const updOog = oogDegerlendirmeler.filter(o => !silinecekMi(o.studentName, o.className, o.numara));
              setOogDegerlendirmeler(updOog); await saveOogDegerlendirmeler(updOog);

              function pdrSozlukSinifTemizle(sozluk) {
                const yeni = { ...sozluk };
                silinecekler.forEach(o => {
                  delete yeni[pdrOgrAnahtar(o.studentName, o.className, o.numara)];
                  delete yeni[pdrOgrAnahtar(o.studentName, o.className)];
                  delete yeni[o.studentName];
                });
                return yeni;
              }
              const updDen = pdrSozlukSinifTemizle(denemeler);
              setDenemeler(updDen); await saveDenemeler(updDen);

              const updMudahale = pdrSozlukSinifTemizle(mudahalePlan);
              setMudahalePlan(updMudahale); await saveMudahalePlan(updMudahale);

              const updHazirlik = pdrSozlukSinifTemizle(hazirlikNotlari);
              setHazirlikNotlari(updHazirlik); await saveHazirlikNotlari(updHazirlik);

              const updIlerleme2 = pdrSozlukSinifTemizle(ilerlemeNotlari);
              setIlerlemeNotlari(updIlerleme2); await saveIlerlemeNotlari(updIlerleme2);
            }}
            setAktifOgrenci={setAktifOgrenci}
            setTab={setTab}
          />
        )}

        {/* ── DENEME TAKİP ─────────────────────────────────────────── */}
        {tab === "deneme" && (
          <DenemeTabip
            denemeler={denemeler}
            setDenemeler={setDenemeler}
            kayitliListesi={kayitliListesi}
            aktifOgrenci={aktifOgrenci}
            setAktifOgrenci={setAktifOgrenci}
            handleDenemeAnaliz={handleDenemeAnaliz}
            denemeAiLoading={denemeAiLoading}
            denemeAnaliz={denemeAnaliz}
            ogrenciler={ogrenciler}
            setOgrenciler={setOgrenciler}
            aktifYil={aktifYil}
            sinavTuru={sinavTuru}
            setSinavTuru={setSinavTuru}
          />
        )}

        {/* ── SINIF PROFİLİ ────────────────────────────────────────── */}
        {tab === "sinif_profili" && (
          <SinifProfili
            ogrenciler={ogrenciler}
            setOgrenciler={setOgrenciler}
            records={records}
            riskListesi={riskListesi}
            aktifYil={aktifYil}
            sinifListesi={sinifListesi}
            setSinifListesi={setSinifListesi}
          />
        )}

        {/* ── RİSK LİSTESİ ─────────────────────────────────────────── */}
        {tab === "risk" && (
          <div>
            <div style={{
              background: `linear-gradient(135deg, #C0392BE6 0%, #7B241CE6 100%)`,
              backdropFilter: "blur(14px)", WebkitBackdropFilter: "blur(14px)",
              border: "1px solid rgba(255,255,255,0.25)", borderRadius: 16, padding: 16, marginBottom: 16,
              boxShadow: "0 8px 24px rgba(123,36,28,0.3)"
            }}>
              <div style={{ color: "#fff", fontSize: 12, fontWeight: 700, letterSpacing: 0.5, opacity: 0.9, marginBottom: 10 }}>⚠ Risk Takip Özeti</div>
              <div style={{ display: "flex", gap: 10 }}>
                {[["Yüksek", "#FF5A4E"], ["Orta", "#FFA53E"], ["Düşük", "#FFD84A"]].map(([lvl, c]) => {
                  const sayi = riskListesi.filter(r => !r.kapandi && r.oncelik === lvl).length;
                  return (
                    <div key={lvl} style={{ flex: 1, background: "rgba(255,255,255,0.12)", borderRadius: 12, padding: "10px 8px", textAlign: "center" }}>
                      <div style={{ fontSize: 22, fontWeight: 900, color: c }}>{sayi}</div>
                      <div style={{ fontSize: 10, color: "#fff", opacity: 0.85, fontWeight: 700, marginTop: 2 }}>{lvl}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Yeni risk ekle */}
            <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: 14, marginBottom: 16 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: TEXT, marginBottom: 10 }}>+ Yeni Risk Kaydı</div>

              {riskForm.studentName && (
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", background:ACCENT_LIGHT, border:`1px solid ${ACCENT}`, borderRadius:10, padding:"8px 12px", marginBottom:10 }}>
                  <div style={{ fontSize:12, fontWeight:700, color:ACCENT }}>👤 {riskForm.studentName} — {riskForm.className}{riskForm.numara ? ` · No: ${riskForm.numara}` : ""}</div>
                  <button onClick={() => { setRiskForm(f => ({ ...f, studentName:"", className:"", numara:"" })); setAktifOgrenci({ name:"", className:"" }); }} style={{
                    background:"none", border:`1px solid ${ACCENT}`, color:ACCENT, borderRadius:8, padding:"3px 9px", fontSize:11, fontWeight:600, cursor:"pointer"
                  }}>✕ Bağlantıyı Kes</button>
                </div>
              )}

              {kayitliListesi.length > 0 && (
                <div style={{ marginBottom: 10 }}>
                  <label style={labelStyle}>KAYITLI ÖĞRENCİDEN SEÇ</label>
                  <input value={riskOgrenciArama} onChange={e=>setRiskOgrenciArama(e.target.value)} placeholder="İsim, sınıf veya numara ara… (en az 2 karakter)"
                    style={{ width:"100%", padding:"8px 10px", border:`1px solid ${BORDER}`, borderRadius:8, fontSize:12, boxSizing:"border-box", marginBottom:8 }} />
                  {riskOgrenciArama.trim().length >= 2 ? (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                      {kayitliListesi.filter(o =>
                        o.name.toLowerCase().includes(riskOgrenciArama.toLowerCase()) ||
                        o.className?.toLowerCase().includes(riskOgrenciArama.toLowerCase()) ||
                        o.numara?.includes(riskOgrenciArama)
                      ).slice(0, 20).map(o => {
                        const s = riskForm.studentName === o.name;
                        return (
                          <button key={pdrOgrAnahtar(o.name, o.className, o.numara)} onClick={() => { setRiskForm(f => ({ ...f, studentName: o.name, className: o.className, numara: o.numara || "" })); setAktifOgrenci({ name: o.name, className: o.className || "" }); setRiskOgrenciArama(""); }} style={{
                            padding: "6px 12px", borderRadius: 18,
                            border: s ? "1.5px solid #FF5A4E" : `1.5px solid ${BORDER}`,
                            background: s ? "linear-gradient(135deg, #FF6B5B 0%, #C0392B 100%)" : CARD,
                            color: s ? "#fff" : MUTED,
                            boxShadow: s ? "0 0 12px rgba(255,90,78,0.5)" : "none",
                            fontSize: 11, fontWeight: s ? 800 : 500, cursor: "pointer", transition: "all 0.15s"
                          }}>{o.name}</button>
                        );
                      })}
                    </div>
                  ) : (
                    <div style={{ fontSize:11, color:MUTED, padding:"4px 0" }}>Öğrenciyi bulmak için yaz (en az 2 karakter)</div>
                  )}
                </div>
              )}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
                <div><label style={labelStyle}>AD SOYAD</label>
                  <input placeholder="Ad Soyad" value={riskForm.studentName} onChange={e => setRiskForm(f=>({...f, studentName:e.target.value}))} style={inputStyle} /></div>
                <div><label style={labelStyle}>SINIF</label>
                  <input placeholder="7-A" value={riskForm.className} onChange={e => setRiskForm(f=>({...f, className:e.target.value}))} style={inputStyle} /></div>
              </div>
              <div style={{ marginBottom: 8 }}>
                <label style={labelStyle}>RİSK TÜRÜ</label>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
                  {(() => {
                    const TUR_PALET = ["#E63946","#457B9D","#2A9D8F","#E76F51","#7B5EA7","#E9C46A","#C0392B","#1A8C5B","#8E5B3C","#3B4FD8","#D45D9C","#B07D1A","#00A8A8","#6C757D","#264653"];
                    const turler = ["Davranış", "Akademik", "Aile", "Akran / Zorbalık", "Duygusal", "Devamsızlık", "Öz Zarar", "Sağlık", "Madde Kullanımı", "Teknoloji / Ekran Bağımlılığı", "Ekonomik Güçlük", "Yas / Kayıp", "Travma", "Özel Öğrenme Güçlüğü", "Diğer"];
                    return turler.map((t, ti) => {
                      const s = riskForm.riskTuru === t;
                      const rc = TUR_PALET[ti % TUR_PALET.length];
                      return (
                        <button key={t} onClick={() => setRiskForm(f=>({...f, riskTuru:t}))} style={{
                          padding: "7px 13px", borderRadius: 18,
                          border: `2px solid ${rc}`,
                          background: s ? `linear-gradient(135deg, ${rc} 0%, ${rc}CC 100%)` : `${rc}1A`,
                          color: s ? "#fff" : rc,
                          boxShadow: s ? `0 0 14px ${rc}88` : "none",
                          fontSize: 12, fontWeight: s ? 800 : 700, cursor: "pointer", transition: "all 0.15s"
                        }}>{t}</button>
                      );
                    });
                  })()}
                </div>
              </div>
              <div style={{ marginBottom: 8 }}>
                <label style={labelStyle}>ÖNCELİK</label>
                <div style={{ display: "flex", gap: 8 }}>
                  {[["Yüksek","#FF5A4E","linear-gradient(135deg, #FF6B5B 0%, #C0392B 100%)","rgba(255,90,78,0.5)"],["Orta","#FFA53E","linear-gradient(135deg, #FFB65C 0%, #C97A18 100%)","rgba(255,165,62,0.5)"],["Düşük","#FFD84A","linear-gradient(135deg, #FFE375 0%, #C9A017 100%)","rgba(255,216,74,0.5)"]].map(([p,c,grad,glow]) => {
                    const s = riskForm.oncelik === p;
                    return (
                      <button key={p} onClick={() => setRiskForm(f=>({...f, oncelik:p}))} style={{
                        flex:1, padding:"10px", border: s ? `1.5px solid ${c}` : `1.5px solid ${BORDER}`,
                        borderRadius:12, background: s ? grad : CARD,
                        boxShadow: s ? `0 0 16px ${glow}` : "none",
                        color: s ? "#fff" : MUTED, fontSize:13, fontWeight:800, cursor:"pointer", transition:"all 0.15s"
                      }}>{p}</button>
                    );
                  })}
                </div>
              </div>
              <div style={{ marginBottom: 10 }}>
                <label style={labelStyle}>AÇIKLAMA / GÖZLEM</label>
                <textarea placeholder="Risk durumu hakkında kısa açıklama…" value={riskForm.aciklama}
                  onChange={e => setRiskForm(f=>({...f, aciklama:e.target.value}))}
                  rows={2} style={{...inputStyle, resize:"vertical"}} />
              </div>
              <button onClick={handleRiskEkle} disabled={!riskForm.studentName.trim() || riskAiLoading} style={{
                width:"100%", padding:"13px",
                background: riskAiLoading ? BORDER : riskForm.studentName ? "linear-gradient(135deg, #FF6B5B 0%, #C0392B 100%)" : BORDER,
                color: riskAiLoading || !riskForm.studentName ? MUTED : "#fff",
                boxShadow: (!riskAiLoading && riskForm.studentName) ? "0 0 18px rgba(255,90,78,0.45)" : "none",
                border:"none", borderRadius:12, fontSize:14, fontWeight:800, cursor:"pointer", transition:"all 0.15s"
              }}>{riskAiLoading ? "⏳ AI risk analizi yapıyor…" : "✦ AI Analiz Et ve Kaydet"}</button>
            </div>

            {/* Aktif riskler */}
            {(() => {
              const aktif = riskListesi.filter(r => !r.kapandi);
              const kapali = riskListesi.filter(r => r.kapandi);
              // [ana renk, camsı arka plan gradyanı, parlaklık gölgesi]
              const oncelikRenk = {
                "Yüksek": ["#FF5A4E", "linear-gradient(135deg, #E8443A 0%, #7B1610 100%)", "rgba(255,90,78,0.55)"],
                "Orta":   ["#FFA53E", "linear-gradient(135deg, #E88A2E 0%, #7A4508 100%)", "rgba(255,165,62,0.5)"],
                "Düşük":  ["#FFD84A", "linear-gradient(135deg, #D9B93A 0%, #6E5A08 100%)", "rgba(255,216,74,0.45)"],
              };
              return (
                <>
                  {aktif.length === 0 && <div style={{ textAlign:"center", color:MUTED, marginTop:20, fontSize:14 }}>Aktif risk kaydı yok ✓</div>}
                  {aktif.map(r => {
                    const [rc, rbgGrad, rglow] = oncelikRenk[r.oncelik] || ["#888", "rgba(120,120,120,0.3)", "rgba(120,120,120,0.3)"];
                    return (
                      <div key={r.id} style={{
                        background: rbgGrad, backdropFilter: "blur(12px)", WebkitBackdropFilter: "blur(12px)",
                        border: `1.5px solid ${rc}`, borderRadius: 16, padding: 16, marginBottom: 12,
                        boxShadow: `0 0 20px ${rglow}, 0 6px 18px rgba(0,0,0,0.25)`
                      }}>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:6 }}>
                          <div>
                            <div style={{ fontWeight:900, fontSize:15, color:"#fff" }}>{r.studentName}</div>
                            <div style={{ fontSize:11, color:"rgba(255,255,255,0.75)" }}>{r.tarih} · {r.className}</div>
                          </div>
                          <div style={{ display:"flex", gap:6, flexShrink:0 }}>
                            <span style={{ background:"rgba(255,255,255,0.22)", color:"#fff", borderRadius:20, padding:"3px 12px", fontSize:11, fontWeight:800, border:`1px solid ${rc}` }}>{r.oncelik}</span>
                            {r.riskTuru && <span style={{ background:"rgba(255,255,255,0.15)", color:"#fff", borderRadius:20, padding:"3px 12px", fontSize:11, fontWeight:700 }}>{r.riskTuru}</span>}
                          </div>
                        </div>
                        <div style={{ height:1, background:"rgba(255,255,255,0.25)", margin:"8px 0" }} />
                        {r.aciklama && <div style={{ fontSize:12, color:"rgba(255,255,255,0.92)", lineHeight:1.6, marginBottom:10 }}>{r.aciklama}</div>}
                        <div style={{ display:"flex", gap:8 }}>
                          {r.aiAnaliz && (() => {
                            const duz = r.aiAnaliz.includes("YÜKSEK") ? "YÜKSEK" : r.aiAnaliz.includes("ORTA") ? "ORTA" : "HAFİF";
                            return (
                              <div style={{ marginBottom:8 }}>
                                <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                                  <span style={{ background:"rgba(255,255,255,0.2)", color:"#fff", borderRadius:20, padding:"3px 12px", fontSize:12, fontWeight:800 }}>
                                    {duz==="YÜKSEK"?"🔴":duz==="ORTA"?"🟡":"🟢"} Risk Düzeyi: {duz}
                                  </span>
                                </div>
                                <div style={{ fontSize:12, color:"#fff", lineHeight:1.7, whiteSpace:"pre-wrap", background:"rgba(0,0,0,0.2)", borderRadius:10, padding:10 }}>
                                  {r.aiAnaliz}
                                </div>
                              </div>
                            );
                          })()}
                        <button onClick={() => handleRiskKapat(r.id)} style={{ flex:1, padding:"9px", background:"rgba(255,255,255,0.9)", color:"#1a1a1a", border:"none", borderRadius:10, fontSize:12, fontWeight:800, cursor:"pointer" }}>✓ Kapat</button>
                          <button onClick={() => handleRiskSil(r.id)} style={{ padding:"9px 14px", background:"rgba(0,0,0,0.2)", border:`1px solid rgba(255,255,255,0.4)`, color:"#fff", borderRadius:10, fontSize:12, cursor:"pointer" }}>Sil</button>
                        </div>
                      </div>
                    );
                  })}
                  {kapali.length > 0 && (
                    <details style={{ marginTop:16 }}>
                      <summary style={{ fontSize:12, color:MUTED, cursor:"pointer", fontWeight:600 }}>Kapatılan kayıtlar ({kapali.length})</summary>
                      {kapali.map(r => (
                        <div key={r.id} style={{ background:BG, border:`1px solid ${BORDER}`, borderRadius:10, padding:10, marginTop:8, opacity:0.7 }}>
                          <div style={{ display:"flex", justifyContent:"space-between" }}>
                            <div style={{ fontSize:12, fontWeight:700 }}>{r.studentName} · {r.riskTuru}</div>
                            <button onClick={() => handleRiskSil(r.id)} style={{ background:"none", border:"none", color:MUTED, cursor:"pointer", fontSize:11 }}>Sil</button>
                          </div>
                          <div style={{ fontSize:11, color:MUTED }}>{r.tarih} → {r.kapanmaTarih}</div>
                        </div>
                      ))}
                    </details>
                  )}
                </>
              );
            })()}
          </div>
        )}

        {/* ── KÜTÜPHANE ────────────────────────────────────────────── */}
        {tab === "kutuphane" && (
          <div>
            <div style={{ background: "#FEF9C3", borderRadius: 10, padding: "10px 14px", marginBottom: 16, fontSize: 13, color: "#92400E", fontWeight: 600, lineHeight: 1.6 }}>
              📚 PDF yükle → AI özetlesin → Profil analizlerinde teorik referans olarak kullansın.
              {kutuphane.length > 0 && <span style={{ color: ACCENT, fontWeight: 700 }}> ({kutuphane.length} kaynak yüklü)</span>}
            </div>

            <KutuphaneEkle kutuphane={kutuphane} setKutuphane={setKutuphane} />

            {/* Yüklü Kaynaklar */}
            {kutuphane.length === 0 ? (
              <div style={{ textAlign: "center", color: MUTED, marginTop: 20, fontSize: 14 }}>
                Henüz kaynak yüklenmedi.
              </div>
            ) : kutuphane.map(k => (
              <div key={k.id} style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, marginBottom: 10, overflow: "hidden" }}>
                <div style={{ padding: "12px 16px", borderBottom: `1px solid ${BORDER}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 700, fontSize: 14, color: TEXT, marginBottom: 2 }}>
                        {k.tur === "yonetmelik" ? "📜" : "📄"} {k.baslik}
                        {k.tur === "yonetmelik" && <span style={{ marginLeft:6, background:"#EEF2FF", color:BLUE, borderRadius:8, padding:"1px 6px", fontSize:9, fontWeight:800 }}>YÖNETMELİK</span>}
                      </div>
                      <div style={{ fontSize: 11, color: MUTED }}>{k.tarih} · {k.dosyaAdi}</div>
                    </div>
                    <button onClick={() => handleKutuphaneDelete(k.id)} style={{
                      background: "none", border: "1px solid #F28B82", color: "#C5221F",
                      borderRadius: 8, padding: "3px 10px", fontSize: 11, cursor: "pointer", flexShrink: 0
                    }}>Sil</button>
                  </div>
                </div>
                <div style={{ padding: "12px 16px", fontSize: 12, color: TEXT, lineHeight: 1.7, whiteSpace: "pre-wrap", background: "#FAFDF7" }}>
                  {k.ozet}
                </div>
              </div>
            ))}

            {kutuphane.length > 0 && (
              <div style={{ background: ACCENT_LIGHT, borderRadius: 10, padding: "10px 14px", fontSize: 12, color: ACCENT, fontWeight: 600, marginTop: 8 }}>
                ✓ Bu {kutuphane.length} kaynak, Profil 1 AI analizi yapılırken otomatik referans alınacak.
              </div>
            )}
          </div>
        )}

        {/* ── İSTATİSTİK ───────────────────────────────────────────── */}
        {tab === "istatistik" && (
          <div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
              {[
                { label: "Toplam Görüşme", value: totalRecs, color: ACCENT },
                { label: "Öğrenci Görüşmesi", value: studentRecs.length, color: ACCENT },
                { label: "Veli Görüşmesi", value: veliRecs.length, color: ORANGE },
                { label: "Farklı Öğrenci", value: uniqueStudents, color: BLUE },
                { label: "Profil Kaydı", value: profiles.length, color: PURPLE },
              ].map(c => (
                <div key={c.label} style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "14px 16px", textAlign: "center" }}>
                  <div style={{ fontSize: 28, fontWeight: 800, color: c.color }}>{c.value}</div>
                  <div style={{ fontSize: 11, color: MUTED, marginTop: 2 }}>{c.label}</div>
                </div>
              ))}
            </div>
            {topTopics.length > 0 && (
              <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: ACCENT, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 14 }}>Konulara Göre</div>
                {topTopics.map(([topic, count]) => <StatBar key={topic} label={topic} value={count} max={maxTopic} color={ACCENT} />)}
              </div>
            )}
            {Object.keys(monthCount).length > 0 && (
              <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: ACCENT, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 14 }}>Aylara Göre</div>
                {Object.entries(monthCount).map(([month, count]) => <StatBar key={month} label={month} value={count} max={maxMonth} color={BLUE} />)}
              </div>
            )}
            {totalRecs === 0 && <div style={{ textAlign: "center", color: MUTED, marginTop: 40, fontSize: 14 }}><div style={{ fontSize: 36, marginBottom: 8 }}>📊</div>Henüz kayıt yok.</div>}
            <button onClick={() => exportToExcel(records)} disabled={totalRecs === 0} style={{
              width: "100%", padding: 13, background: totalRecs > 0 ? ACCENT : BORDER,
              color: totalRecs > 0 ? "#fff" : MUTED, border: "none", borderRadius: 12, fontSize: 15, fontWeight: 800, cursor: totalRecs > 0 ? "pointer" : "default"
            }}>⬇ Excel'e Aktar</button>
          </div>
        )}
        {tab === "ayarlar" && <AyarlarEkrani
          ogrenciler={ogrenciler} records={records} profiles={profiles} profiles2={profiles2}
          oogDegerlendirmeler={oogDegerlendirmeler} riskListesi={riskListesi} denemeler={denemeler}
          sevkler={sevkler} mudahalePlan={mudahalePlan} hazirlikNotlari={hazirlikNotlari}
          ilerlemeNotlari={ilerlemeNotlari} profNotlari={profNotlari} kutuphane={kutuphane}
          yillar={yillar} sinifListesi={sinifListesi} aktifYil={aktifYil}
          kademe={kademe} setKademe={setKademe}
          sinavTuru={sinavTuru} setSinavTuru={setSinavTuru}
        />}
        {tab === "onaylar" && pdrIsAdmin && <KullaniciOnaylari />}
      </div>
    </div>
  );
}

const inputStyle = {
  width: "100%", padding: "10px 12px", border: `1px solid ${BORDER}`,
  borderRadius: 10, fontSize: 14, background: CARD, color: TEXT,
  outline: "none", boxSizing: "border-box", fontFamily: "inherit"
};
const labelStyle = { fontSize: 11, fontWeight: 600, color: MUTED, display: "block", marginBottom: 4 };

const container=document.getElementById("root");
const root=ReactDOM.createRoot(container);
window.__pdrAuthReady.then(() => {
  root.render(React.createElement(App));
  setTimeout(()=>{const s=document.getElementById("splash");if(s)s.className="hide";},800);
});
</script>

</body>
</html>
