  ayt_sozel: { ad: "AYT — Sözel", dersler: [
    { key: "edebiyat",  label: "Edebiyat-Sosyal", maks: 24, color: "#E63946" },
    { key: "tarih",     label: "Tarih",           maks: 21, color: "#E76F51" },
    { key: "cografya",  label: "Coğrafya",        maks: 17, color: "#2D6A4F" },
    { key: "felsefe",   label: "Felsefe Grubu",   maks: 12, color: "#7B5EA7" },
    { key: "din",       label: "Din Kültürü",     maks: 6,  color: "#E9C46A" },
  ]},
  ayt_dil: { ad: "AYT — Yabancı Dil (YDT)", dersler: [
    { key: "yabanci_dil", label: "Yabancı Dil", maks: 80, color: "#7B5EA7" },
  ]},
};
function aktifDersler(sinavTuru) { return (SINAV_TURLERI[sinavTuru] || SINAV_TURLERI.lgs).dersler; }
// Risk eşiği artık sabit net (55/30) değil, sınavın toplam soru sayısına göre
// YÜZDE olarak hesaplanır — böylece 90 soruluk LGS'de de, 120 soruluk TYT'de
// de, 80 soruluk AYT'de de doğru orantılı çalışır.
function denemeRiskHesapla(net, dersler) {
  const maksToplam = dersler.reduce((s, d) => s + d.maks, 0) || 90;
  const yuzde = (net / maksToplam) * 100;
  return yuzde >= 61 ? "dusuk" : yuzde >= 33 ? "orta" : "yuksek";
}
const DENEME_SAYISI = 10;

function DenemeTabip({ denemeler, setDenemeler, kayitliListesi, aktifOgrenci, setAktifOgrenci, handleDenemeAnaliz, denemeAiLoading, denemeAnaliz, ogrenciler, setOgrenciler, aktifYil, sinavTuru, setSinavTuru }) {
  const dersler = aktifDersler(sinavTuru);
  const [excelPanelAcik, setExcelPanelAcik] = useState(false);
  const [seciliOgrenci, setSeciliOgrenci] = useState(aktifOgrenci?.name || "");
  // aktifOgrenci değişince güncelle
  useEffect(() => { if (aktifOgrenci?.name) setSeciliOgrenci(aktifOgrenci.name); }, [aktifOgrenci?.name]);
  const [aramaMetni, setAramaMetni] = useState("");
  const [aktifDeneme, setAktifDeneme] = useState(null); // { ogrenci, no }
  const [formNet, setFormNet] = useState({});
  const [kaydedildi, setKaydedildi] = useState(false);

  const filtreliListe = kayitliListesi.filter(o =>
    o.name.toLowerCase().includes(aramaMetni.toLowerCase()) ||
    o.className?.toLowerCase().includes(aramaMetni.toLowerCase()) ||
    o.numara?.includes(aramaMetni)
  );
  const seciliOgrenciSinif = kayitliListesi.find(o => o.name === seciliOgrenci)?.className || aktifOgrenci?.className || "";
  const seciliOgrenciNumara = kayitliListesi.find(o => o.name === seciliOgrenci)?.numara || "";

  const ogrenciDenemeler = pdrSozlukOku(denemeler, seciliOgrenci, seciliOgrenciSinif, seciliOgrenciNumara) || {};
  const sinif7Data = ogrenciDenemeler["7sinif"] || null;

  // Toplam net hesapla
  function toplamNet(nets) {
    return dersler.reduce((sum, d) => sum + (parseFloat(nets?.[d.key]) || 0), 0);
  }

  // Grafik için veri
  const grafikData = Array.from({ length: DENEME_SAYISI }, (_, i) => {
    const no = i + 1;
    const nets = ogrenciDenemeler[no];
    return { no, nets, toplam: nets ? toplamNet(nets) : null };
  });

  const girilenDenemeler = grafikData.filter(d => d.nets);
  const maxNet = 90;
  const chartW = 280, chartH = 140, padL = 30, padB = 20, padT = 10, padR = 10;
  const innerW = chartW - padL - padR;
  const innerH = chartH - padB - padT;

  // SVG çizgi grafiği
  function LineChart() {
    if (girilenDenemeler.length < 1) return null;
    const points = girilenDenemeler.map((d, i) => ({
      x: padL + (i / Math.max(girilenDenemeler.length - 1, 1)) * innerW,
      y: padT + innerH - ((d.toplam / maxNet) * innerH),
      d
    }));
    const pathD = points.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
    const avgNet = girilenDenemeler.reduce((s, d) => s + d.toplam, 0) / girilenDenemeler.length;
    const trend = girilenDenemeler.length > 1
      ? girilenDenemeler[girilenDenemeler.length - 1].toplam - girilenDenemeler[0].toplam
      : 0;

    return (
      <div style={{
        background: `linear-gradient(135deg, ${ACCENT}E6 0%, #164A35E6 100%)`,
        backdropFilter: "blur(14px)", WebkitBackdropFilter: "blur(14px)",
        border: "1px solid rgba(255,255,255,0.25)", borderRadius: 16, padding: 16, marginBottom: 14,
        boxShadow: "0 8px 24px rgba(15,61,46,0.3)"
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
          <span style={{ fontSize: 12, fontWeight: 700, color: "#fff" }}>◈ Toplam Net Gelişimi</span>
          <div style={{ display: "flex", gap: 10 }}>
            <span style={{ fontSize: 11, color: "rgba(255,255,255,0.75)" }}>Ort: <b style={{ color: "#fff" }}>{avgNet.toFixed(1)}</b></span>
            <span style={{ fontSize: 11, fontWeight: 700, color: trend >= 0 ? "#8FE3B0" : "#FF9E90" }}>
              {trend >= 0 ? "↑" : "↓"} {Math.abs(trend).toFixed(1)}
            </span>
          </div>
        </div>
        <svg width={chartW} height={chartH} style={{ overflow: "visible" }}>
          {/* Grid yatay çizgiler */}
          {[0, 22.5, 45, 67.5, 90].map(v => {
            const y = padT + innerH - (v / maxNet) * innerH;
            return (
              <g key={v}>
                <line x1={padL} y1={y} x2={chartW - padR} y2={y} stroke="rgba(255,255,255,0.2)" strokeWidth={0.7} strokeDasharray="3,3" />
                <text x={padL - 4} y={y} textAnchor="end" dominantBaseline="middle" fontSize={8} fill="rgba(255,255,255,0.6)">{v}</text>
              </g>
            );
          })}
          {/* Ortalama çizgisi */}
          {(() => {
            const avgY = padT + innerH - (avgNet / maxNet) * innerH;
            return <line x1={padL} y1={avgY} x2={chartW - padR} y2={avgY} stroke="#fff" strokeWidth={1} strokeDasharray="4,4" opacity={0.5} />;
          })()}
          {/* Veri çizgisi */}
          <path d={pathD} fill="none" stroke="#fff" strokeWidth={2.5} strokeLinejoin="round" />
          {/* Alan doldurma */}
          <path d={pathD + ` L${points[points.length-1].x},${padT+innerH} L${points[0].x},${padT+innerH} Z`}
            fill="#ffffff" opacity={0.12} />
          {/* Noktalar */}
          {points.map((p, i) => (
            <g key={i}>
              <circle cx={p.x} cy={p.y} r={5} fill="#fff" stroke={ACCENT} strokeWidth={2} />
              <text x={p.x} y={p.y - 10} textAnchor="middle" fontSize={9} fontWeight={700} fill="#fff">
                {p.d.toplam.toFixed(1)}
              </text>
              <text x={p.x} y={padT + innerH + 14} textAnchor="middle" fontSize={8} fill="rgba(255,255,255,0.7)">D{p.d.no}</text>
            </g>
          ))}
        </svg>
        {/* Ders bazlı bar */}
        {girilenDenemeler.length > 0 && (
          <div style={{ marginTop: 10 }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: "rgba(255,255,255,0.75)", marginBottom: 6 }}>Son Deneme Ders Dağılımı</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 4 }}>
              {dersler.map(d => {
                const sonDeneme = girilenDenemeler[girilenDenemeler.length - 1];
                const val = parseFloat(sonDeneme?.nets?.[d.key]) || 0;
                const pct = (val / d.maks) * 100;
                return (
                  <div key={d.key} style={{ background: BG, borderRadius: 6, padding: "5px 7px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3 }}>
                      <span style={{ fontSize: 9, color: d.color, fontWeight: 700 }}>{d.label}</span>
                      <span style={{ fontSize: 10, fontWeight: 800, color: d.color }}>{val}/{d.maks}</span>
                    </div>
                    <div style={{ height: 4, background: BORDER, borderRadius: 2 }}>
                      <div style={{ width: `${pct}%`, height: "100%", background: d.color, borderRadius: 2 }} />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    );
  }

  // Deneme giriş formu
  function DenemeForm({ no, mevcutNets, onKaydet, onIptal }) {
    const [nets, setNets] = useState({
      turkce: "", mat: "", fen: "", sosyal: "", ingilizce: "", din: "",
      ...mevcutNets
    });
    const toplam = toplamNet(nets);
    return (
      <div style={{ background: CARD, border: `2px solid ${ACCENT}`, borderRadius: 12, padding: 14, marginBottom: 12 }}>
        <div style={{ fontSize: 13, fontWeight: 800, color: ACCENT, marginBottom: 12 }}>Deneme {no} — Net Girişi</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>
          {dersler.map(d => (
            <div key={d.key}>
              <label style={{ fontSize: 10, fontWeight: 700, color: d.color, display: "block", marginBottom: 3 }}>
                {d.label} (/{d.maks})
              </label>
              <input
                type="number" step="0.33" min="0" max={d.maks}
                placeholder="0"
                value={nets[d.key]}
                onChange={e => setNets(n => ({ ...n, [d.key]: e.target.value }))}
                style={{ width: "100%", padding: "7px 8px", border: `1px solid ${nets[d.key] ? d.color : BORDER}`, borderRadius: 7, fontSize: 13, fontWeight: 700, textAlign: "center", boxSizing: "border-box", outline: "none", color: d.color }}
              />
            </div>
          ))}
        </div>
        <div style={{ background: ACCENT_LIGHT, borderRadius: 8, padding: "8px 12px", marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: ACCENT }}>Toplam Net</span>
          <span style={{ fontSize: 22, fontWeight: 900, color: ACCENT }}>{isNaN(toplam) ? "—" : toplam.toFixed(2)}</span>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={onIptal} style={{ flex: 1, padding: "9px", background: CARD, color: MUTED, border: `1px solid ${BORDER}`, borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>İptal</button>
          <button onClick={() => onKaydet(nets)} style={{ flex: 2, padding: "9px", background: ACCENT, color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 800, cursor: "pointer" }}>Kaydet</button>
        </div>
      </div>
    );
  }

  async function handleKaydet(no, nets) {
    const guncelNets = { ...(pdrSozlukOku(denemeler, seciliOgrenci, seciliOgrenciSinif, seciliOgrenciNumara) || {}), [no]: nets };
    const updated = pdrSozlukYaz(denemeler, seciliOgrenci, seciliOgrenciSinif, guncelNets, seciliOgrenciNumara);
    setDenemeler(updated);
    await saveDenemeler(updated);
    setAktifDeneme(null);
    setKaydedildi(no);
    setTimeout(() => setKaydedildi(false), 2000);
  }

  async function handleSil(no) {
    const ogr = { ...(pdrSozlukOku(denemeler, seciliOgrenci, seciliOgrenciSinif, seciliOgrenciNumara) || {}) };
    delete ogr[no];
    const updated = pdrSozlukYaz(denemeler, seciliOgrenci, seciliOgrenciSinif, ogr, seciliOgrenciNumara);
    setDenemeler(updated);
    await saveDenemeler(updated);
  }

  const dersToplami = dersler.reduce((s,d)=>s+d.maks,0);

  return (
    <div>
      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 10, flexWrap: "wrap" }}>
        <label style={{ fontSize: 11, fontWeight: 700, color: MUTED }}>SINAV TÜRÜ</label>
        <select value={sinavTuru || "lgs"} onChange={e => setSinavTuru(e.target.value)} style={{
          padding: "6px 10px", borderRadius: 8, border: `1px solid ${BORDER}`, fontSize: 12, fontWeight: 700, color: TEXT, background: CARD, cursor: "pointer"
        }}>
          {Object.entries(SINAV_TURLERI).map(([k, v]) => <option key={k} value={k}>{v.ad}</option>)}
        </select>
      </div>
      <div style={{ background: "#EEF2FF", borderRadius: 10, padding: "10px 14px", marginBottom: 14, fontSize: 13, color: BLUE, fontWeight: 600 }}>
        📊 {SINAV_TURLERI[sinavTuru || "lgs"].ad} Deneme Takibi — {DENEME_SAYISI} deneme, {dersler.length} ders, {dersToplami} soru
      </div>

      {!excelPanelAcik && (
        <button onClick={() => setExcelPanelAcik(true)} style={{
          width: "100%", padding: "10px", marginBottom: 14,
          background: "#1A8C5B", color: "#fff", border: "none", borderRadius: 10,
          fontSize: 13, fontWeight: 800, cursor: "pointer"
        }}>
          📂 Geçmiş Dönem Excel Toplu Yükle
        </button>
      )}

      {excelPanelAcik && (
        <ExcelTopluYukle
          ogrenciler={ogrenciler}
          setOgrenciler={setOgrenciler}
          denemeler={denemeler}
          setDenemeler={setDenemeler}
          aktifYil={aktifYil}
          sinavTuru={sinavTuru}
          onKapat={() => setExcelPanelAcik(false)}
        />
      )}

      {/* Öğrenci arama */}
      <div style={{ marginBottom: 14 }}>
        <input placeholder="Öğrenci ara…" value={aramaMetni}
          onChange={e => setAramaMetni(e.target.value)}
          style={{ width: "100%", padding: "9px 12px", border: `1px solid ${BORDER}`, borderRadius: 10, fontSize: 13, background: CARD, color: TEXT, outline: "none", boxSizing: "border-box" }} />
      </div>

      {kayitliListesi.length === 0 ? (
        <div style={{ textAlign: "center", color: MUTED, marginTop: 30, fontSize: 14 }}>
          <div style={{ fontSize: 36, marginBottom: 8 }}>📊</div>
          Önce görüşme notu veya profil ekleyin.
        </div>
      ) : (
        <>
          {/* Öğrenci listesi — sadece arama yapıldığında gösterilir */}
          {aramaMetni.trim() ? (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 16 }}>
              {filtreliListe.length === 0 && (
                <div style={{ textAlign: "center", color: MUTED, fontSize: 13, width: "100%", padding: "10px 0" }}>Eşleşen öğrenci bulunamadı</div>
              )}
              {filtreliListe.map(o => {
                const ogrNets = pdrSozlukOku(denemeler, o.name, o.className, o.numara) || {};
                const dCount = Object.keys(ogrNets).length;
                const s = seciliOgrenci === o.name;
                return (
                  <button key={pdrOgrAnahtar(o.name, o.className, o.numara)} onClick={() => { setSeciliOgrenci(o.name); setAktifDeneme(null); }} style={{
                    padding: "6px 12px", borderRadius: 20,
                    border: `2px solid ${s ? ACCENT : BORDER}`,
                    background: s ? ACCENT_LIGHT : CARD,
                    color: s ? ACCENT : MUTED,
                    fontSize: 12, fontWeight: s ? 700 : 500, cursor: "pointer",
                    display: "flex", alignItems: "center", gap: 5
                  }}>
                    {o.name}
                    {dCount > 0 && <span style={{ background: s ? ACCENT : BORDER, color: s ? "#fff" : MUTED, borderRadius: 10, padding: "0 5px", fontSize: 10, fontWeight: 700 }}>{dCount}</span>}
                  </button>
                );
              })}
            </div>
          ) : !seciliOgrenci && (
            <div style={{ textAlign: "center", color: MUTED, marginTop: 20, marginBottom: 16, fontSize: 13 }}>
              🔍 Öğrenciyi bulmak için yukarıdaki kutuya isim, sınıf veya numara yaz
            </div>
          )}

          {seciliOgrenci && (
            <>
              {/* Seçili öğrenci başlığı */}
              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14, background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:"10px 14px" }}>
                <div style={{ width:34, height:34, borderRadius:"50%", background:ACCENT_LIGHT, color:ACCENT, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, fontSize:14, flexShrink:0 }}>
                  {seciliOgrenci.charAt(0).toUpperCase()}
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontWeight:800, fontSize:15, color:TEXT, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{seciliOgrenci}</div>
                  <div style={{ fontSize:11, color:MUTED }}>{seciliOgrenciSinif}{seciliOgrenciNumara ? ` · No: ${seciliOgrenciNumara}` : ""}</div>
                </div>
                <button onClick={() => { setSeciliOgrenci(""); if (setAktifOgrenci) setAktifOgrenci({ name: "", className: "" }); }} style={{
                  background:"none", border:`1px solid ${BORDER}`, color:MUTED, borderRadius:8,
                  padding:"5px 10px", fontSize:11, fontWeight:600, cursor:"pointer", flexShrink:0
                }}>Değiştir</button>
              </div>
              {/* Grafik */}
              {/* 7. Sınıf Özet */}
        {sinif7Data && (
          <div style={{background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:12, marginBottom:12}}>
            <div style={{fontSize:11, fontWeight:700, color:MUTED, textTransform:"uppercase", marginBottom:8}}>📊 Geçmiş Dönem Deneme Geçmişi</div>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:22, fontWeight:900, color:
                  sinif7Data.risk==="yuksek"?"#C0392B":sinif7Data.risk==="orta"?"#B07D1A":"#1A8C5B"
                }}>{sinif7Data.ortalama}</div>
                <div style={{fontSize:10, color:MUTED}}>Ortalama Net</div>
              </div>
              <div style={{
                background: sinif7Data.risk==="yuksek"?"#FDECEA":sinif7Data.risk==="orta"?"#FDF6E3":"#E6F5EE",
                color: sinif7Data.risk==="yuksek"?"#C0392B":sinif7Data.risk==="orta"?"#B07D1A":"#1A8C5B",
                borderRadius:20, padding:"6px 14px", fontSize:13, fontWeight:900
              }}>
                {sinif7Data.risk==="yuksek"?"🔴 Yüksek Risk":sinif7Data.risk==="orta"?"🟡 Orta Risk":"🟢 Düşük Risk"}
              </div>
            </div>
            <div style={{display:"flex", flexWrap:"wrap", gap:4}}>
              {Object.entries(sinif7Data.denemeler).map(([no, d]) => {
                const net = d.toplam_net;
                const c = net>=55?"#1A8C5B":net>=30?"#B07D1A":"#C0392B";
                const bg = net>=55?"#E6F5EE":net>=30?"#FDF6E3":"#FDECEA";
                return <div key={no} style={{background:bg,borderRadius:8,padding:"4px 10px",textAlign:"center"}}>
                  <div style={{fontSize:9,color:"#888"}}>D{no}</div>
                  <div style={{fontSize:13,fontWeight:900,color:c}}>{net.toFixed(1)}</div>
                </div>;
              })}
            </div>
          </div>
        )}

        {sinif7Data && girilenDenemeler.length > 0 && (
          <div style={{background:"#E6F5EE", borderRadius:8, padding:"8px 12px", marginBottom:10, fontSize:11, color:"#1A8C5B", fontWeight:600}}>
            📈 8. Sınıf Denemeleri (Manuel Giriş)
          </div>
        )}

        <LineChart />

              {/* Aktif form */}
              {aktifDeneme && (
                <DenemeForm
                  no={aktifDeneme}
                  mevcutNets={ogrenciDenemeler[aktifDeneme] || {}}
                  onKaydet={(nets) => handleKaydet(aktifDeneme, nets)}
                  onIptal={() => setAktifDeneme(null)}
                />
              )}

              {/* Deneme kartları */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                {Array.from({ length: DENEME_SAYISI }, (_, i) => {
                  const no = i + 1;
                  const nets = ogrenciDenemeler[no];
                  const toplam = nets ? toplamNet(nets) : null;
                  const aktif = aktifDeneme === no;
                  const renkSinif = toplam === null ? null : toplam >= 70 ? "#1A8C5B" : toplam >= 50 ? "#B07D1A" : "#C0392B";
                  const bgSinif = toplam === null ? BG : toplam >= 70 ? "#E6F5EE" : toplam >= 50 ? "#FDF6E3" : "#FDECEA";
                  return (
                    <div key={no} style={{
                      background: aktif ? ACCENT_LIGHT : bgSinif,
                      border: `2px solid ${aktif ? ACCENT : (renkSinif || BORDER)}`,
                      borderRadius: 12, padding: 12, cursor: "pointer",
                      transition: "all .15s"
                    }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: nets ? 8 : 0 }}>
                        <span style={{ fontSize: 12, fontWeight: 700, color: aktif ? ACCENT : TEXT }}>Deneme {no}</span>
                        {kaydedildi === no && <span style={{ fontSize: 10, color: "#1A8C5B", fontWeight: 700 }}>✓</span>}
                      </div>
                      {toplam !== null ? (
                        <>
                          <div style={{ fontSize: 24, fontWeight: 900, color: renkSinif, marginBottom: 4 }}>{toplam.toFixed(2)}</div>
                          <div style={{ display: "flex", flexWrap: "wrap", gap: 3, marginBottom: 8 }}>
                            {dersler.map(d => (
                              <span key={d.key} style={{ fontSize: 9, background: "#fff", color: d.color, borderRadius: 4, padding: "1px 4px", fontWeight: 700 }}>
                                {d.label[0]}: {parseFloat(nets[d.key] || 0).toFixed(2) === (parseFloat(nets[d.key] || 0)).toString() ? parseFloat(nets[d.key] || 0) : parseFloat(nets[d.key] || 0).toFixed(2)}
                              </span>
                            ))}
                          </div>
                          <div style={{ display: "flex", gap: 4 }}>
                            <button onClick={() => setAktifDeneme(aktif ? null : no)} style={{ flex: 1, padding: "5px", background: ACCENT_LIGHT, color: ACCENT, border: "none", borderRadius: 6, fontSize: 10, fontWeight: 700, cursor: "pointer" }}>✏ Düzenle</button>
                            <button onClick={() => handleSil(no)} style={{ padding: "5px 8px", background: "none", border: "1px solid #F28B82", color: "#C5221F", borderRadius: 6, fontSize: 10, cursor: "pointer" }}>✕</button>
                          </div>
                        </>
                      ) : (
                        <button onClick={() => setAktifDeneme(aktif ? null : no)} style={{ width: "100%", padding: "8px", background: aktif ? ACCENT : CARD, color: aktif ? "#fff" : MUTED, border: `1px solid ${aktif ? ACCENT : BORDER}`, borderRadius: 8, fontSize: 11, fontWeight: 700, cursor: "pointer", marginTop: 4 }}>
                          {aktif ? "Formu Kapat" : "+ Net Gir"}
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>

              {/* Özet tablo */}
              {girilenDenemeler.length > 0 && (
                <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: 14, marginTop: 14 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: TEXT, marginBottom: 10 }}>Deneme Özeti</div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>
                    {[
                      { label: "Girilen", val: girilenDenemeler.length, color: ACCENT },
                      { label: "En Yüksek", val: Math.max(...girilenDenemeler.map(d => d.toplam)).toFixed(1), color: "#1A8C5B" },
                      { label: "En Düşük", val: Math.min(...girilenDenemeler.map(d => d.toplam)).toFixed(1), color: "#C0392B" },
                      { label: "Ortalama", val: (girilenDenemeler.reduce((s,d)=>s+d.toplam,0)/girilenDenemeler.length).toFixed(1), color: BLUE },
                    ].map(item => (
                      <div key={item.label} style={{ textAlign: "center", background: BG, borderRadius: 8, padding: "8px 4px" }}>
                        <div style={{ fontSize: 16, fontWeight: 900, color: item.color }}>{item.val}</div>
                        <div style={{ fontSize: 10, color: MUTED }}>{item.label}</div>
                      </div>
                    ))}
                  </div>
                  {/* AI Analiz Butonu */}
                  <button onClick={() => handleDenemeAnaliz(seciliOgrenci, seciliOgrenciSinif, seciliOgrenciNumara)} disabled={denemeAiLoading}
                    style={{ width:"100%", padding:"11px", background: denemeAiLoading ? BORDER : "#457B9D", color: denemeAiLoading ? MUTED : "#fff", border:"none", borderRadius:10, fontSize:13, fontWeight:700, cursor:"pointer", marginBottom: pdrSozlukOku(denemeAnaliz, seciliOgrenci, seciliOgrenciSinif, seciliOgrenciNumara) ? 12 : 0 }}>
                    {denemeAiLoading ? "⏳ AI analiz yapıyor…" : "✦ AI Deneme & Hazırlık Analizi"}
                  </button>
                  {pdrSozlukOku(denemeAnaliz, seciliOgrenci, seciliOgrenciSinif, seciliOgrenciNumara) && (
                    <div style={{ background: "#EEF2FF", border: `1px solid #c7ccf5`, borderRadius: 10, padding: 12 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: BLUE, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8 }}>✦ AI LGS Hazırlık Analizi</div>
                      <div style={{ fontSize: 13, color: TEXT, lineHeight: 1.8, whiteSpace: "pre-wrap" }}>{pdrSozlukOku(denemeAnaliz, seciliOgrenci, seciliOgrenciSinif, seciliOgrenciNumara)}</div>
                    </div>
                  )}
                </div>
              )}
            </>
          )}
        </>
      )}
    </div>
  );
}


// ── ProfilMerkez Bileşeni ─────────────────────────────────────────────────────
// ── ÖÖG (Özel Öğrenme Güçlüğü) Ön-Tarama Paneli ───────────────────────────────
function OOGPaneli({ seciliAd, seciliSinif, seciliNumara, oogDegerlendirmeler, setOogDegerlendirmeler }) {
  const mevcut = oogDegerlendirmeler.find(o => pdrAyniOgrenci(o.studentName, o.className, seciliAd, seciliSinif, o.numara, seciliNumara));
  const [cevaplar, setCevaplar] = useState(mevcut?.cevaplar || {});
  const [kaydedildi, setKaydedildi] = useState(false);

  useEffect(() => {
    const m = oogDegerlendirmeler.find(o => pdrAyniOgrenci(o.studentName, o.className, seciliAd, seciliSinif, o.numara, seciliNumara));
    setCevaplar(m?.cevaplar || {});
    setKaydedildi(false);
  }, [seciliAd, seciliSinif, seciliNumara]);

  function cevapVer(kategoriKey, soruIndex, val) {
    setCevaplar(c => ({ ...c, [kategoriKey + "_" + soruIndex]: val }));
  }

  const sonuc = oogSonucHesapla(cevaplar);

  async function handleKaydet() {
    if (!seciliAd.trim()) return;
    const kayit = {
      id: mevcut?.id || uid(),
      date: today(),
      studentName: seciliAd, className: seciliSinif, numara: seciliNumara,
      cevaplar, yuzde: sonuc.yuzde, kategoriPuan: sonuc.kategoriPuan,
    };
    const updated = mevcut
      ? oogDegerlendirmeler.map(o => o.id === mevcut.id ? kayit : o)
      : [kayit, ...oogDegerlendirmeler];
    setOogDegerlendirmeler(updated);
    await saveOogDegerlendirmeler(updated);
    setKaydedildi(true);
    setTimeout(() => setKaydedildi(false), 2500);
  }

  if (!seciliAd.trim()) {
    return <div style={{textAlign:"center", color:MUTED, padding:20, fontSize:13}}>Önce bir öğrenci seçin</div>;
  }

  return (
    <div>
      <div style={{background:"#EEF2FF", border:`1px solid #c7ccf5`, borderRadius:10, padding:"10px 12px", marginBottom:14, fontSize:11, color:"#3B4FD8", lineHeight:1.6}}>
        🧩 Bu bir <b>tarama aracıdır, tanı koymaz</b>. Öğrenciyi gözlemleyerek her maddeyi işaretle. Şüphe düzeyi yüksek çıkarsa RAM/uzman yönlendirmesi önerilir.
      </div>

      {sonuc.tamamlananSoru > 0 && (
        <div style={{background:sonuc.seviye.bg, border:`1px solid ${sonuc.seviye.color}33`, borderRadius:12, padding:14, marginBottom:16, textAlign:"center"}}>
          <div style={{fontSize:32, fontWeight:900, color:sonuc.seviye.color}}>%{sonuc.yuzde}</div>
          <div style={{fontSize:13, fontWeight:700, color:sonuc.seviye.color, marginBottom:4}}>{sonuc.seviye.label}</div>
          <div style={{fontSize:11, color:MUTED}}>
            {sonuc.puanlananSoru}/{sonuc.toplamSoru} soru puanlandı
            {sonuc.gozlenemeyenSayisi > 0 && ` · ${sonuc.gozlenemeyenSayisi} madde gözlenemedi (hesaba katılmadı)`}
          </div>
          <div style={{display:"flex", flexWrap:"wrap", gap:6, justifyContent:"center", marginTop:10}}>
            {OOG_KATEGORILER.map(k => (
              <span key={k.key} style={{fontSize:10, fontWeight:700, padding:"3px 8px", borderRadius:10, background:"#fff", border:`1px solid ${BORDER}`, color:TEXT}}>
                {k.label.split(" ")[0]} {sonuc.kategoriPuan[k.key] === null ? "—" : `%${sonuc.kategoriPuan[k.key]}`}
              </span>
            ))}
          </div>
        </div>
      )}

      {OOG_KATEGORILER.map(kategori => (
        <div key={kategori.key} style={{marginBottom:16}}>
          <div style={{fontSize:12, fontWeight:800, color:ACCENT, marginBottom:8}}>{kategori.label}</div>
          {kategori.sorular.map((soru, i) => {
            const key = kategori.key + "_" + i;
            return (
              <div key={key} style={{marginBottom:10}}>
                <div style={{fontSize:12, color:TEXT, marginBottom:5}}>{soru}</div>
                <div style={{display:"flex", gap:5}}>
                  {OOG_SECENEKLER.map(sec => (
                    <button key={sec.val} onClick={() => cevapVer(kategori.key, i, sec.val)} style={{
                      flex:1, padding:"7px 4px", borderRadius:8, fontSize:10, fontWeight:700, cursor:"pointer",
                      border:`1.5px solid ${cevaplar[key]===sec.val?ACCENT:BORDER}`,
                      background:cevaplar[key]===sec.val?ACCENT_LIGHT:CARD,
                      color:cevaplar[key]===sec.val?ACCENT:MUTED,
                    }}>{sec.label}</button>
                  ))}
                  <button onClick={() => cevapVer(kategori.key, i, OOG_GOZLENEMEDI)} style={{
                    flex:0.85, padding:"7px 4px", borderRadius:8, fontSize:9, fontWeight:700, cursor:"pointer",
                    border:`1.5px dashed ${cevaplar[key]===OOG_GOZLENEMEDI?"#457B9D":BORDER}`,
                    background:cevaplar[key]===OOG_GOZLENEMEDI?"#EEF2FF":CARD,
                    color:cevaplar[key]===OOG_GOZLENEMEDI?"#457B9D":MUTED,
                  }}>🔍 Gözlenemedi</button>
                </div>
              </div>
            );
          })}
        </div>
      ))}

      <button onClick={handleKaydet} style={{
        width:"100%", padding:13, background:ACCENT, color:"#fff", border:"none", borderRadius:12,
        fontSize:15, fontWeight:800, cursor:"pointer", marginTop:4
      }}>{kaydedildi ? "✓ Kaydedildi" : "💾 Kaydet"}</button>
    </div>
  );
}

function ProfilMerkez({
  aktifOgrenci, setAktifOgrenci, kayitliListesi,
  profiles, setProfiles,
  profiles2, setProfiles2,
  oogDegerlendirmeler, setOogDegerlendirmeler,
  denemeler, records, kutuphane,
  onRaporAc, sinavTuru, onDegerlendirmeAc,
}) {
  const dersler = aktifDersler(sinavTuru);
  // Seçili öğrenci
  const [seciliAd, setSeciliAd] = useState(aktifOgrenci?.name || "");
  const [seciliSinif, setSeciliSinif] = useState(aktifOgrenci?.className || "");
  const [seciliNumara, setSeciliNumara] = useState("");
  const [aramaMetni, setAramaMetni] = useState("");
  useEffect(() => {
    if (aktifOgrenci?.name) {
      setSeciliAd(aktifOgrenci.name); setSeciliSinif(aktifOgrenci.className || "");
      setSeciliNumara(kayitliListesi.find(o => pdrAyniOgrenci(o.name, o.className, aktifOgrenci.name, aktifOgrenci.className))?.numara || "");
    } else {
      setSeciliAd(""); setSeciliSinif(""); setSeciliNumara("");
    }
  }, [aktifOgrenci?.name]);

  // Form state
  const [profForm, setProfForm] = useState({ notes:"", scores:{...EMPTY_SCORES}, analysis:"" });
  const [prof2Form, setProf2Form] = useState({...EMPTY_PROF2});
  const [prof2Analiz, setProf2Analiz] = useState("");
  const [scoresLoading, setScoresLoading] = useState(false);
  const [profAiLoading, setProfAiLoading] = useState(false);
  const [prof2AiLoading, setProf2AiLoading] = useState(false);
  const [scoresSet, setScoresSet] = useState(false);
  const [kaydedildi, setKaydedildi] = useState(false);
  // Görünüm modu: form | onizleme
  const [mod, setMod] = useState("form");
  // P1/P2 aktif alt sekme
  const [altSekme, setAltSekme] = useState("p1");

  // Mevcut kayıtları yükle
  const mevcutP1 = profiles.find(p => pdrAyniOgrenci(p.studentName, p.className, seciliAd, seciliSinif, p.numara, seciliNumara));
  const mevcutP2 = profiles2.find(p => pdrAyniOgrenci(p.studentName, p.className, seciliAd, seciliSinif, p.numara, seciliNumara));
  const ogrRec = records.filter(r => pdrAyniOgrenci(r.studentName, r.className, seciliAd, seciliSinif, r.numara, seciliNumara));
  const ogrRec2 = ogrRec; // alias for P2 context
  const ogrDeneme = pdrSozlukOku(denemeler, seciliAd, seciliSinif, seciliNumara) || {};
  const denemeGirilen = Object.entries(ogrDeneme).sort((a,b)=>a[0]-b[0]).map(([no,nets])=>({
    no:parseInt(no), nets, toplam: dersler.reduce((s,d)=>s+(parseFloat(nets[d.key])||0),0)
  }));

  useEffect(() => {
    if (!seciliAd) return;
    const p1 = profiles.find(p => pdrAyniOgrenci(p.studentName, p.className, seciliAd, seciliSinif, p.numara, seciliNumara));
    const p2 = profiles2.find(p => pdrAyniOgrenci(p.studentName, p.className, seciliAd, seciliSinif, p.numara, seciliNumara));
    if (p1) setProfForm({ notes:p1.notes||"", scores:{...EMPTY_SCORES,...p1.scores}, analysis:p1.analysis||"" });
    else setProfForm({ notes:"", scores:{...EMPTY_SCORES}, analysis:"" });
    if (p2) {
      setProf2Form({...EMPTY_PROF2,...p2, sinavlar:{...EMPTY_SINAV,...(p2.sinavlar||{})}, d2:{...EMPTY_D2,...(p2.d2||{})}, ilgiler:p2.ilgiler||[]});
      setProf2Analiz(p2.d2_analiz||"");
    } else {
      setProf2Form({...EMPTY_PROF2});
      setProf2Analiz("");
    }
    setScoresSet(false);
  }, [seciliAd, profiles, profiles2]);

  const filtreliListe = kayitliListesi.filter(o =>
    o.name.toLowerCase().includes(aramaMetni.toLowerCase()) || o.className?.toLowerCase().includes(aramaMetni.toLowerCase())
  );

  // AI: görüşme notlarından puan
  async function handleScoresFromNotes() {
    const ad = seciliAd.toLowerCase().trim();
    const recs = records.filter(r => pdrAyniOgrenci(r.studentName, r.className, seciliAd, seciliSinif, r.numara, seciliNumara) && r.summary);

    // Değerlendirme sorularından mevcut puanları oku
    let degSkorlar = null;
    let degBilgi = "";
    try {
      const degKey = "deg-" + ad.replace(/\s+/g, "-");
      const degData = await window.storage.get(degKey);
      if (degData) {
        const parsed = JSON.parse(degData.value);
        degSkorlar = parsed.skorlar;
        degBilgi = "DEĞERLENDİRME SORUSU PUANLARI (" + (parsed.tarih||"") + "):\n" +
          DIMENSIONS.map(d => d.label + ": " + (parsed.skorlar?.[d.key]||3) + "/5").join(", ");
      }
    } catch {}

    if (recs.length === 0 && !profForm.notes && !degSkorlar) {
      alert("Görüşme notu, danışman notu veya değerlendirme kaydı bulunamadı.");
      return;
    }

    const notlar = [
      recs.length > 0 ? "GÖRÜŞME NOTLARI:\n" + recs.map((r,i)=>`Görüşme ${i+1} (${r.date}): ${r.summary}`).join("\n\n") : "",
      profForm.notes ? "DANIŞMAN NOTU:\n" + profForm.notes : "",
      degBilgi || "",
      mevcutP1?.analysis ? "ÖNCEKİ ANALİZ:\n" + mevcutP1.analysis : ""
    ].filter(Boolean).join("\n\n");

    setScoresLoading(true);
    const aiSkorlar = await getScoresFromNotes(seciliAd, notlar);

    // Ağırlıklı ortalama: görüşme notu varsa %60 AI, %40 değerlendirme; yoksa %100 AI
    let finalSkorlar = aiSkorlar;
    if (degSkorlar) {
      finalSkorlar = {};
      DIMENSIONS.forEach(d => {
        const ai = aiSkorlar[d.key] || 3;
        const deg = degSkorlar[d.key] || 3;
        finalSkorlar[d.key] = Math.round((ai * 0.6) + (deg * 0.4));
      });
    }

    setProfForm(f => ({ ...f, scores: finalSkorlar }));
    setScoresSet(true);
    setScoresLoading(false);
  }

  // AI: P1 analiz
  async function handleP1Analiz() {
    setProfAiLoading(true);
    // Görüşme notlarını da dahil et
    const gorusmeBolum = ogrRec.length > 0
      ? "GÖRÜŞME NOTLARI:\n" + ogrRec.map((r,i)=>`Görüşme ${i+1} (${r.date}${r.topic?", "+r.topic:""}): ${r.summary}`).join("\n\n")
      : "";
    const denemeOzeti = denemeGirilen.length > 0
      ? "DENEME NETLERI: " + denemeGirilen.map(d=>`D${d.no}: ${d.toplam.toFixed(1)}`).join(", ")
      : "";
    const notlar = [gorusmeBolum, profForm.notes, denemeOzeti].filter(Boolean).join("\n\n");
    const analysis = await getProfileAnalysis(seciliAd, seciliSinif, profForm.scores, notlar, kutuphane);
    setProfForm(f => ({ ...f, analysis }));
    setProfAiLoading(false);
  }

  // AI: P2 analiz
  async function handleP2Analiz() {
    setProf2AiLoading(true);
    const gorusmeBolum = ogrRec.length > 0
      ? "GÖRÜŞME NOTLARI:\n" + ogrRec.map((r,i)=>`Görüşme ${i+1} (${r.date}): ${r.summary}`).join("\n\n")
      : "";
    const analiz = await getP2Analiz({
      studentName: seciliAd, className: seciliSinif,
      ...prof2Form,
      gorusmeler: gorusmeBolum,
      denemeGirilen: denemeGirilen
    });
    setProf2Analiz(analiz);
    setProf2AiLoading(false);
  }

  // Kaydet
  async function handleKaydet() {
    if (!seciliAd.trim()) return;
    const adKey = seciliAd.toLowerCase().trim();
    // Stale closure sorununu önle — anlık bul
    const curP1 = profiles.find(p => pdrAyniOgrenci(p.studentName, p.className, seciliAd, seciliSinif, p.numara, seciliNumara));
    const curP2 = profiles2.find(p => pdrAyniOgrenci(p.studentName, p.className, seciliAd, seciliSinif, p.numara, seciliNumara));
    // P1 kaydet
    const p1 = {
      id: curP1?.id || uid(),
      date: curP1?.date || today(),
      studentName: seciliAd, className: seciliSinif, numara: seciliNumara,
      notes: profForm.notes,
      scores: { ...profForm.scores },
      analysis: profForm.analysis
    };
    const updP1 = curP1
      ? profiles.map(p => pdrAyniOgrenci(p.studentName, p.className, seciliAd, seciliSinif, p.numara, seciliNumara) ? p1 : p)
      : [p1, ...profiles];
    setProfiles(updP1);
    await saveProfiles(updP1);
    // P2 kaydet — tüm alanları koru
    const p2 = {
      id: curP2?.id || uid(),
      date: curP2?.date || today(),
      studentName: seciliAd, className: seciliSinif, numara: seciliNumara,
      sinavlar: { ...EMPTY_SINAV, ...(prof2Form.sinavlar || {}) },
      d2: { ...EMPTY_D2, ...(prof2Form.d2 || {}) },
      ilgiler: prof2Form.ilgiler || [],
      ilgiNot: prof2Form.ilgiNot || "",
      kariyer_hedef: prof2Form.kariyer_hedef || "",
      aile_notu: prof2Form.aile_notu || "",
      d2_analiz: prof2Analiz || curP2?.d2_analiz || ""
    };
    const updP2 = curP2
      ? profiles2.map(p => pdrAyniOgrenci(p.studentName, p.className, seciliAd, seciliSinif, p.numara, seciliNumara) ? p2 : p)
      : [p2, ...profiles2];
    setProfiles2(updP2);
    await saveProfiles2(updP2);
    setKaydedildi(true);
    setTimeout(() => setKaydedildi(false), 2000);
    setMod("onizleme");
  }

  // Radar mini
  const inp = { width:"100%", padding:"9px 11px", border:`1px solid ${BORDER}`, borderRadius:9, fontSize:13, background:CARD, color:TEXT, outline:"none", boxSizing:"border-box", fontFamily:"inherit" };
  const lbl = { fontSize:11, fontWeight:600, color:MUTED, display:"block", marginBottom:4, textTransform:"uppercase" };

  return (
    <div>
      {/* Öğrenci seç */}
      <div style={{marginBottom:14}}>
        <input placeholder="Öğrenci ara… (en az 2 karakter)" value={aramaMetni} onChange={e=>setAramaMetni(e.target.value)}
          style={{...inp, marginBottom:8}} />
        {aramaMetni.trim().length >= 2 ? (
          <>
            <div style={{display:"flex", flexWrap:"wrap", gap:6}}>
              {filtreliListe.slice(0,20).map(o=>{
                const s = seciliAd===o.name;
                return (
                  <button key={pdrOgrAnahtar(o.name, o.className, o.numara)} onClick={()=>{setSeciliAd(o.name);setSeciliSinif(o.className||"");setSeciliNumara(o.numara||"");setMod("form");}} style={{
                    padding:"5px 12px", borderRadius:20,
                    border:`2px solid ${s?ACCENT:BORDER}`,
                    background:s?ACCENT_LIGHT:CARD, color:s?ACCENT:MUTED,
                    fontSize:12, fontWeight:s?700:500, cursor:"pointer"
                  }}>{o.name}{o.className?` · ${o.className}`:""}</button>
                );
              })}
            </div>
            {filtreliListe.length > 20 && <div style={{fontSize:11,color:MUTED,marginTop:4}}>{filtreliListe.length-20} daha — aramayı daralt</div>}
          </>
        ) : (
          <div style={{fontSize:11, color:MUTED}}>Öğrenciyi bulmak için en az 2 karakter yaz</div>
        )}
      </div>

      {!seciliAd ? (
        <div style={{textAlign:"center",color:MUTED,marginTop:40,fontSize:14}}>
          <div style={{fontSize:36,marginBottom:8}}>📋</div>
          Yukarıdan bir öğrenci seçin.
        </div>
      ) : (
        <>
          {/* Öğrenci başlık + butonlar */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <div>
              <div style={{fontSize:17,fontWeight:800,color:TEXT}}>{seciliAd}</div>
              <div style={{fontSize:12,color:MUTED}}>{seciliSinif}</div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{ setSeciliAd(""); if(setAktifOgrenci) setAktifOgrenci({ name:"", className:"" }); }} style={{
                background:"none", border:`1px solid ${BORDER}`, color:MUTED, borderRadius:8, padding:"6px 10px", fontSize:12, fontWeight:600, cursor:"pointer"
              }}>✕ Bağlantıyı Kes</button>
              <button onClick={()=>setMod(mod==="form"?"onizleme":"form")} style={{
                background:mod==="onizleme"?ACCENT_LIGHT:BG, color:mod==="onizleme"?ACCENT:MUTED,
                border:`1px solid ${BORDER}`, borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:700, cursor:"pointer"
              }}>{mod==="form"?"👁 Önizle":"✏ Düzenle"}</button>
              <button onClick={()=>{
                // Her zaman mevcut form state'ini kullan — kayıt bekleme
                const p1Rapor = {
                  studentName: seciliAd, className: seciliSinif,
                  scores: profForm.scores,
                  analysis: profForm.analysis,
                  notes: profForm.notes
                };
                const p2Rapor = {
                  studentName: seciliAd, className: seciliSinif,
                  sinavlar: prof2Form.sinavlar || {},
                  d2: prof2Form.d2 || {},
                  ilgiler: prof2Form.ilgiler || [],
                  ilgiNot: prof2Form.ilgiNot || "",
                  kariyer_hedef: prof2Form.kariyer_hedef || "",
                  aile_notu: prof2Form.aile_notu || "",
                  d2_analiz: prof2Analiz || ""
                };
                onRaporAc({ogrenci:seciliAd, ogrenciSinif:seciliSinif, profil1:p1Rapor, profil2:p2Rapor, gorusmeler:ogrRec, denemeler:ogrDeneme});
              }} style={{
                background:ACCENT, color:"#fff", border:"none", borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:700, cursor:"pointer"
              }}>📄 PDF Rapor</button>
            </div>
          </div>

          {/* ── FORM MODU ─────────────────────────────────────── */}
          {mod === "form" && (
            <>
              {/* Alt sekmeler */}
              <div style={{display:"flex",gap:0,marginBottom:14,borderBottom:`1px solid ${BORDER}`}}>
                {[["p1","📊 Profil 1"],["p2","📚 Profil 2 + D2"],["oog","🧩 ÖÖG"]].map(([k,l])=>(
                  <button key={k} onClick={()=>setAltSekme(k)} style={{
                    padding:"9px 16px", border:"none", background:"none",
                    color:altSekme===k?ACCENT:MUTED, fontWeight:altSekme===k?700:500,
                    fontSize:13, cursor:"pointer",
                    borderBottom:altSekme===k?`3px solid ${ACCENT}`:"3px solid transparent"
                  }}>{l}</button>
                ))}
              </div>

              {/* P1 */}
              {altSekme === "p1" && (
                <div>
                  {/* AI puan butonu */}
                  <div style={{background:scoresSet?"#F0FAF4":BG, border:`1px solid ${scoresSet?ACCENT_LIGHT:BORDER}`, borderRadius:10, padding:"10px 14px", marginBottom:12}}>
                    <div style={{fontSize:12,color:MUTED,marginBottom:8}}>
                      {scoresSet ? "✓ Puanlar görüşme notlarından belirlendi — düzenleyebilirsin." : "Görüşme notlarına bakarak AI puanları otomatik belirlesin."}
                    </div>
                    <button onClick={handleScoresFromNotes} disabled={scoresLoading} style={{
                      background:scoresLoading?BORDER:ACCENT, color:"#fff", border:"none",
                      borderRadius:8, padding:"8px 14px", fontSize:12, fontWeight:700, cursor:"pointer"
                    }}>{scoresLoading?"Notlar okunuyor…":"✦ Görüşme Notlarından Puanla"}</button>
                  </div>

                  {/* Radar + sliderlar */}
                  <div style={{
                    background: `linear-gradient(135deg, ${ACCENT}E6 0%, #164A35E6 100%)`,
                    backdropFilter: "blur(14px)", WebkitBackdropFilter: "blur(14px)",
                    border: "1px solid rgba(255,255,255,0.25)", borderRadius: 16, padding: 16, marginBottom: 12,
                    display: "flex", justifyContent: "center", boxShadow: "0 8px 24px rgba(15,61,46,0.3)"
                  }}>
                    <RadarChart scores={profForm.scores} size={240} glass />
                  </div>
                  <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:14,marginBottom:12}}>
                    {onDegerlendirmeAc && (
                      <button onClick={onDegerlendirmeAc} style={{
                        width:"100%", padding:"10px", marginBottom:12, background:"#EEF2FF", border:"1px solid #3B4FD8",
                        borderRadius:10, color:"#3B4FD8", fontSize:13, fontWeight:800, cursor:"pointer"
                      }}>🧭 Gözlem Sorularıyla AI Destekli Değerlendir</button>
                    )}
                    {DIMENSIONS.map(dim=>(
                      <ScoreSlider key={dim.key} dim={dim} value={profForm.scores[dim.key]||3}
                        onChange={v=>setProfForm(f=>({...f,scores:{...f.scores,[dim.key]:v}}))} />
                    ))}
                  </div>

                  <div style={{marginBottom:12}}>
                    <label style={lbl}>DANIŞMAN NOTU</label>
                    <textarea placeholder="Gözlemler, özel notlar…" value={profForm.notes}
                      onChange={e=>setProfForm(f=>({...f,notes:e.target.value}))}
                      rows={3} style={{...inp,resize:"vertical"}} />
                  </div>

                  <button onClick={handleP1Analiz} disabled={profAiLoading} style={{
                    width:"100%",padding:"10px",background:profAiLoading?BORDER:PURPLE,
                    color:profAiLoading?"#666":"#fff",border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:10
                  }}>{profAiLoading?"AI analiz yapıyor…":"✦ AI PDR Analizi Oluştur"}</button>

                  {profForm.analysis && (
                    <div style={{marginBottom:12}}>
                      <label style={lbl}>PDR ANALİZİ</label>
                      <textarea value={profForm.analysis} onChange={e=>setProfForm(f=>({...f,analysis:e.target.value}))}
                        rows={7} style={{...inp,resize:"vertical",lineHeight:1.7,background:"#F0FAF4",borderColor:ACCENT_LIGHT}} />
                    </div>
                  )}
                </div>
              )}

              {/* P2 */}
              {altSekme === "p2" && (
                <div>
                  {/* Sınav puanları — 2 yazılı */}
                  <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:14,marginBottom:12}}>
                    <div style={{fontSize:12,fontWeight:700,color:BLUE,textTransform:"uppercase",letterSpacing:0.5,marginBottom:10}}>Yazılı Sınav Puanları</div>
                    {DERSLER.map(d => {
                      const v1 = prof2Form.sinavlar?.[d.key+"1"]||"";
                      const v2 = prof2Form.sinavlar?.[d.key+"2"]||"";
                      const ort = (parseFloat(v1)||0)&&(parseFloat(v2)||0) ? ((parseFloat(v1)+parseFloat(v2))/2).toFixed(1) : parseFloat(v1)||parseFloat(v2)||null;
                      return (
                        <div key={d.key} style={{marginBottom:10}}>
                          <div style={{fontSize:11,fontWeight:700,color:d.color,marginBottom:4}}>{d.label}</div>
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:6,alignItems:"center"}}>
                            <div>

                          <label style={{...lbl,color:PURPLE}}>{f.key}</label>

                              setProf2Form(p=>{
                                const nd={...(p.d2||{}),[f.key]:val};

                                if(!isNaN(tn)&&tn>0){nd.TN_E=String(tn-e1-e2);nd.E_yuzde=(((e1+e2)/tn)*100).toFixed(2);}

                      ))}
                    </div>
                    {(prof2Form.d2?.TN_E||prof2Form.d2?.E_yuzde) && (
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                        {[{k:"TN_E",l:"TN-E (Test Performansı)"},{k:"E_yuzde",l:"E% (Hata Oranı)"}].map(f=>(
                          <div key={f.k} style={{background:"#F3F0FF",borderRadius:8,padding:"8px",textAlign:"center"}}>

                    {prof2Form.d2?.E_yuzde && (

                <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:14,marginBottom:12}}>

                      E = {mevcutP2.d2.E_yuzde}% → {(()=>{const e=parseFloat(mevcutP2.d2.E_yuzde);return e<=1.5?"✓ NORMAL (0–1.5)":e<=2.5?"⚠ DİKKAT EDİLMELİ (1.5–2.5)":"✗ DİKKAT PROBLEMİ (2.5+)";})()}
                    </div>

                  {mevcutP2.d2.yorum && <div style={{fontSize:12,color:MUTED,marginBottom:8}}>📝 {mevcutP2.d2.yorum}</div>}
                  {mevcutP2.d2_analiz && <div style={{fontSize:12,color:TEXT,background:"#EDE9FF",borderRadius:8,padding:10,lineHeight:1.7,whiteSpace:"pre-wrap"}}>{mevcutP2.d2_analiz}</div>}
                </div>
              )}

              {/* Sınav puanları — 2 yazılı */}
              {mevcutP2?.sinavlar && Object.values(mevcutP2.sinavlar).some(v=>v!=="") && (
                <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:14,marginBottom:12}}>
                  <div style={{fontSize:12,fontWeight:700,color:BLUE,textTransform:"uppercase",letterSpacing:0.5,marginBottom:10}}>Yazılı Sınav Puanları</div>
                  {DERSLER.map(d=>{
                    const v1=parseFloat(mevcutP2.sinavlar?.[d.key+"1"]);
                    const v2=parseFloat(mevcutP2.sinavlar?.[d.key+"2"]);
                    const ort=!isNaN(v1)&&!isNaN(v2)?((v1+v2)/2).toFixed(1):!isNaN(v1)?v1:!isNaN(v2)?v2:null;
                    if(!ort) return null;
                    return (
                      <div key={d.key} style={{marginBottom:10}}>

                            {!isNaN(v2)&&<span style={{fontSize:11,color:MUTED}}>2.Yazılı: <b style={{color:d.color}}>{v2}</b></span>}

                        <div style={{height:8,background:BG,borderRadius:4,display:"flex",gap:2}}>

                          {!isNaN(v2)&&<div style={{width:`${v2/2}%`,height:"100%",background:d.color,borderRadius:4}}/>}
                        </div>
                        <div style={{fontSize:9,color:MUTED,marginTop:2}}>Maks: 100 · Bar = yazılı puanları</div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* İlgi + Kariyer */}
              {mevcutP2 && (mevcutP2.ilgiler?.length>0 || mevcutP2.kariyer_hedef) && (
                <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:14,marginBottom:12}}>
                  {mevcutP2.kariyer_hedef && <div style={{fontSize:13,marginBottom:8}}><b style={{color:ACCENT}}>Kariyer Hedefi:</b> {mevcutP2.kariyer_hedef}</div>}
                  {mevcutP2.ilgiler?.length>0 && <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                    {mevcutP2.ilgiler.map(i=><span key={i} style={{background:"#FEF9C3",color:"#92400E",borderRadius:12,padding:"2px 10px",fontSize:11,fontWeight:600}}>{i}</span>)}
                  </div>}
                </div>
              )}

              {/* Görüşme özeti */}
              {ogrRec.length > 0 && (
                <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:14,marginBottom:12}}>
                  <div style={{fontSize:12,fontWeight:700,color:MUTED,textTransform:"uppercase",letterSpacing:0.5,marginBottom:10}}>Görüşme Geçmişi ({ogrRec.length})</div>
                  {ogrRec.slice(0,3).map(r=>(
                    <div key={r.id} style={{marginBottom:8,padding:8,background:BG,borderRadius:6,borderLeft:`3px solid ${ACCENT}`}}>
                      <div style={{fontSize:10,color:MUTED,marginBottom:3}}>{r.date} · {r.topic||"Genel"}</div>
                      <div style={{fontSize:12,color:TEXT,lineHeight:1.6}}>{r.summary}</div>
                    </div>
                  ))}
                  {ogrRec.length>3 && <div style={{fontSize:11,color:MUTED,textAlign:"center"}}>+{ogrRec.length-3} görüşme daha</div>}
                </div>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── Sınıf Profili Bileşeni ────────────────────────────────────────────────────
function SinifProfili({ ogrenciler, setOgrenciler, records, riskListesi, aktifYil, sinifListesi, setSinifListesi }) {
  const [seciliSinif, setSeciliSinif] = useState(null);
  const [listeYukleAcik, setListeYukleAcik] = useState(false);
  const [listeMetni, setListeMetni] = useState("");
  const [listeSonuc, setListeSonuc] = useState(null);
  const [yeniSinifAdi, setYeniSinifAdi] = useState("");
  const [sinifSilOnay, setSinifSilOnay] = useState(null);

  const RISK_TURLERI = ["Davranış","Akademik","Aile","Akran / Zorbalık","Duygusal","Devamsızlık","Öz Zarar","Sağlık","Madde Kullanımı","Teknoloji / Ekran Bağımlılığı","Ekonomik Güçlük","Yas / Kayıp","Travma","Özel Öğrenme Güçlüğü","Diğer"];

  // Yıl filtreli öğrenciler
  const yilOgrencileri = ogrenciler.filter(o => !o.yil || o.yil === aktifYil);

  // Her şube için istatistik
  function subeIstatistik(sube) {
    const ogr = yilOgrencileri.filter(o => (o.className||"").toUpperCase().replace(" ","") === sube.replace("-","").toUpperCase() ||
      (o.className||"").toUpperCase() === sube.toUpperCase());
    const ogrAdlar = ogr.map(o => o.studentName.toLowerCase().trim());
    const gorusmeler = records.filter(r => ogrAdlar.includes(r.studentName?.toLowerCase().trim()) && ogr.some(o => pdrAyniOgrenci(o.studentName, o.className, r.studentName, r.className)));
    const riskler = riskListesi.filter(r => ogrAdlar.includes(r.studentName?.toLowerCase().trim()) && !r.kapandi && ogr.some(o => pdrAyniOgrenci(o.studentName, o.className, r.studentName, r.className)));
    const riskDagilim = {};
    RISK_TURLERI.forEach(t => {
      riskDagilim[t] = riskler.filter(r => r.riskTuru === t).length;
    });
    return { ogr, gorusmeler, riskler, riskDagilim };
  }

  // Gösterilecek sınıflar: elle eklenen sınıflar + öğrencisi olan tüm sınıflar (birleşim)
  const ogrenciSiniflari = [...new Set(yilOgrencileri.map(o => (o.className||"").trim()).filter(Boolean))];
  const gosterilecekSubeler = [...new Set([...(sinifListesi||[]), ...ogrenciSiniflari])].sort((a,b)=>a.localeCompare(b,"tr"));

  async function handleSinifEkle() {
    const ad = yeniSinifAdi.trim();
    if (!ad || (sinifListesi||[]).includes(ad)) { setYeniSinifAdi(""); return; }
    const guncel = [...(sinifListesi||[]), ad];
    setSinifListesi(guncel);
    await saveSinifListesi(guncel);
    setYeniSinifAdi("");
  }

  async function handleSinifSil(sube) {
    const guncel = (sinifListesi||[]).filter(s => s !== sube);
    setSinifListesi(guncel);
    await saveSinifListesi(guncel);
    setSinifSilOnay(null);
  }


  if (seciliSinif) {
    const st = subeIstatistik(seciliSinif);
    const alfabetikOgrenciler = [...st.ogr].sort((a,b) => a.studentName.localeCompare(b.studentName, "tr"));

    async function handleListeEkle() {
      const satirlar = listeMetni.split("\n").map(s => s.trim()).filter(Boolean);
      let eklenen = 0, zatenVar = 0;
      const yeniOgrenciler = [...ogrenciler];
      satirlar.forEach(satir => {
        // Satır formatı: "123  Ad Soyad" veya "123\tAd Soyad" veya sadece "Ad Soyad"
        const parcalar = satir.split(/\t/).length > 1 ? satir.split(/\t/) : satir.split(/\s+/);
        let numara = "", adSoyad = "";
        if (parcalar.length > 1 && /^\d+$/.test(parcalar[0].trim())) {
          numara = parcalar[0].trim();
          adSoyad = parcalar.slice(1).join(" ").trim();
        } else {
          adSoyad = satir.trim();
        }
        if (!adSoyad) return;
        const mevcut = yeniOgrenciler.find(o => pdrAyniOgrenci(o.studentName, o.className, adSoyad, seciliSinif, o.numara, numara));
        if (mevcut) { zatenVar++; return; }
        yeniOgrenciler.push({ id: uid(), studentName: adSoyad, className: seciliSinif, numara, yil: aktifYil, tarih: today() });
        eklenen++;
      });
      setOgrenciler(yeniOgrenciler);
      await saveOgrenciler(yeniOgrenciler);
      setListeSonuc({ eklenen, zatenVar });
      setListeMetni("");
    }

    return (
      <div>
        {/* Geri butonu */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14, flexWrap:"wrap", rowGap:8}}>
          <button onClick={()=>setSeciliSinif(null)} style={{background:BG,border:`1px solid ${BORDER}`,borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,color:MUTED,cursor:"pointer"}}>← Geri</button>
          <div style={{fontSize:18,fontWeight:900,color:TEXT}}>{seciliSinif} Sınıfı</div>
          <span style={{fontSize:12,color:MUTED}}>· {aktifYil}</span>
          <button onClick={()=>{ setListeYukleAcik(a=>!a); setListeSonuc(null); }} style={{
            marginLeft:"auto", background:listeYukleAcik?ACCENT_LIGHT:"none", border:`1px solid ${ACCENT}`, color:ACCENT,
            borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:700, cursor:"pointer"
          }}>📋 Sınıf Listesini Yükle</button>
        </div>

        {listeYukleAcik && (
          <div style={{background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:14, marginBottom:14}}>
            <div style={{fontSize:12, fontWeight:700, color:TEXT, marginBottom:6}}>
              {seciliSinif} sınıfının tam öğrenci listesini buraya yapıştır
            </div>
            <div style={{fontSize:11, color:MUTED, marginBottom:8, lineHeight:1.6}}>
              Her satıra bir öğrenci — "Numara  Ad Soyad" (örn. e-okul'dan kopyala-yapıştır) ya da sadece "Ad Soyad" yeterli. Deneme Excel'inde olmayan ama sınıfta bulunan öğrenciler böylece eksiksiz eklenir; zaten kayıtlı olanlar tekrar eklenmez.
            </div>
            <textarea value={listeMetni} onChange={e=>setListeMetni(e.target.value)} rows={8}
              placeholder={"101  Ahmet Yılmaz\n102  Zeynep Kaya\n..."}
              style={{width:"100%", padding:"9px 11px", border:`1px solid ${BORDER}`, borderRadius:9, fontSize:13, boxSizing:"border-box", fontFamily:"monospace", resize:"vertical", marginBottom:8}} />
            <button onClick={handleListeEkle} disabled={!listeMetni.trim()} style={{
              width:"100%", padding:"10px", background:listeMetni.trim()?ACCENT:BORDER, color:listeMetni.trim()?"#fff":MUTED,
              border:"none", borderRadius:10, fontSize:13, fontWeight:700, cursor:"pointer"
            }}>Listeyi Ekle</button>
            {listeSonuc && (
              <div style={{marginTop:10, fontSize:12, color:ACCENT, fontWeight:600}}>
                ✓ {listeSonuc.eklenen} öğrenci eklendi, {listeSonuc.zatenVar} zaten kayıtlıydı.
              </div>
            )}
          </div>
        )}

        {/* Özet kartlar */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
          {[
            {label:"Öğrenci",val:st.ogr.length,color:ACCENT},
            {label:"Görüşme",val:st.gorusmeler.length,color:BLUE},
            {label:"Aktif Risk",val:st.riskler.length,color:st.riskler.length>0?"#C0392B":MUTED},
          ].map(c=>(
            <div key={c.label} style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:"10px 6px",textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:900,color:c.color}}>{c.val}</div>
              <div style={{fontSize:10,color:MUTED}}>{c.label}</div>
            </div>
          ))}
        </div>

        {/* Risk Haritası */}
        <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:14,marginBottom:14}}>
          <div style={{fontSize:12,fontWeight:700,color:"#C0392B",textTransform:"uppercase",marginBottom:10}}>⚠ Risk Haritası</div>
          {RISK_TURLERI.map(t => {
            const sayi = st.riskDagilim[t]||0;
            const ogrRisk = st.riskler.filter(r=>r.riskTuru===t);
            return (
              <div key={t} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                  <span style={{fontSize:12,color:TEXT,fontWeight:sayi>0?700:400}}>{t}</span>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    {sayi > 0 && (
                      <div style={{display:"flex",gap:3}}>
                        {ogrRisk.map(r=>(
                          <span key={r.id} style={{background:"#FDECEA",color:"#C0392B",borderRadius:10,padding:"1px 7px",fontSize:10,fontWeight:700}}>{r.studentName}</span>
                        ))}
                      </div>
                    )}
                    <span style={{fontSize:12,fontWeight:900,color:sayi>0?"#C0392B":MUTED,width:20,textAlign:"right"}}>{sayi||"—"}</span>
                  </div>
                </div>
                <div style={{height:4,background:BORDER,borderRadius:2}}>
                  <div style={{width:`${st.ogr.length>0?Math.min(100,(sayi/st.ogr.length)*100*3):0}%`,height:"100%",background:sayi>0?"#C0392B":BORDER,borderRadius:2}}/>
                </div>
              </div>
            );
          })}
          {st.riskler.length === 0 && (
            <div style={{textAlign:"center",color:"#1A8C5B",fontSize:12,padding:"8px 0"}}>✓ Aktif risk kaydı yok</div>
          )}
        </div>

        {/* Öğrenci Listesi */}
        <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:14}}>
          <div style={{fontSize:12,fontWeight:700,color:TEXT,textTransform:"uppercase",marginBottom:10}}>Öğrenci Listesi</div>
          {alfabetikOgrenciler.length === 0 && (
            <div style={{textAlign:"center",color:MUTED,fontSize:12}}>Bu sınıfta kayıtlı öğrenci yok</div>
          )}
          {alfabetikOgrenciler.map(o => {
            const gSayisi = records.filter(r => pdrAyniOgrenci(r.studentName, r.className, o.studentName, o.className, r.numara, o.numara)).length;
            const oRisk = riskListesi.filter(r => pdrAyniOgrenci(r.studentName, r.className, o.studentName, o.className, r.numara, o.numara) && !r.kapandi);
            const oTeknoloji = oRisk.some(r => r.teknolojiBagimliligi);
            return (
              <div key={pdrOgrAnahtar(o.studentName, o.className, o.numara)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 0",borderBottom:`1px solid ${BORDER}`}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{width:30,height:30,borderRadius:"50%",background:ACCENT_LIGHT,color:ACCENT,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800}}>
                    {o.studentName.charAt(0).toUpperCase()}
                  </div>
                  <div>
                    <div style={{fontSize:13,fontWeight:600,color:TEXT}}>{o.studentName}</div>
                    {o.numara && <div style={{fontSize:10,color:MUTED}}>No: {o.numara}</div>}
                  </div>
                </div>
                <div style={{display:"flex",gap:5,alignItems:"center"}}>
                  {oRisk.length > 0 && <span style={{background:"#FDECEA",color:"#C0392B",borderRadius:10,padding:"2px 7px",fontSize:10,fontWeight:700}}>⚠ Risk</span>}
                  {oTeknoloji && <span title={oRisk.find(r=>r.teknolojiBagimliligi)?.teknolojiGerekce || ""} style={{background:"#EEF2FF",color:"#3B4FD8",borderRadius:10,padding:"2px 7px",fontSize:10,fontWeight:700}}>📱 Teknoloji Bağımlılığı</span>}
                  <span style={{background:ACCENT_LIGHT,color:ACCENT,borderRadius:10,padding:"2px 8px",fontSize:10,fontWeight:700}}>{gSayisi} görüşme</span>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // Ana ekran — şube kartları
  return (
    <div>
      <div style={{background:"#EEF2FF",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:13,color:BLUE,fontWeight:600}}>
        🏫 {aktifYil} — Sınıf & Şube Haritası
      </div>

      {/* Sınıf ekle */}
      <div style={{display:"flex", gap:8, marginBottom:14}}>
        <input value={yeniSinifAdi} onChange={e=>setYeniSinifAdi(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSinifEkle()}
          placeholder="Yeni sınıf adı (örn. 8-P)"
          style={{ flex:1, padding:"9px 11px", border:`1px solid ${BORDER}`, borderRadius:9, fontSize:13, boxSizing:"border-box" }} />
        <button onClick={handleSinifEkle} disabled={!yeniSinifAdi.trim()} style={{
          padding:"9px 16px", background:yeniSinifAdi.trim()?ACCENT:BORDER, color:yeniSinifAdi.trim()?"#fff":MUTED,
          border:"none", borderRadius:9, fontSize:13, fontWeight:700, cursor:"pointer", whiteSpace:"nowrap"
        }}>+ Sınıf Ekle</button>
      </div>

      {/* Şube kartları grid */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {gosterilecekSubeler.map(sube => {
          const st = subeIstatistik(sube);
          const riskVar = st.riskler.length > 0;
          const gorusmeli = st.gorusmeler.length > 0;
          return (
            <div key={sube} style={{
              background:CARD, border:`2px solid ${riskVar?"#F28B82":gorusmeli?ACCENT_LIGHT:BORDER}`,
              borderRadius:14, padding:"14px 12px",
              transition:"all 0.15s", position:"relative"
            }}>
              {sinifSilOnay === sube ? (
                <div style={{position:"absolute", top:6, right:6, display:"flex", gap:4, zIndex:2}}>
                  <button onClick={(e)=>{e.stopPropagation(); handleSinifSil(sube);}} style={{background:"#C0392B",color:"#fff",border:"none",borderRadius:6,padding:"3px 7px",fontSize:10,fontWeight:800,cursor:"pointer"}}>Sil</button>
                  <button onClick={(e)=>{e.stopPropagation(); setSinifSilOnay(null);}} style={{background:BG,color:MUTED,border:`1px solid ${BORDER}`,borderRadius:6,padding:"3px 6px",fontSize:10,cursor:"pointer"}}>✕</button>
                </div>
              ) : (
                <button onClick={(e)=>{e.stopPropagation(); setSinifSilOnay(sube);}} title="Sınıfı sil (sadece boş sınıflar için önerilir)" style={{
                  position:"absolute", top:6, right:6, background:"none", border:"none", color:MUTED, fontSize:13, cursor:"pointer", padding:2, zIndex:2
                }}>🗑</button>
              )}
              <div onClick={()=>setSeciliSinif(sube)} style={{cursor:"pointer"}}>
              {/* Şube adı */}
              <div style={{fontSize:22,fontWeight:900,color:riskVar?"#C0392B":gorusmeli?ACCENT:MUTED,marginBottom:6}}>{sube}</div>

              {/* İstatistikler */}
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
                <span style={{background:ACCENT_LIGHT,color:ACCENT,borderRadius:10,padding:"2px 8px",fontSize:11,fontWeight:700}}>
                  👤 {st.ogr.length} öğrenci
                </span>
                {gorusmeli && (
                  <span style={{background:"#EEF2FF",color:BLUE,borderRadius:10,padding:"2px 8px",fontSize:11,fontWeight:700}}>
                    💬 {st.gorusmeler.length} görüşme
                  </span>
                )}
                {riskVar && (
                  <span style={{background:"#FDECEA",color:"#C0392B",borderRadius:10,padding:"2px 8px",fontSize:11,fontWeight:700}}>
                    ⚠ {st.riskler.length} risk
                  </span>
                )}
              </div>

              {/* Risk türleri mini */}
              {riskVar && (
                <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
                  {RISK_TURLERI.filter(t=>st.riskDagilim[t]>0).map(t=>(
                    <span key={t} style={{background:"#FDECEA",color:"#C0392B",borderRadius:8,padding:"1px 6px",fontSize:9,fontWeight:700}}>
                      {t}: {st.riskDagilim[t]}
                    </span>
                  ))}
                </div>
              )}

              {!gorusmeli && st.ogr.length === 0 && (
                <div style={{fontSize:10,color:MUTED}}>Kayıt yok</div>
              )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}


// ── Kütüphane Ekle Bileşeni ───────────────────────────────────────────────────
function KutuphaneEkle({ kutuphane, setKutuphane }) {
  const [mod, setMod] = useState("dosya");
  const [kaynakTuru, setKaynakTuru] = useState("klinik"); // klinik | yonetmelik
  const [yeniBaslik, setYeniBaslik] = useState("");
  const [yeniMetin, setYeniMetin] = useState("");
  const [yeniLink, setYeniLink] = useState("");
  const [yukleniyor, setYukleniyor] = useState(false);

  const stl = { width:"100%", padding:"9px 11px", border:`1px solid ${BORDER}`, borderRadius:9, fontSize:13, background:CARD, color:TEXT, outline:"none", boxSizing:"border-box", fontFamily:"inherit" };
  const lbl = { fontSize:11, fontWeight:600, color:MUTED, display:"block", marginBottom:4, textTransform:"uppercase" };

  // İki farklı özetleme yönelimi: klinik/psikolojik kaynaklar (makale, kitap, araştırma)
  // için PDR/klinik perspektifinden tema özeti; yönetmelik/mevzuat için ise yorum
  // katmadan somut kural, süre, sayısal eşik ve prosedür çıkarımı.
  function ozetSistemPrompt() {
    if (kaynakTuru === "yonetmelik") {
      return "Sen bir egitim mevzuati uzmanisin. Sana verilen belge bir MEB yonetmeligi, genelgesi veya mevzuat metnidir. Bunu okul PDR (rehberlik) uzmani icin, hicbir klinik/psikolojik yorum katmadan, SADECE somut ve uygulanabilir bilgiyi cikararak ozetle. Su yapida yaz: 1. KAPSAM (bu belge ne hakkinda, kimleri ilgilendiriyor) 2. SOMUT KURALLAR VE SAYISAL ESIKLER (sure, gun sayisi, oran, madde numaralari - varsa aynen koru, yuvarlama) 3. PROSEDUR / KIMIN NE YAPMASI GEREKTIGI (adim adim, sorumluluklar, hangi durumda hangi islem yapilir) 4. ISTISNALAR VE OZEL DURUMLAR. Sadece belgede yazani duzenli sekilde aktar, yorum veya oneri ekleme. Sayisal degerleri MUTLAKA aynen koru. Max 500 kelime. Sade yaz. Markdown kullanma.";
    }
    return "Sen Dr. Ayse Kara'sin - 20 yillik klinik deneyime sahip PDR uzmani ve psikologsun. BDT (otomatik dusunceler, sema teorisi, maruz birakma), baglanma teorisi (Bowlby), aile sistemleri (Minuchin), gelisim psikolojisi (Erikson, Vygotsky), Bourdieu sosyolojisi, Frankl anlam terapisi ve Stoa felsefesi perspektifinden degerlendirir; somut, uygulanabilir PDR onerileri sunarsın. Yargilamayan, guclu yonlere odaklanan, Turkce yazan bir klinisyensin. Verilen metni su yapida ozet: 1. ANA TEMALAR 2. PDR/KLINIK ACISINDAN ONEMLI NOKTALAR (BDT, baglanma, sosyoloji, felsefe) 3. ANAHTAR KAVRAMLAR. Max 350 kelime. Sade yaz. Markdown kullanma.";
  }

  async function aiOzetle(metin, baslik) {
    const res = await pdrCallClaude({
        model:"claude-sonnet-4-6", max_tokens:800,
        system: ozetSistemPrompt(),
        messages:[{role:"user", content:`Başlık: ${baslik||"Belirtilmemiş"}\n\nMetin:\n${metin.substring(0,8000)}`}]
      });
    const data = await res.json();
    return data.content?.[0]?.text || metin.substring(0,400);
  }

  async function kaydet(ozet, baslik, kaynak) {
    const yeni = {id:uid(), baslik:baslik||"İsimsiz Kaynak", dosyaAdi:kaynak, ozet, tur:kaynakTuru, tarih:today()};
    const updated = [yeni, ...kutuphane];
    setKutuphane(updated);
    await saveKutuphane(updated);
    setYeniBaslik(""); setYeniMetin(""); setYeniLink("");
  }

  async function handleDosya(file) {
    if (!file) return;
    setYukleniyor(true);
    try {
      const baslik = yeniBaslik || file.name.replace(/\.pdf$/i,"");
      if (file.type === "application/pdf") {
        const b64 = await new Promise((res,rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result.split(",")[1]);
          r.onerror = rej;
          r.readAsDataURL(file);
        });
        const resp = await pdrCallClaude({
            model:"claude-sonnet-4-6", max_tokens:800,
            system: ozetSistemPrompt(),
            messages:[{role:"user", content:[
              {type:"document", source:{type:"base64", media_type:"application/pdf", data:b64}},
              {type:"text", text: kaynakTuru === "yonetmelik"
                ? `Bu yönetmelik/mevzuat belgesini yukarıdaki talimata göre özetle. Başlık: ${baslik}`
                : `Bu belgeyi PDR perspektifinden özetle. Başlık: ${baslik}`}
            ]}]
          });
        const data = await resp.json();
        const ozet = data.content?.[0]?.text || "Özet alınamadı.";
        await kaydet(ozet, baslik, file.name);
      } else {
        const metin = await file.text();
        const ozet = await aiOzetle(metin, baslik);
        await kaydet(ozet, baslik, file.name);
      }
    } catch(e) { alert("Hata: " + e.message); }
    setYukleniyor(false);
  }

  async function handleLink() {
    if (!yeniLink.trim()) return;
    setYukleniyor(true);
    try {
      const baslik = yeniBaslik || yeniLink;

      // 1. Sayfayı fetch et
      let sayfaIcerigi = "";
      try {
        const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(yeniLink);
        const fetchResp = await fetch(proxyUrl);
        const fetchData = await fetchResp.json();
        const html = fetchData.contents || "";
        const div = document.createElement("div");
        div.innerHTML = html;
        div.querySelectorAll("script,style,nav,footer,header").forEach(el => el.remove());
        sayfaIcerigi = (div.innerText || div.textContent || "").replace(/\s+/g, " ").trim().substring(0, 8000);
      } catch { sayfaIcerigi = ""; }

      const mesaj = sayfaIcerigi
        ? (kaynakTuru === "yonetmelik"
          ? "Bu web sayfasındaki yönetmelik/mevzuat içeriğini yukarıdaki talimata göre özetle.\nURL: " + yeniLink + "\n\nİÇERİK:\n" + sayfaIcerigi
          : "Bu web sayfası içeriğini PDR perspektifinden özetle.\nURL: " + yeniLink + "\n\nİÇERİK:\n" + sayfaIcerigi)
        : (kaynakTuru === "yonetmelik"
          ? "Bu web sayfasındaki yönetmelik/mevzuat içeriğini yukarıdaki talimata göre özetle: " + yeniLink
          : "Bu web sayfasının içeriğini PDR perspektifinden özetle: " + yeniLink);

      const bodyObj = {
        model: "claude-sonnet-4-6", max_tokens: 800,
        system: ozetSistemPrompt(),
        messages: [{ role: "user", content: mesaj }]
      };
      if (!sayfaIcerigi) bodyObj.tools = [{ type: "web_search_20250305", name: "web_search" }];

      const resp = await pdrCallClaude(bodyObj);
      const data = await resp.json();
      const ozet = data.content?.find(b => b.type === "text")?.text || "İçerik okunamadı.";
      await kaydet(ozet, baslik, yeniLink);
    } catch(e) { alert("Hata: " + e.message); }
    setYukleniyor(false);
  }
  async function handleMetin() {
    if (!yeniMetin.trim()) return;
    setYukleniyor(true);
    try {
      const ozet = await aiOzetle(yeniMetin, yeniBaslik);
      await kaydet(ozet, yeniBaslik, "metin");
    } catch(e) { alert("Hata: " + e.message); }
    setYukleniyor(false);
  }

  return (
    <div style={{background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:16, marginBottom:16}}>
      <div style={{fontSize:12, fontWeight:700, color:TEXT, marginBottom:12}}>Kaynak Ekle</div>
      <div style={{display:"flex", gap:6, marginBottom:14}}>
        {[["dosya","📄 Dosya"],["link","🔗 Link"],["metin","📝 Metin"]].map(([k,l]) => (
          <button key={k} onClick={() => setMod(k)} style={{
            flex:1, padding:"8px 4px", borderRadius:8,
            border:`2px solid ${mod===k ? ACCENT : BORDER}`,
            background:mod===k ? ACCENT_LIGHT : CARD,
            color:mod===k ? ACCENT : MUTED,
            fontSize:11, fontWeight:700, cursor:"pointer"
          }}>{l}</button>
        ))}
      </div>
      <label style={lbl}>KAYNAK TÜRÜ</label>

function Badge({ label, type }) {
  const color = type === "Veli" ? ORANGE : ACCENT;
  const bg = type === "Veli" ? "#FDEBD0" : ACCENT_LIGHT;
  return <span style={{ background: bg, color, borderRadius: 20, padding: "2px 10px", fontSize: 11, fontWeight: 700, whiteSpace: "nowrap" }}>{label}</span>;
}
function StatBar({ label, value, max, color = ACCENT }) {
  const pct = max > 0 ? Math.round((value / max) * 100) : 0;
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
        <span style={{ fontSize: 13, color: TEXT }}>{label}</span>
        <span style={{ fontSize: 13, fontWeight: 700, color }}>{value}</span>
      </div>
      <div style={{ height: 6, background: BORDER, borderRadius: 4 }}>
        <div style={{ width: `${pct}%`, height: "100%", background: color, borderRadius: 4 }} />
      </div>
    </div>
  );
}
