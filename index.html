function OgrenciYonetim({
  ogrenciler, setOgrenciler,
  records, setRecords,
  profiles, setProfiles,
  profiles2, setProfiles2,
  denemeler, setDenemeler,
  riskListesi, setRiskListesi,
  kayitliListesi, mudahalePlan, aktifYil, onYilEkrani,
  hazirlikNotlari, setHazirlikNotlari,
  ilerlemeNotlari, setIlerlemeNotlari,
  onRaporAc, setAktifOgrenci, aktifOgrenci, setTab, onSinifGuncelle, onOgrenciSil, onSinifSil, sinifListesi, sinavTuru, sevkler, testKayitlari, kademe
}) {
  const dersler = aktifDersler(sinavTuru);

  const [aramaMetni, setAramaMetni] = useState("");
  const [aramaDebounce, setAramaDebounce] = useState("");
  const [seciliOgrenci, setSeciliOgrenci] = useState(aktifOgrenci?.name || null);
  const [excelPanelAcik, setExcelPanelAcik] = useState(false);
  const [sinifGuncelleAcik, setSinifGuncelleAcik] = useState(false);
  const [yeniSinifDegeri, setYeniSinifDegeri] = useState("");

  // "Aktif öğrenci" başka bir sekmede seçilip buraya dönülürse, o öğrencinin
  // detayını göstermeye devam et — sadece açıkça "Geri" ile çıkıldığında
  // (aktifOgrenci boşaltıldığında) liste görünümüne dön.
  useEffect(() => {
    if (aktifOgrenci?.name) setSeciliOgrenci(aktifOgrenci.name);
    else setSeciliOgrenci(null);
  }, [aktifOgrenci?.name]);

  // Arama debounce — 300ms bekle
  useEffect(() => {
    const t = setTimeout(() => setAramaDebounce(aramaMetni), 300);
    return () => clearTimeout(t);
  }, [aramaMetni]);
  const [yeniForm, setYeniForm] = useState({ studentName:"", className:"", numara:"" });
  const [formAcik, setFormAcik] = useState(false);
  const [aktifSekme, setAktifSekme] = useState("ozet"); // ozet | gorusme | deneme | profil
  const [sinifFiltre, setSinifFiltre] = useState("Tümü");
  const [sinifSilAcik, setSinifSilAcik] = useState(false);
  const [sinifSiliniyor, setSinifSiliniyor] = useState(false);
  const [gorunumModu, setGorunumModu] = useState("liste"); // liste | aylik
  const [acikAylar, setAcikAylar] = useState({});
  const [duzenlemeId, setDuzenlemeId] = useState(null);
  const [duzenleForm, setDuzenleForm] = useState(null);
  const [duzenleAiLoading, setDuzenleAiLoading] = useState(false);

  async function handleDuzenleAiOzetle() {
    if (!duzenleForm?.raw?.trim()) return;
    setDuzenleAiLoading(true);
    const summary = await getAISummary(duzenleForm.raw);
    setDuzenleForm(f => ({ ...f, summary }));
    setDuzenleAiLoading(false);
  }

  async function handleGorusmeGuncelle(id, fields) {
    const updated = records.map(r => r.id === id ? { ...r, ...fields } : r);
    setRecords(updated);
    await saveRecords(updated);
    setDuzenlemeId(null);
    setDuzenleForm(null);
  }
  async function handleGorusmeSil(id) {
    const updated = records.filter(r => r.id !== id);
    setRecords(updated);
    await saveRecords(updated);
  }

  async function handleOgrenciSil(studentName) {
    const ad = studentName.toLowerCase().trim();
    const updOgr = ogrenciler.filter(o => o.studentName.toLowerCase().trim() !== ad);
    setOgrenciler(updOgr); await saveOgrenciler(updOgr);
    const updRec = records.filter(r => r.studentName?.toLowerCase().trim() !== ad);
    setRecords(updRec); await saveRecords(updRec);
    const updP1 = profiles.filter(p => p.studentName?.toLowerCase().trim() !== ad);
    setProfiles(updP1); await saveProfiles(updP1);
    const updP2 = profiles2.filter(p => p.studentName?.toLowerCase().trim() !== ad);
    setProfiles2(updP2); await saveProfiles2(updP2);
    const updDen = { ...denemeler };
    Object.keys(updDen).forEach(k => { if (k.toLowerCase().trim() === ad) delete updDen[k]; });
    setDenemeler(updDen); await saveDenemeler(updDen);
    const updRisk = riskListesi.filter(r => r.studentName?.toLowerCase().trim() !== ad);
    setRiskListesi(updRisk); await saveRiskListesi(updRisk);
    if (setAktifOgrenci) setAktifOgrenci({ name: "", className: "" });
    setSeciliOgrenci(null);
  }

  // Öğrenci listesi — aktif yıla göre filtrele (useMemo ile cache)
  const tumOgrenciler = useMemo(() =>
    ogrenciler
      .filter(o => !o.yil || o.yil === aktifYil)
      .slice()
      .sort((a,b) => (a.studentName||"").localeCompare(b.studentName||"", "tr")),
  [ogrenciler, aktifYil]);

  const filtreliListe = useMemo(() => tumOgrenciler.filter(o =>
    !aramaDebounce ||
    o.studentName?.toLowerCase().includes(aramaDebounce.toLowerCase()) ||
    o.className?.toLowerCase().includes(aramaDebounce.toLowerCase()) ||
    o.numara?.includes(aramaDebounce)
  ), [tumOgrenciler, aramaDebounce]);

  async function handleOgrenciSil(studentName, className, numara) {
    await onOgrenciSil(studentName, className, numara);
    if (aktifOgrenci?.name === studentName) setAktifOgrenci({ name: "", className: "" });
    setSeciliOgrenci(null);
  }


  async function handleOgrenciEkle() {
    if (!yeniForm.studentName.trim()) return;
    const yeni = { id: uid(), ...yeniForm, yil: aktifYil, tarih: today() };
    const updated = [yeni, ...ogrenciler];
    setOgrenciler(updated);
    await saveOgrenciler(updated);
    setSeciliOgrenci(yeniForm.studentName);
    if(setAktifOgrenci) setAktifOgrenci({ name: yeniForm.studentName, className: yeniForm.className });
    setYeniForm({ studentName:"", className:"", numara:"" });
    setFormAcik(false);
  }

  // Seçili öğrencinin verileri
  const seciliOgrenciSinif = tumOgrenciler.find(x => x.studentName === seciliOgrenci)?.className || "";
  const seciliOgrenciNumara = tumOgrenciler.find(x => x.studentName === seciliOgrenci)?.numara || "";
  const ogrRec = records.filter(r => pdrAyniOgrenci(r.studentName, r.className, seciliOgrenci, seciliOgrenciSinif, r.numara, seciliOgrenciNumara));
  const ogrP1 = profiles.find(p => pdrAyniOgrenci(p.studentName, p.className, seciliOgrenci, seciliOgrenciSinif, p.numara, seciliOgrenciNumara));
  const ogrP2 = profiles2.find(p => pdrAyniOgrenci(p.studentName, p.className, seciliOgrenci, seciliOgrenciSinif, p.numara, seciliOgrenciNumara));
  const ogrDeneme = pdrSozlukOku(denemeler, seciliOgrenci, seciliOgrenciSinif, seciliOgrenciNumara) || {};
  const sinif7Data = ogrDeneme["7sinif"] || null;
  const ogrRisk = riskListesi.filter(r => pdrAyniOgrenci(r.studentName, r.className, seciliOgrenci, seciliOgrenciSinif, r.numara, seciliOgrenciNumara) && !r.kapandi);
  const denemeGirilen = Object.entries(ogrDeneme).filter(([no]) => no !== "7sinif").sort((a,b)=>a[0]-b[0]).map(([no,nets])=>({
    no:parseInt(no), nets,
    toplam: dersler.reduce((s,d)=>s+(parseFloat(nets[d.key])||0),0)
  }));
  const denemeAvg = denemeGirilen.length ? (denemeGirilen.reduce((s,d)=>s+d.toplam,0)/denemeGirilen.length).toFixed(1) : null;

  const siniflar = [...new Set([...(sinifListesi||[]), ...tumOgrenciler.map(o=>(o.className||"").trim())].filter(Boolean))].sort((a,b)=>a.localeCompare(b,"tr"));

  const gosterilecek = filtreliListe.filter(o =>
    sinifFiltre === "Tümü" || (o.className||"").trim() === sinifFiltre
  );

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%" }}>

      {/* ── SOL: Öğrenci Listesi ─────────────────────────────────── */}
      {!seciliOgrenci ? (
        <div>
          <div style={{ background:"#EEF2FF", borderRadius:10, padding:"10px 14px", marginBottom:14, fontSize:13, color:BLUE, fontWeight:600 }}>
            👥 {tumOgrenciler.length} öğrenci kayıtlı · Seç veya yeni ekle
          </div>

          {/* Arama + Ekle */}
          <div style={{ display:"flex", gap:8, marginBottom:10 }}>
            <input placeholder="Ad, sınıf veya numara ara…" value={aramaMetni}
              onChange={e => setAramaMetni(e.target.value)}
              style={{ flex:1, padding:"9px 12px", border:`1px solid ${BORDER}`, borderRadius:10, fontSize:13, background:CARD, color:TEXT, outline:"none", boxSizing:"border-box" }} />
            <button onClick={() => setFormAcik(f=>!f)} style={{
              background:formAcik ? BORDER : ACCENT, color:formAcik ? MUTED : "#fff",
              border:"none", borderRadius:10, padding:"9px 14px", fontSize:12, fontWeight:700, cursor:"pointer", whiteSpace:"nowrap"
            }}>+ Yeni</button>
          </div>

          {/* Yeni öğrenci formu */}
          {formAcik && (
            <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:14, marginBottom:12 }}>
              <div style={{ fontSize:11, color:MUTED, background:BG, borderRadius:8, padding:"6px 10px", marginBottom:10, lineHeight:1.5 }}>
                💡 İstersen gizlilik için soyadı kısaltabilirsin (örn. "Ahmet Y.") — sistem numarayla da eşleştirme yapabildiği için sorun olmaz.
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                <div>
                  <label style={{ fontSize:11, fontWeight:600, color:MUTED, display:"block", marginBottom:3 }}>AD SOYAD</label>
                  <input placeholder="Ad Soyad" value={yeniForm.studentName}
                    onChange={e => setYeniForm(f=>({...f, studentName:e.target.value}))}
                    style={{ width:"100%", padding:"8px 10px", border:`1px solid ${BORDER}`, borderRadius:8, fontSize:13, boxSizing:"border-box" }} />
                </div>
                <div>
                  <label style={{ fontSize:11, fontWeight:600, color:MUTED, display:"block", marginBottom:3 }}>SINIF</label>
                  <input placeholder="8-A" value={yeniForm.className}
                    onChange={e => setYeniForm(f=>({...f, className:e.target.value}))}
                    style={{ width:"100%", padding:"8px 10px", border:`1px solid ${BORDER}`, borderRadius:8, fontSize:13, boxSizing:"border-box" }} />
                </div>
              </div>
              <div style={{ marginBottom:10 }}>
                <label style={{ fontSize:11, fontWeight:600, color:MUTED, display:"block", marginBottom:3 }}>ÖĞRENCİ NUMARASI</label>
                <input placeholder="örn. 1234" value={yeniForm.numara}
                  onChange={e => setYeniForm(f=>({...f, numara:e.target.value}))}
                  style={{ width:"100%", padding:"8px 10px", border:`1px solid ${BORDER}`, borderRadius:8, fontSize:13, boxSizing:"border-box" }} />
              </div>
              <button onClick={handleOgrenciEkle} disabled={!yeniForm.studentName.trim()} style={{
                width:"100%", padding:"10px", background:yeniForm.studentName ? ACCENT : BORDER,
                color:yeniForm.studentName ? "#fff" : MUTED, border:"none", borderRadius:10, fontSize:14, fontWeight:800, cursor:"pointer"
              }}>Kaydet ve Aç</button>
            </div>
          )}

          {/* Görünüm modu: Liste / Aylara Göre */}
          <div style={{ display:"flex", gap:6, marginBottom:10 }}>
            <button onClick={() => setGorunumModu("liste")} style={{
              flex:1, padding:"7px", borderRadius:9, border:`1px solid ${gorunumModu==="liste"?ACCENT:BORDER}`,
              background:gorunumModu==="liste"?ACCENT_LIGHT:CARD, color:gorunumModu==="liste"?ACCENT:MUTED,
              fontSize:12, fontWeight:700, cursor:"pointer"
            }}>📋 Liste</button>
            <button onClick={() => setGorunumModu("aylik")} style={{
              flex:1, padding:"7px", borderRadius:9, border:`1px solid ${gorunumModu==="aylik"?ACCENT:BORDER}`,
              background:gorunumModu==="aylik"?ACCENT_LIGHT:CARD, color:gorunumModu==="aylik"?ACCENT:MUTED,
              fontSize:12, fontWeight:700, cursor:"pointer"
            }}>📅 Aylara Göre</button>
          </div>

          {gorunumModu === "aylik" ? (
            (() => {
              const aylar = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
              const gruplar = {};
              records.forEach(r => {
                const parts = (r.date || "").split(".");
                if (parts.length !== 3) return;
                const ayIndex = parseInt(parts[1], 10) - 1;
                const anahtar = `${aylar[ayIndex] || parts[1]} ${parts[2]}`;
                if (!gruplar[anahtar]) gruplar[anahtar] = { sirala: parts[2] + parts[1].padStart(2,"0"), kayitlar: [] };
                const ogr = tumOgrenciler.find(o => pdrAyniOgrenci(o.studentName, o.className, r.studentName, r.className));
                gruplar[anahtar].kayitlar.push({
                  id: r.id, date: r.date, studentName: r.studentName,
                  className: r.className || ogr?.className || "", numara: ogr?.numara || "",
                });
              });
              const siraliAylar = Object.entries(gruplar).sort((a,b) => b[1].sirala.localeCompare(a[1].sirala));

              if (siraliAylar.length === 0) {
                return <div style={{ textAlign:"center", color:MUTED, marginTop:30, fontSize:13 }}>Henüz görüşme kaydı yok</div>;
              }
              return (
                <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                  {siraliAylar.map(([ay, veri]) => {
                    const acik = !!acikAylar[ay];
                    return (
                    <div key={ay} style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, overflow:"hidden" }}>
                      <div onClick={() => setAcikAylar(a => ({ ...a, [ay]: !a[ay] }))}
                        style={{ fontSize:13, fontWeight:800, color:ACCENT, padding:"12px 14px", display:"flex", alignItems:"center", gap:6, cursor:"pointer", background:acik?ACCENT_LIGHT:CARD }}>
                        <span style={{ display:"inline-block", transform:acik?"rotate(90deg)":"rotate(0deg)", transition:"transform 0.15s ease", fontSize:11 }}>›</span>
                        📅 {ay} <span style={{ fontSize:10, fontWeight:600, color:MUTED }}>({veri.kayitlar.length} görüşme)</span>
                      </div>
                      {acik && (
                        <div style={{ display:"flex", flexDirection:"column", gap:5, padding:"0 12px 12px" }}>
                          {veri.kayitlar
                            .slice()
                            .sort((a,b) => (a.date||"").localeCompare(b.date||""))
                            .map(k => (
                            <div key={k.id} onClick={() => { setSeciliOgrenci(k.studentName); if(setAktifOgrenci) setAktifOgrenci({ name:k.studentName, className:k.className||"" }); }}
                              style={{ background:BG, border:`1px solid ${BORDER}`, borderRadius:10, padding:"9px 12px", display:"flex", alignItems:"center", gap:8, cursor:"pointer" }}>
                              <span style={{ fontSize:11, color:MUTED, minWidth:44 }}>{k.date}</span>
                              <span style={{ flex:1, fontSize:13, fontWeight:700, color:TEXT }}>{k.studentName}</span>
                              <span style={{ fontSize:11, color:MUTED }}>{k.className}{k.numara ? ` · No: ${k.numara}` : ""}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    );
                  })}
                </div>
              );
            })()
          ) : (
          <>
          {/* Sınıf filtresi */}
          {siniflar.length > 0 && (
            <div style={{ display:"flex", gap:5, overflowX:"auto", marginBottom:10, paddingBottom:4 }}>
              {["Tümü", ...siniflar].map(s => (
                <button key={s} onClick={() => { setSinifFiltre(s); setSinifSilAcik(false); }} style={{
                  flexShrink:0, padding:"4px 10px", borderRadius:14,
                  border:`1px solid ${sinifFiltre===s ? ACCENT : BORDER}`,
                  background:sinifFiltre===s ? ACCENT_LIGHT : CARD,
                  color:sinifFiltre===s ? ACCENT : MUTED,
                  fontSize:11, fontWeight:sinifFiltre===s ? 700 : 500, cursor:"pointer"
                }}>{s}</button>
              ))}
            </div>
          )}

          {/* Seçili sınıfı sil — sadece belirli bir sınıf seçiliyken görünür */}
          {sinifFiltre !== "Tümü" && (
            <div style={{ marginBottom:10 }}>
              {!sinifSilAcik ? (
                <button onClick={() => setSinifSilAcik(true)} style={{
                  background:"none", border:"1px dashed #F28B82", color:"#C5221F",
                  borderRadius:8, padding:"5px 10px", fontSize:11, fontWeight:600, cursor:"pointer"
                }}>🗑 "{sinifFiltre}" sınıfını sil ({gosterilecek.length} öğrenci)</button>
              ) : (
                <div style={{background:"#FDECEA", border:"1px solid #F28B82", borderRadius:10, padding:10}}>
                  <div style={{fontSize:11, color:"#C0392B", marginBottom:8, lineHeight:1.6}}>
                    <b>"{sinifFiltre}"</b> sınıfındaki <b>{gosterilecek.length} öğrenci</b> ve bunlara ait tüm görüşme/risk/profil/deneme verisi kalıcı olarak silinecek. Diğer sınıflar etkilenmez.
                  </div>
                  <div style={{display:"flex", gap:8}}>
                    <button onClick={() => setSinifSilAcik(false)} style={{
                      flex:1, padding:"7px", background:CARD, border:`1px solid ${BORDER}`, borderRadius:8,
                      fontSize:11, fontWeight:700, color:MUTED, cursor:"pointer"
                    }}>Vazgeç</button>
                    <button onClick={async () => {
                      setSinifSiliniyor(true);
                      await onSinifSil(sinifFiltre);
                      setSinifSiliniyor(false);
                      setSinifSilAcik(false);
                      setSinifFiltre("Tümü");
                    }} disabled={sinifSiliniyor} style={{
                      flex:1, padding:"7px", background:"#C5221F", border:"none", borderRadius:8,
                      fontSize:11, fontWeight:700, color:"#fff", cursor:"pointer", opacity:sinifSiliniyor?0.6:1
                    }}>{sinifSiliniyor ? "Siliniyor..." : "Evet, Sil"}</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Öğrenci listesi — sadece arama yapıldığında veya belirli bir sınıf seçildiğinde gösterilir */}
          {(aramaDebounce.trim() || sinifFiltre !== "Tümü") ? (
          <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
            {gosterilecek.length === 0 && (
              <div style={{ textAlign:"center", color:MUTED, marginTop:30, fontSize:13 }}>Sonuç bulunamadı</div>
            )}
            {gosterilecek.slice(0, 50).map(o => {
              const oRec = records.filter(r => pdrAyniOgrenci(r.studentName, r.className, o.studentName, o.className, r.numara, o.numara));
              const oP1 = profiles.find(p => pdrAyniOgrenci(p.studentName, p.className, o.studentName, o.className, p.numara, o.numara));
              const oDenSozluk = pdrSozlukOku(denemeler, o.studentName, o.className, o.numara) || {};
              const o7sinif = oDenSozluk["7sinif"] || null;
              const oDen = Object.keys(oDenSozluk).filter(k => k !== "7sinif").length;
              const oRsk = riskListesi.filter(r => pdrAyniOgrenci(r.studentName, r.className, o.studentName, o.className, r.numara, o.numara) && !r.kapandi).length;
              // Manuel girilen (8. sınıf, Deneme 1-10) ortalaması varsa onu, yoksa 7. sınıf
              // deneme ortalamasını göster — "7sinif" anahtarı manuel deneme sanılıp
              // yanlışlıkla ortalamaya karışmaz (o zaman hep 0.0 çıkardı).
              const oDenAvgSayi = oDen > 0
                ? Object.entries(oDenSozluk).filter(([k])=>k!=="7sinif").reduce((s,[,nets])=>s+dersler.reduce((ss,d)=>ss+(parseFloat(nets[d.key])||0),0),0)/oDen
                : null;
              const oDenAvg = oDenAvgSayi !== null ? oDenAvgSayi.toFixed(1) : (o7sinif ? o7sinif.ortalama : null);
              // Deneme riski: 8. sınıfta manuel giriş varsa (daha güncel olduğu için) ondan
              // hesaplanır; hiç manuel giriş yoksa 7. sınıfın (Excel'den gelen) risk
              // etiketine geri dönülür. İkisi çakışırsa 8. sınıf esas alınır.
              const oDenRisk = oDenAvgSayi !== null
                ? denemeRiskHesapla(oDenAvgSayi, dersler)
                : (o7sinif?.risk || null);
              const oDenRiskKaynak = oDenAvgSayi !== null ? "Bu dönem denemeleri" : "Geçmiş dönem denemeleri";

              // Kategori: Riskli / Takip Gerekli / İyi Gidiyor — öncelik sırası:
              // 1) Açık risk kaydı  2) Görüşme (yakın zamanda yapılmışsa yeterli sayılır)
              // 3) Görüşme yoksa/eskiyse deneme riskine bakılır (8. sınıf varsa öncelikli,
              // yoksa 7. sınıf). Etikette (kaynak) olarak hangi veriye dayandığı belirtilir.
              const oPdrParse = d => { const [g,ay,y] = (d||"").split("."); return new Date(`${y}-${ay}-${g}`); };
              const oSonGorusmeTarihi = oRec.length > 0 ? oRec.reduce((en, r) => (!en || oPdrParse(r.date) > oPdrParse(en)) ? r.date : en, null) : null;
              const oGunFarki = oSonGorusmeTarihi ? Math.round((new Date() - oPdrParse(oSonGorusmeTarihi)) / (1000*60*60*24)) : null;
              const oGorusmeYakinMi = oGunFarki !== null && oGunFarki <= 60;
              let oKategori, oKaynak;
              if (oRsk > 0) {
                oKategori = { label: "🔴 Riskli", bg: "#FDECEA", color: "#C0392B" }; oKaynak = "Risk kaydı";
              } else if (oRec.length > 0 && oGorusmeYakinMi) {
                oKategori = { label: "🟢 İyi Gidiyor", bg: "#E6F5EE", color: "#1A8C5B" }; oKaynak = "Görüşme";
              } else if (oDenRisk === "yuksek") {
                oKategori = { label: "🔴 Riskli", bg: "#FDECEA", color: "#C0392B" }; oKaynak = oDenRiskKaynak;
              } else if (oDenRisk === "dusuk") {
                oKategori = { label: "🟢 İyi Gidiyor", bg: "#E6F5EE", color: "#1A8C5B" }; oKaynak = oDenRiskKaynak;
              } else {
                oKategori = { label: "🟡 Takip Gerekli", bg: "#FDF6E3", color: "#B07D1A" };
                oKaynak = oRec.length > 0 ? "Görüşme" : (oDenRisk ? oDenRiskKaynak : "");
              }
              const oAniDegisim = aniDegisimHesapla(o, records, riskListesi, sevkler, denemeler, testKayitlari, dersler, profiles);

              return (
                <div key={pdrOgrAnahtar(o.studentName, o.className, o.numara)} style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:"10px 14px", display:"flex", flexDirection:"column", gap:6 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    {/* Tıklanabilir alan: avatar + isim/sınıf/no */}
                    <div onClick={() => { setSeciliOgrenci(o.studentName); if(setAktifOgrenci) setAktifOgrenci({ name: o.studentName, className: o.className || "" }); }}
                      style={{ display:"flex", alignItems:"center", gap:10, flex:1, cursor:"pointer", minWidth:0 }}>
                      <div style={{ width:34, height:34, borderRadius:"50%", background:ACCENT_LIGHT, color:ACCENT, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, fontSize:14, flexShrink:0 }}>
                        {o.studentName.charAt(0).toUpperCase()}
                      </div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontWeight:700, fontSize:14, color:TEXT, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{o.studentName}</div>
                        <div style={{ fontSize:11, color:MUTED, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{o.className}{o.numara ? ` · No: ${o.numara}` : ""}</div>
                      </div>
                      <span style={{ color:MUTED, fontSize:16, flexShrink:0 }}>›</span>
                    </div>
                    {/* Sil butonu */}
                    <SilButonu onSil={() => handleOgrenciSil(o.studentName, o.className, o.numara)} />
                  </div>
                  {/* Rozetler — kendi satırında, avatar hizasından başlıyor */}
                  <div style={{ display:"flex", gap:4, flexWrap:"wrap", paddingLeft:44 }}>
                    <span style={{ background:oKategori.bg, color:oKategori.color, borderRadius:12, padding:"2px 7px", fontSize:10, fontWeight:800, whiteSpace:"nowrap" }}>{oKategori.label}{oKaynak ? ` · ${oKaynak}` : ""}</span>
                    {oAniDegisim.sinyalSayisi >= 2 && (
                      <span title={oAniDegisim.sinyaller.map(s=>`${s.tur}: ${s.detay}`).join(" · ")} style={{ background:"#FFF4E5", color:"#B7791F", borderRadius:12, padding:"2px 7px", fontSize:10, fontWeight:800, whiteSpace:"nowrap" }}>🔶 Ani Değişim ({oAniDegisim.sinyalSayisi})</span>
                    )}
                    {oRec.length > 0 && <span style={{ background:ACCENT_LIGHT, color:ACCENT, borderRadius:12, padding:"2px 6px", fontSize:10, fontWeight:700 }}>{oRec.length} görüşme</span>}
                    {oDenAvg && <span style={{ background:"#EEF2FF", color:BLUE, borderRadius:12, padding:"2px 6px", fontSize:10, fontWeight:700 }}>Ort:{oDenAvg}</span>}
                    {oP1 && <span style={{ background:ACCENT_LIGHT, color:ACCENT, borderRadius:12, padding:"2px 6px", fontSize:10, fontWeight:700 }}>P1</span>}
                  </div>
                </div>
              );
            })}
            {gosterilecek.length > 50 && (
              <div style={{ textAlign:"center", color:MUTED, fontSize:11, padding:"8px 0" }}>
                +{gosterilecek.length - 50} öğrenci daha var — aramayı daraltmak için yazmaya devam et
              </div>
            )}
          </div>
          ) : (
            <div style={{ textAlign:"center", color:MUTED, marginTop:30, marginBottom:16, fontSize:13 }}>
              🔍 Öğrenciyi bulmak için yukarıdaki kutuya yaz veya bir sınıf seç
            </div>
          )}
          </>
          )}
        </div>
      ) : (
        /* ── SAĞ: Öğrenci Detay ──────────────────────────────── */
        <div>
          {/* Geri + Başlık */}
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14, flexWrap:"wrap", rowGap:8 }}>
            <button onClick={() => { setSeciliOgrenci(null); setAktifSekme("ozet"); setAktifOgrenci({ name: "", className: "" }); }} style={{
              background:BG, border:`1px solid ${BORDER}`, borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:700, color:MUTED, cursor:"pointer"
            }}>← Geri</button>
            <button onClick={() => handleOgrenciSil(seciliOgrenci, seciliOgrenciSinif, seciliOgrenciNumara)} style={{
              background:"none", border:"1px solid #F28B82", color:"#C5221F",
              borderRadius:8, padding:"6px 12px", fontSize:11, fontWeight:700, cursor:"pointer"
            }}>🗑 Öğrenciyi Sil</button>
            <button onClick={() => { setYeniSinifDegeri(seciliOgrenciSinif); setSinifGuncelleAcik(true); }} style={{
              background:"none", border:`1px solid ${ACCENT}`, color:ACCENT,
              borderRadius:8, padding:"6px 12px", fontSize:11, fontWeight:700, cursor:"pointer"
            }}>🎓 Sınıf Güncelle</button>
            <div style={{ flex:1, minWidth:120 }}>
              <div style={{ fontWeight:800, fontSize:16, color:TEXT }}>{seciliOgrenci}</div>
              {(() => { const o = tumOgrenciler.find(x=>x.studentName===seciliOgrenci); return o ? <div style={{ fontSize:11, color:MUTED }}>{o.className}{o.numara ? ` · No: ${o.numara}` : ""}</div> : null; })()}
            </div>
            {ogrRisk.length > 0 && <span style={{ background:"#FDECEA", color:"#C0392B", borderRadius:8, padding:"4px 10px", fontSize:11, fontWeight:700 }}>⚠ Risk</span>}
            <button onClick={() => {
              onRaporAc({
                ogrenci: seciliOgrenci,
                ogrenciSinif: seciliOgrenciSinif,
                profil1: ogrP1 || null,
                profil2: ogrP2 || null,
                gorusmeler: ogrRec,
                denemeler: ogrDeneme
              });
            }} style={{ background:ACCENT, color:"#fff", border:"none", borderRadius:8, padding:"6px 12px", fontSize:11, fontWeight:700, cursor:"pointer" }}>📄 Rapor</button>
          </div>

          {sinifGuncelleAcik && (
            <div style={{ background:ACCENT_LIGHT, border:`1px solid ${ACCENT}`, borderRadius:10, padding:12, marginBottom:14 }}>
              <div style={{ fontSize:12, fontWeight:700, color:ACCENT, marginBottom:8 }}>
                🎓 Sınıf Güncelle — öğrencinin sınıfı değiştiğinde (örn. 7-A → 8-A) tüm geçmiş verisi (görüşme, risk, profil, deneme) otomatik olarak yeni sınıfa taşınır.
              </div>
              <div style={{ display:"flex", gap:8 }}>
                <input value={yeniSinifDegeri} onChange={e=>setYeniSinifDegeri(e.target.value)} placeholder="Yeni sınıf (örn. 8-A)"
                  style={{ flex:1, padding:"8px 10px", border:`1px solid ${BORDER}`, borderRadius:8, fontSize:13, boxSizing:"border-box" }} />
                <button onClick={() => { setSinifGuncelleAcik(false); }} style={{ padding:"8px 12px", background:BG, border:`1px solid ${BORDER}`, borderRadius:8, fontSize:12, fontWeight:700, color:MUTED, cursor:"pointer" }}>İptal</button>
                <button onClick={async () => {
                  if (!yeniSinifDegeri.trim() || yeniSinifDegeri.trim() === seciliOgrenciSinif) { setSinifGuncelleAcik(false); return; }
                  await onSinifGuncelle(seciliOgrenci, seciliOgrenciSinif, seciliOgrenciNumara, yeniSinifDegeri.trim());
                  setSinifGuncelleAcik(false);
                }} disabled={!yeniSinifDegeri.trim()} style={{ padding:"8px 14px", background:yeniSinifDegeri.trim()?ACCENT:BORDER, color:yeniSinifDegeri.trim()?"#fff":MUTED, border:"none", borderRadius:8, fontSize:12, fontWeight:700, cursor:"pointer" }}>💾 Kaydet</button>
              </div>
            </div>
          )}

          {/* Alt sekmeler */}
          <div style={{ display:"flex", gap:4, marginBottom:14, borderBottom:`1px solid ${BORDER}`, paddingBottom:0 }}>
            {[
              { key:"ozet", label:"Özet" },
              { key:"gorusme", label:`Görüşme (${ogrRec.length})` },
              { key:"deneme", label:`Deneme (${Object.keys(ogrDeneme).length})` },
              { key:"profil", label:"Profil" },
            ].map(s => (
              <button key={s.key} onClick={() => setAktifSekme(s.key)} style={{
                padding:"8px 10px", border:"none", background:"none",
                color:aktifSekme===s.key ? ACCENT : MUTED,
                fontWeight:aktifSekme===s.key ? 700 : 500,
                fontSize:12, cursor:"pointer",
                borderBottom:aktifSekme===s.key ? `3px solid ${ACCENT}` : "3px solid transparent"
              }}>{s.label}</button>
            ))}
          </div>

          {/* ÖZET — Canlı Öğrenci Kartı */}
          {aktifSekme === "ozet" && (
            <OzetKarti
              ogrenci={seciliOgrenci}
              ogrenciSinif={seciliOgrenciSinif}
              ogrRec={ogrRec}
              ogrP1={ogrP1}
              ogrP2={ogrP2}
              ogrRisk={ogrRisk}
              denemeGirilen={denemeGirilen}
              denemeAvg={denemeAvg}
              mudahalePlan={mudahalePlan || {}}
              hazirlikNotlari={hazirlikNotlari}
              setHazirlikNotlari={setHazirlikNotlari}
              ilerlemeNotlari={ilerlemeNotlari}
              setIlerlemeNotlari={setIlerlemeNotlari}
              setTab={setTab}
              devamsizlikGecmisi={tumOgrenciler.find(x => x.studentName === seciliOgrenci)?.devamsizlikGecmisi || []}
              onDevamsizlikGuncelle={async (yeniDeger) => {
                const hedefOgr = tumOgrenciler.find(x => x.studentName === seciliOgrenci);
                const eskiGecmis = hedefOgr?.devamsizlikGecmisi || [];
                const yeniGecmis = [...eskiGecmis, { tarih: today(), gun: yeniDeger }];
                const updated = ogrenciler.map(o => pdrAyniOgrenci(o.studentName, o.className, seciliOgrenci, seciliOgrenciSinif, o.numara, seciliOgrenciNumara) ? { ...o, devamsizlik: yeniDeger, devamsizlikGecmisi: yeniGecmis } : o);
                setOgrenciler(updated);
                await saveOgrenciler(updated);
              }}
              kademe={kademe}
              olayKayitlari={tumOgrenciler.find(x => x.studentName === seciliOgrenci)?.olayKayitlari || []}
              onOlayEkle={async (yeniOlay) => {

// hangi sınav türünü seçerse, Deneme sekmesindeki dersler, Excel/manuel giriş
// ve risk hesaplaması otomatik olarak ona göre ayarlanır.
const SINAV_TURLERI = {

  tyt: { ad: "TYT (Lise — Ortak)", dersler: [
