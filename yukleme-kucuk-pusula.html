<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Yükleme — Küçük Pusulalar</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#2D6A4F; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; font-family:'Segoe UI', system-ui, sans-serif; font-size:18px; font-weight:700; gap:16px;
  }
  #orbit { position:relative; width:70px; height:70px; }
  .mini {
    position:absolute; top:50%; left:50%; width:20px; height:20px; margin:-10px;
    animation:fade 1.4s linear infinite;
  }
  .mini svg { width:100%; height:100%; display:block; }
  .mini:nth-child(1){ transform:rotate(0deg) translateX(28px); animation-delay:0s; }
  .mini:nth-child(2){ transform:rotate(60deg) translateX(28px); animation-delay:-1.17s; }
  .mini:nth-child(3){ transform:rotate(120deg) translateX(28px); animation-delay:-0.93s; }
  .mini:nth-child(4){ transform:rotate(180deg) translateX(28px); animation-delay:-0.70s; }
  .mini:nth-child(5){ transform:rotate(240deg) translateX(28px); animation-delay:-0.47s; }
  .mini:nth-child(6){ transform:rotate(300deg) translateX(28px); animation-delay:-0.23s; }
  @keyframes fade { 0%,100%{opacity:0.2; } 50%{opacity:1;} }
  .badge { position:fixed; top:14px; font-size:12px; opacity:0.7; font-weight:400; }
</style>
</head>
<body>
  <div class="badge">ÖNİZLEME — Küçük Pusulalar (turuncu)</div>
  <div id="orbit">
    <div class="mini"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#FB923C" stroke-width="2.5"/><polygon points="20,7 24,20 20,33 16,20" fill="#FB923C"/></svg></div>
    <div class="mini"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#FB923C" stroke-width="2.5"/><polygon points="20,7 24,20 20,33 16,20" fill="#FB923C"/></svg></div>
    <div class="mini"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#FB923C" stroke-width="2.5"/><polygon points="20,7 24,20 20,33 16,20" fill="#FB923C"/></svg></div>
    <div class="mini"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#FB923C" stroke-width="2.5"/><polygon points="20,7 24,20 20,33 16,20" fill="#FB923C"/></svg></div>
    <div class="mini"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#FB923C" stroke-width="2.5"/><polygon points="20,7 24,20 20,33 16,20" fill="#FB923C"/></svg></div>
    <div class="mini"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#FB923C" stroke-width="2.5"/><polygon points="20,7 24,20 20,33 16,20" fill="#FB923C"/></svg></div>
  </div>
  <div>PDR Program</div>
  <div style="font-size:13px;opacity:0.7;font-weight:400">Yükleniyor...</div>
</body>
</html>
